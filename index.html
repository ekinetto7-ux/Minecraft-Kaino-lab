<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER TERMINAL - Auto Stream & 3-Letter Commands</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.4;
            height: 85%;
            overflow-y: auto;
        }
        #input-area {
            display: flex;
            align-items: center;
            font-size: 18px;
            margin-top: 10px;
            border-top: 1px solid #003311;
            padding-top: 10px;
        }
        .prompt {
            color: #33ccff;
            font-weight: bold;
            margin-right: 8px;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            outline: none;
            width: 100%;
        }
        .warning { color: #ff3333; font-weight: bold; }
        .success { color: #33ccff; }
        .system { color: #ffcc00; }
        .stream { color: #00aa44; }
    </style>
</head>
<body>

    <div id="terminal">
        <span class="system">=== SECURE SHELL v4.2.1 (x86_64-pc-gnu) ===</span>
        Type <span class="success">hlp</span> for commands, or <span class="success">aut</span> to start auto-hacking stream.
    </div>

    <div id="input-area">
        <span class="prompt">root@system:~$</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        
        let autoStreamInterval = null;

        // 画面をクリックしたら常に入力欄にフォーカスが当たる
        document.addEventListener('click', () => input.focus());

        // エンターキーを押したときの処理
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                
                // コマンドを入力したら自動ストリームは一旦止める
                stopAutoStream();

                appendOutput(`root@system:~$ ${cmd}`);
                processCommand(cmd);

                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // 自動で文字が流れ出すストリーム機能
        function startAutoStream() {
            if (autoStreamInterval) return; // 既に動いていれば何もしない

            appendOutput("[*] AUTO-HACK STREAM ACTIVATED. (Type any command to stop)", "system");

            const streamLogs = [
                "BYPASSING KERNEL FIREWALL...",
                "DECRYPTING HASH: 0x8F9A2C1B4E...",
                "INJECTING SHELLCODE INTO PORT 443...",
                "ACCESSING REMOTE DATABASE: user_records.db...",
                "TRACING ENCRYPTED PROXY [10.42.8.1]...",
                "DOWNLOADING PAYLOAD... [OK]",
                "OVERRIDING BIOMETRIC SENSORS...",
                "ROOT ACCESS GRANTED. WELCOME BACK, ADMIN.",
                "SENDING PACKETS -> DESTINATION: 192.168.1.105",
                "CLEANING UP SYSTEM LOGS...",
                "WARNING: ANOMALY DETECTED IN SECTOR 7",
                "ROUTING THROUGH SECURE TOR NETWORK..."
            ];

            let index = 0;
            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                const prefix = Math.random() > 0.5 ? "[+] " : "[x] ";
                appendOutput(prefix + log, "stream");
            }, 300); // 0.3秒ごとに文字が流れる
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

        // 3文字コマンドの定義
        function processCommand(cmd) {
            if (cmd.length !== 3 && cmd !== '') {
                appendOutput("Error: Commands must be exactly 3 characters. Type 'hlp'.", "warning");
                return;
            }

            switch(cmd) {
                case 'hlp':
                    appendOutput("Available 3-letter commands:", "system");
                    appendOutput("  hlp : Show help list");
                    appendOutput("  aut : Start auto-hacking text stream");
                    appendOutput("  stp : Stop auto-hacking stream");
                    appendOutput("  hak : Initiate main system hack");
                    appendOutput("  inf : Display network info & IP");
                    appendOutput("  pwd : Print working directory");
                    appendOutput("  ls  : List directory contents");
                    appendOutput("  dlc : Download encrypted database");
                    appendOutput("  cls : Clear terminal screen");
                    appendOutput("  rst : System hard reset");
                    break;

                case 'aut':
                    startAutoStream();
                    break;

                case 'stp':
                    stopAutoStream();
                    appendOutput("[*] Stream stopped by user.", "warning");
                    break;

                case 'hak':
                    appendOutput("[!] Bypassing firewall...", "warning");
                    appendOutput("[*] Injecting payload into kernel...");
                    appendOutput("[OK] Access granted. Welcome, Admin.", "success");
                    break;

                case 'inf':
                    appendOutput("TARGET HOST: 192.168.1.105");
                    appendOutput("GATEWAY: 10.0.0.1 (SECURE)");
                    appendOutput("ENCRYPTION: AES-256-GCM [ACTIVE]", "success");
                    break;

                case 'pwd':
                    appendOutput("/var/root/secure/kernel/sys_core");
                    break;

                case 'ls ':
                case 'ls_':
                case 'dir':
                    appendOutput("total 48");
                    appendOutput("drwx------  2 root root 4096 Oct 15 06:10 .");
                    appendOutput("-rw-r--r--  1 root root  512 payload.bin");
                    appendOutput("-rwxr-xr-x  1 root root 1024 override.sh", "success");
                    break;

                case 'dlc':
                    appendOutput("Connecting to remote server...");
                    appendOutput("Downloading user_data_backup.db (1.24 GB)... [████████████] 100%");
                    appendOutput("Download complete. Saved to /tmp/", "success");
                    break;

                case 'cls':
                    terminal.innerHTML = "";
                    break;

                case 'rst':
                    appendOutput("Rebooting kernel...", "warning");
                    setTimeout(() => {
                        terminal.innerHTML = '<span class="system">=== SYSTEM RESTARTED ===</span>\nType <span class="success">hlp</span> to start.';
                    }, 800);
                    break;

                default:
                    if (cmd === '') break;
                    appendOutput(`Command '${cmd}' not recognized. Type 'hlp' for help.`, "warning");
                    break;
            }
        }
    </script>
</body>
</html>
