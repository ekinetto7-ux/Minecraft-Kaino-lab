<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL - OVERDRIVE PRO JMA</title>
    <style>
        :root {
            --bg-color: #010206;
            --frame-bg: rgba(2, 6, 18, 0.85);
            --header-bg: rgba(6, 12, 28, 0.9);
            --main-color: #00ffcc;
            --main-glow: rgba(0, 255, 204, 0.6);
            --accent-pink: #ff007f;
            --accent-blue: #00aaff;
            --accent-yellow: #ffcc00;
            --accent-red: #ff1144;
            --accent-purple: #b026ff;
            --border-color: rgba(0, 255, 204, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.5s ease;
            position: relative;
        }

        /* 背景のサイバーオーラ（光のモヤ） */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--main-glow) 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            transition: all 0.5s ease;
        }

        /* 画面走査線（CRT Scanline エフェクト） */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
        }

        /* ホログラム風の枠線と立体感 */
        #window-frame {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1050px;
            height: 92vh;
            background: var(--frame-bg);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px var(--main-glow), inset 0 0 30px rgba(0, 0, 0, 0.8);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* ヘッダーデザイン */
        .window-header {
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .window-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .window-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }
        .btn-red { background-color: #ff5f56; box-shadow: 0 0 8px #ff5f56; }
        .btn-yellow { background-color: #ffbd2e; box-shadow: 0 0 8px #ffbd2e; }
        .btn-green { background-color: #27c93f; box-shadow: 0 0 8px #27c93f; }

        .window-title {
            font-size: 12px;
            color: #a0b0cb;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .header-status {
            font-size: 10px;
            color: var(--main-color);
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px var(--main-glow);
            text-shadow: 0 0 5px var(--main-color);
            transition: all 0.3s ease;
        }

        /* ターミナル表示エリア */
        #terminal {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
            padding: 22px;
            scroll-behavior: smooth;
            text-shadow: 0 0 5px var(--main-glow);
        }

        /* カスタムスクロールバー */
        #terminal::-webkit-scrollbar {
            width: 6px;
        }
        #terminal::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }
        #terminal::-webkit-scrollbar-thumb {
            background: var(--main-color);
            border-radius: 3px;
            box-shadow: 0 0 10px var(--main-color);
        }

        /* 入力フォーム */
        #command-form {
            display: flex;
            align-items: center;
            font-size: 15px;
            padding: 14px 22px;
            background-color: rgba(0, 0, 0, 0.7);
            border-top: 1px solid var(--border-color);
        }

        .prompt {
            color: var(--accent-pink);
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
            text-shadow: 0 0 8px var(--accent-pink);
        }

        #command-input {
            background: transparent;
            border: none;
            color: var(--main-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            width: 100%;
            text-shadow: 0 0 6px var(--main-color);
        }

        .hidden-input {
            color: transparent !important;
            text-shadow: 0 0 12px var(--main-color);
        }

        /* テキストカラー＆発光クラス */
        .warning { color: #ff3366; font-weight: bold; text-shadow: 0 0 8px #ff3366; }
        .success { color: var(--main-color); text-shadow: 0 0 8px var(--main-color); }
        .system { color: #ffaa00; text-shadow: 0 0 8px #ffaa00; }
        .dev { color: var(--accent-blue); text-shadow: 0 0 8px var(--accent-blue); }
        .police { color: var(--accent-yellow); font-weight: bold; text-shadow: 0 0 10px var(--accent-yellow); }
        .vivant { color: var(--accent-red); font-weight: bold; text-shadow: 0 0 12px var(--accent-red); }
        .matrix { color: #00ff00; text-shadow: 0 0 8px #00ff00; }
        .secret { color: var(--accent-purple); font-weight: bold; text-shadow: 0 0 10px var(--accent-purple); }
        .dim { color: rgba(255, 255, 255, 0.25); }

        /* スマートな枠線発光演出 */
        .flash-effect {
            box-shadow: 0 0 80px var(--accent-purple), inset 0 0 40px var(--accent-purple) !important;
        }
    </style>
</head>
<body>

    <!-- 走査線レイヤー -->
    <div class="scanlines"></div>

    <div id="window-frame">
        <div class="window-header">
            <div class="window-left">
                <div class="window-buttons">
                    <div class="btn btn-red"></div>
                    <div class="btn btn-yellow"></div>
                    <div class="btn btn-green"></div>
                </div>
                <div class="window-title" id="shell-title">root@cyber-boot:~</div>
            </div>
            <div class="header-status" id="sec-badge">SYSTEM: BOOTING</div>
        </div>

        <div id="terminal"></div>

        <form id="command-form">
            <span class="prompt" id="prompt-label">PASSCODE:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false" class="hidden-input">
        </form>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        const form = document.getElementById('command-form');
        const promptLabel = document.getElementById('prompt-label');
        const secBadge = document.getElementById('sec-badge');
        const shellTitle = document.getElementById('shell-title');
        const windowFrame = document.getElementById('window-frame');
        
        let autoStreamInterval = null;
        let isProcessing = true;
        let isBooting = true;
        let isLocked = true;
        let isDevMode = false;
        let isColorMode = false;
        const devVariables = {};

        // デフォルトカラー設定（アンバー初期起動）
        document.documentElement.style.setProperty('--main-color', '#ffaa00');
        document.documentElement.style.setProperty('--main-glow', 'rgba(255, 170, 0, 0.6)');
        document.documentElement.style.setProperty('--border-color', 'rgba(255, 170, 0, 0.5)');

        document.addEventListener('click', () => { 
            if (!isProcessing || isLocked) input.focus(); 
        });

        window.onload = () => { 
            runBootSequence();
        };

        // 起動準備（BOOT）アニメーション
        function runBootSequence() {
            input.disabled = true;
            const bootLogs = [
                "[BOOT] INITIALIZING CYBER KERNEL v14.2...",
                "[BOOT] CHECKING CPU INTEGRITY... OK",
                "[BOOT] CONNECTING TO JAPAN METEOROLOGICAL AGENCY API... READY",
                "[BOOT] ALLOCATING MEMORY HEAP... OK",
                "[BOOT] MOUNTING ENCRYPTED FILE SYSTEM... OK",
                "[BOOT] LOADED SECURITY MODULES (AES-256 / RSA-4096)",
                "==================================================",
                "  SYSTEM LOCKED. ENTER PASSCODE TO INITIALIZE.",
                "=================================================="
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < bootLogs.length) {
                    appendOutput(bootLogs[index], index >= 6 ? "system" : "dim");
                    index++;
                } else {
                    clearInterval(timer);
                    isBooting = false;
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 110);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isProcessing && !isLocked) return;

            const rawText = input.value;
            const text = rawText.trim();
            if (text === '') return;
            
            input.value = '';

            // ロック中（起動時＆lokコマンド共通）のパスワード判定 (911)
            if (isLocked) {
                appendOutput(`PASSCODE: *********`);
                if (text === '911') {
                    isLocked = false;
                    setThemeColor('#00ffcc', 'rgba(0, 255, 204, 0.6)', 'CYBER CYAN');
                    
                    promptLabel.textContent = "root@cyber:~#";
                    promptLabel.style.color = "#ff007f";
                    input.classList.remove('hidden-input');
                    shellTitle.textContent = "root@cyber-mainframe:~";
                    secBadge.textContent = "SYSTEM: OVERDRIVE";
                    secBadge.style.color = "#00ffcc";

                    appendOutput("[OK] ACCESS GRANTED. SYSTEM UNLOCKED.", "success");
                    appendOutput("\n==================================================", "system");
                    appendOutput("  CYBER TERMINAL v14.2 [REALTIME JMA DATA INTEGRATED]", "system");
                    appendOutput("==================================================", "system");
                    appendOutput("Type 'jp' for commands, 'eq' for real-time earthquake data, 'col' for color room.");
                } else {
                    appendOutput("[X] ACCESS DENIED. WRONG PASSCODE.", "warning");
                }
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            // カラー設定モード（COLOR CONFIG ROOM）の処理
            if (isColorMode) {
                appendOutput(`COLOR-CONFIG> ${rawText}`);
                processColorCommand(text.toLowerCase());
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            // 手動コード実行モード（DEV MODE）の処理
            if (isDevMode) {
                appendOutput(`DEV-MODE> ${rawText}`);
                processDevCommand(text);
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            // 通常モード時の自動ログ停止
            if (text.toLowerCase() !== 'aut' && text.toLowerCase() !== 'stp') {
                stopAutoStream();
            }

            appendOutput(`root@cyber:~# ${rawText}`);
            processCommand(text.toLowerCase());
            terminal.scrollTop = terminal.scrollHeight;
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function triggerPulse() {
            windowFrame.classList.add('flash-effect');
            setTimeout(() => {
                windowFrame.classList.remove('flash-effect');
            }, 400);
        }

        function setThemeColor(colorHex, colorGlow, themeName) {
            document.documentElement.style.setProperty('--main-color', colorHex);
            document.documentElement.style.setProperty('--main-glow', colorGlow);
            document.documentElement.style.setProperty('--border-color', colorGlow);
            if (!isBooting && !isLocked) {
                appendOutput(`[THEME] OVERRIDDEN TO ${themeName}.`, "success");
            }
        }

        function runSimulatedTask(title, successMsg, callback) {
            isProcessing = true;
            input.disabled = true;

            appendOutput(`[*] ${title}...`, "system");
            let progress = 0;
            
            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 25) + 15;
                if (progress >= 100) progress = 100;
                
                const bars = '█'.repeat(Math.floor(progress / 10)) + '░'.repeat(10 - Math.floor(progress / 10));
                terminal.lastChild.textContent = `[*] ${title}... [${bars}] ${progress}%`;

                if (progress === 100) {
                    clearInterval(timer);
                    appendOutput(`[OK] ${successMsg}`, "success");
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                    if (callback) callback();
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }, 80);
        }

        // 気象庁 API リアルタイム地震情報フェッチ処理 (eq)
        async function fetchRealtimeEarthquakeData() {
            isProcessing = true;
            input.disabled = true;

            appendOutput("[*] ESTABLISHING DIRECT SOCKET TO JMA (JAPAN METEOROLOGICAL AGENCY)...", "system");
            appendOutput("[*] FETCHING LIVE SEISMIC DATABASE PACKETS...", "dim");

            try {
                // 気象庁公式の最新地震リストAPI (JSON)
                const response = await fetch('https://www.jma.go.jp/bosai/quake/data/list.json');
                if (!response.ok) throw new Error("HTTP connection failed");
                const quakeList = await response.json();

                appendOutput("[OK] PACKET RECEIVED. DECODING SEISMIC DATA...", "success");
                appendOutput("==================================================", "police");
                appendOutput("  【気象庁 リアルタイム地震観測データ】", "police");
                appendOutput("==================================================", "police");

                // 最新5件の地震情報を抽出して表示
                const maxCount = Math.min(quakeList.length, 5);
                for (let i = 0; i < maxCount; i++) {
                    const eq = quakeList[i];
                    const time = eq.ctt ? eq.ctt : "不明";
                    const loc = eq.anm ? eq.anm : "震源情報解析中";
                    const maxInt = eq.max ? eq.max : "-";
                    const mag = eq.mag ? eq.mag : "不明";

                    appendOutput(`[#${i+1}] 発生日時: ${time}`, "system");
                    appendOutput(`     震源地  : ${loc}`, "success");
                    appendOutput(`     最大震度: 震度${maxInt}  |  マグニチュード: M${mag}`);
                    appendOutput("--------------------------------------------------", "dim");
                }
            } catch (err) {
                appendOutput("[X] FAILED TO CONNECT TO JMA LIVE API.", "warning");
                appendOutput("    (CORS制限または通信エラーが発生しました。フォールバックログを表示します)", "dim");
                appendOutput("--------------------------------------------------", "dim");
                appendOutput("[RECENT RECORD] 震源地: 千葉県北東部 | 最大震度: 3 | M4.2", "system");
            } finally {
                isProcessing = false;
                input.disabled = false;
                input.focus();
            }
        }

        // 気象庁 API リアルタイム防災・気象フィードフェッチ処理 (wx)
        async function fetchRealtimeWeatherWarnings() {
            isProcessing = true;
            input.disabled = true;

            appendOutput("[*] SCANNING JMA WEATHER WARNING & DISASTER FEED...", "system");

            try {
                const response = await fetch('https://www.jma.go.jp/bosai/common/send/data/tsconfig.json');
                if (!response.ok) throw new Error("JMA Feed Offline");
                const feed = await response.json();

                appendOutput("[OK] JMA FEED SYNCHRONIZED.", "success");
                appendOutput("==================================================", "system");
                appendOutput("  【気象庁 リアルタイム防災・気象監視フィード】", "system");
                appendOutput("==================================================", "system");
                appendOutput(`  更新時刻 : ${feed.date || new Date().toLocaleString()}`, "dev");
                appendOutput(`  通信ノード: ${feed.url || 'JMA-SERVER-NODE-01'}`, "dim");
                appendOutput("  ステータス: リアルタイム気象警報・防災データ常時監視中 [NORMAL]", "success");
            } catch (err) {
                appendOutput("[OK] JMA WEATHER NODE ONLINE.", "success");
                appendOutput("  気象警報・注意報データベース: 異常なし（正常運用中）", "system");
            } finally {
                isProcessing = false;
                input.disabled = false;
                input.focus();
            }
        }

        // カラー設定部屋（COLOR CONFIG ROOM）処理
        function enterColorRoom() {
            isColorMode = true;
            promptLabel.textContent = "COLOR-CONFIG> ";
            promptLabel.style.color = "#ffcc00";
            secBadge.textContent = "MODE: COLOR CONFIG";
            secBadge.style.color = "#ffcc00";

            appendOutput("==================================================", "system");
            appendOutput("  【カラー設定モード (COLOR CONFIG ROOM)】", "system");
            appendOutput("==================================================", "system");
            appendOutput("  [基本サイバー色]", "dev");
            appendOutput("  cyan : シアン(標準)  | red : レッド       | blu : ブルー");
            appendOutput("  grn  : グリーン      | amb : アンバー     | pur : パープル");
            appendOutput("  [スペシャルネオン色]", "secret");
            appendOutput("  gld  : ゴールド      | slv : シルバー     | pnk : ピンク");
            appendOutput("  ppr  : パープルネオン| sky : スカイブルー | yel : イエロー");
            appendOutput("  --------------------------------------------------", "dim");
            appendOutput("  list : 色一覧を再表示 | exit : 通常モードに戻る");
            appendOutput("==================================================", "system");
        }

        function processColorCommand(cmd) {
            if (cmd === 'exit') {
                isColorMode = false;
                promptLabel.textContent = "root@cyber:~#";
                promptLabel.style.color = "#ff007f";
                secBadge.textContent = "SYSTEM: OVERDRIVE";
                secBadge.style.color = "var(--main-color)";
                appendOutput("[OK] EXITED COLOR CONFIG ROOM.", "success");
                return;
            }

            if (cmd === 'list') {
                enterColorRoom();
                return;
            }

            const colorMap = {
                'cyan': ['#00ffcc', 'rgba(0, 255, 204, 0.6)', 'CYBER CYAN'],
                'red':  ['#ff1144', 'rgba(255, 17, 68, 0.6)', 'DEEP RED'],
                'blu':  ['#00aaff', 'rgba(0, 170, 255, 0.6)', 'COBALT BLUE'],
                'grn':  ['#00ff66', 'rgba(0, 255, 102, 0.6)', 'MATRIX GREEN'],
                'amb':  ['#ffaa00', 'rgba(255, 170, 0, 0.6)', 'RETRO AMBER'],
                'pur':  ['#b026ff', 'rgba(176, 38, 255, 0.6)', 'NEON PURPLE'],
                'gld':  ['#ffd700', 'rgba(255, 215, 0, 0.6)', 'NEON GOLD'],
                'slv':  ['#e0e0e0', 'rgba(224, 224, 224, 0.6)', 'SILVER WHITE'],
                'pnk':  ['#ff007f', 'rgba(255, 0, 127, 0.6)', 'VIVID PINK'],
                'ppr':  ['#d147fe', 'rgba(209, 71, 254, 0.6)', 'BRIGHT PURPLE'],
                'sky':  ['#00e5ff', 'rgba(0, 229, 255, 0.6)', 'SKY BLUE'],
                'yel':  ['#ffee00', 'rgba(255, 238, 0, 0.6)', 'BRIGHT YELLOW']
            };

            if (colorMap[cmd]) {
                setThemeColor(colorMap[cmd][0], colorMap[cmd][1], colorMap[cmd][2]);
            } else {
                appendOutput(`ColorEngine: unknown color code: '${cmd}'. Type 'list'.`, "warning");
            }
        }

        // VIVANT極秘ファイル閲覧演出 (vvt)
        function startVivantSecretAnimation() {
            isProcessing = true;
            input.disabled = true;

            secBadge.textContent = "CLASSIFIED: TENTH NODE";
            secBadge.style.color = "#ff1144";

            const logs = [
                "[CLASSIFIED] ACCESSING BALKA DIVISION FINANCIAL ACCOUNTS...",
                "[ENCRYPTION] RSA-4096 / KEY INJECTION IN PROGRESS...",
                "[DATA] FOUND TARGET ACCOUNT: 'TENTH_MONEY_LAUNDRY_09'",
                "[LOG] OVERWRITING TRANSACTION LOGS (3,500,000 USD)...",
                "[SUCCESS] BALKA AGENCY RECORDS COMPROMISED."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], "vivant");
                    index++;
                } else {
                    clearInterval(timer);
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 180);
        }

        // 手動モード起動演出
        function startDevModeAnimation() {
            isProcessing = true;
            input.disabled = true;

            const logs = [
                "[*] INITIALIZING MANUAL DEV ENVIRONMENT...",
                "[*] LOADING VIRTUAL JAVASCRIPT ENGINE v2.4...",
                "[*] ALLOCATING ISOLATED MEMORY HEAP (256MB)...",
                "[*] ATTACHING INTERPRETATIVE REPL SHELL...",
                "[OK] DEV ENVIRONMENT READY."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], index === logs.length - 1 ? "success" : "dev");
                    index++;
                } else {
                    clearInterval(timer);
                    isDevMode = true;
                    promptLabel.textContent = "DEV-MODE> ";
                    promptLabel.style.color = "#00aaff";
                    shellTitle.textContent = "developer@manual_interpreter:~";
                    secBadge.textContent = "MODE: MANUAL DEV";
                    secBadge.style.color = "#00aaff";
                    
                    appendOutput("==================================================", "dev");
                    appendOutput("  【手動コード作成・実行モード（MANUAL DEV）】", "dev");
                    appendOutput("==================================================", "dev");
                    appendOutput("Type 'help' for dev commands, or 'exit' to quit.", "dev");

                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 150);
        }

        function exitDevModeAnimation() {
            isProcessing = true;
            input.disabled = true;

            const logs = [
                "[*] CLOSING DEV INTERPRETER...",
                "[*] FLUSHING VIRTUAL HEAP MEMORY...",
                "[*] RESTORING DEFAULT CYBER SHELL..."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], "system");
                    index++;
                } else {
                    clearInterval(timer);
                    isDevMode = false;
                    promptLabel.textContent = "root@cyber:~#";
                    promptLabel.style.color = "#ff007f";
                    shellTitle.textContent = "root@cyber-mainframe:~";
                    secBadge.textContent = "SYSTEM: OVERDRIVE";
                    secBadge.style.color = "var(--main-color)";
                    appendOutput("[OK] RETURNED TO STANDARD SHELL.", "success");

                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 120);
        }

        function startAutoStream() {
            if (autoStreamInterval) return;
            appendOutput("[*] LIVE SECURITY STREAM ACTIVATED (Type 'stp' to stop)", "system");

            const streamLogs = [
                "KERNEL: Segment fault avoided at 0x7ffd4a",
                "NET: Inbound packet from 185.220.101.5 [TOR EXIT NODE]",
                "AUTH: Failed login attempt for user 'admin' from 10.0.4.15",
                "SYS: Memory usage stable at 14.2% [OK]",

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);

        // 手動コード実行エンジン (DEV MODE)
        function processDevCommand(line) {
            const parts = line.split(' ');
            const subCmd = parts[0].toLowerCase();
            const args = parts.slice(1).join(' ');

            if (subCmd === 'exit') {
                exitDevModeAnimation();
                return;
            }

            if (subCmd === 'help' || subCmd === 'hlp') {
                appendOutput("--- DEV ENGINE COMMANDS ---", "dev");
                appendOutput("calc <式>       : 数学計算の実行 (例: calc (50+30)*2)");
                appendOutput("var <名前> <値>  : 変数の登録 (例: var target 192.168.1.1)");
                appendOutput("echo <名前/$名> : 文字列や変数の出力 (例: echo $target)");
                appendOutput("date            : 現在の正確なシステム時刻を表示");
                appendOutput("vars            : 保存されている全変数を一覧表示");
                appendOutput("exit            : アニメーション付きで手動モードを終了");
                return;
            }

            if (subCmd === 'calc') {
                try {
                    const cleanMath = args.replace(/[^0-9+\-*/().]/g, '');
                    if (!cleanMath) {
                        appendOutput("[DEV ERROR] Invalid calculation expression.", "warning");
                        return;
                    }
                    const res = Function(`'use strict'; return (${cleanMath})`)();
                    appendOutput(`OUTPUT: ${res}`, "dev");
                } catch(e) {
                    appendOutput("[DEV ERROR] Calculation syntax error.", "warning");
                }
                return;
            }

            if (subCmd === 'var') {
                const name = parts[1];
                const val = parts.slice(2).join(' ');
                if (!name || !val) {
                    appendOutput("Usage: var <name> <value>", "warning");
                    return;
                }
                devVariables[name] = val;
                appendOutput(`[DEV] Variable '$${name}' set to '${val}'`, "dev");
                return;
            }

            if (subCmd === 'echo') {
                if (args.startsWith('$')) {
                    const varName = args.substring(1);
                    if (devVariables[varName] !== undefined) {
                        appendOutput(devVariables[varName], "dev");
                    } else {
                        appendOutput(`[DEV WARNING] Variable '$${varName}' is undefined.`, "warning");
                    }
                } else {
                    appendOutput(args, "dev");
                }
                return;
            }

            if (subCmd === 'vars') {
                appendOutput("--- STORED DEV VARIABLES ---", "dev");
                const keys = Object.keys(devVariables);
                if (keys.length === 0) {
                    appendOutput("(No variables saved yet)", "dim");
                } else {
                    keys.forEach(k => appendOutput(`$${k} = ${devVariables[k]}`, "dev"));
                }
                return;
            }

            if (subCmd === 'date') {
                appendOutput(`SYSTEM DATE: ${new Date().toLocaleString()}`, "dev");
                return;
            }

            appendOutput(`DevEngine: command not found: '${subCmd}'. Type 'help'.`, "warning");
        }
