<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker OS Simple</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }
        #output {
            white-space: pre-wrap;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .input-line {
            display: flex;
        }
        .prompt {
            color: #0fa;
            margin-right: 10px;
        }
        #cmd {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="output">==================================================
Welcome to Terminal v1.0
Type 'jp' to see commands.
==================================================</div>

    <div class="input-line">
        <span class="prompt">admin@node:~#</span>
        <input type="text" id="cmd" autofocus autocomplete="off">
    </div>

    <script>
        const cmdInput = document.getElementById('cmd');
        const outputDiv = document.getElementById('output');

        // 画面クリックで入力欄に自動フォーカス
        document.addEventListener('click', () => cmdInput.focus());

        // エンターキーが押されたら一瞬でテキストを出すだけ
        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const text = cmdInput.value.trim();
                if (text !== '') {
                    // 入力したコマンドを画面に残す
                    outputDiv.textContent += `\nadmin@node:~# ${text}`;
                    
                    // コマンドごとの判定（一瞬で切り替わるだけ）
                    execute(text.toLowerCase());
                }
                cmdInput.value = '';
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        function execute(cmd) {
            if (cmd === 'jp') {
                outputDiv.textContent += `\n` +
                    "--- コマンド一覧 ---\n" +
                    "jp  - メニュー表示\n" +
                    "sys - システム情報\n" +
                    "scn - スキャン実行\n" +
                    "ysu - サーバー乗っ取り\n" +
                    "cls - 画面を消去";
            } 
            else if (cmd === 'sys') {
                outputDiv.textContent += "\nOS: Linux Stable\nCPU: Core x64\nRAM: 16GB\nStatus: Online";
            } 
            else if (cmd === 'scn') {
                outputDiv.textContent += "\nScanning network...\nPort 22: OPEN\nPort 80: OPEN\nScan finished.";
            } 
            else if (cmd === 'ysu') {
                outputDiv.textContent += `\n` +
                    "[CRITICAL] SERVER HIJACK SEQUENCE INITIATED...\n" +
                    "Connecting to target IP: 157.112.44.89 ... [OK]\n" +
                    "====================================================\n" +
                    "   SERVER HIJACK COMPLETED. YOU ARE NOW THE OWNER.  \n" +
                    "====================================================\n" +
                    "サーバーを完全制圧しました。";
            } 
            else if (cmd === 'cls') {
                outputDiv.textContent = "Screen cleared. Type 'jp' for commands.";
            } 
            else {
                outputDiv.textContent += `\nCommand not found: '${cmd}'. Type 'jp'.`;
            }
        }
    </script>
</body>
</html>
