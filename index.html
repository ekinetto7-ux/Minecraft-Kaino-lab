<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker OS v1.0.4</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        #terminal-output {
            white-space: pre-wrap;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #0fa;
            margin-right: 10px;
            user-select: none;
        }
        #cmd-input {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="terminal-output">==================================================
Welcome to Matrix Terminal v1.0.4
コマンド一覧を表示するには 'jp' と入力してください。
==================================================</div>

    <div class="input-line">
        <span class="prompt">guest@hydra:~#</span>
        <!-- 日本語入力ができるようにmaxlengthを念のため3に設定 -->
        <input type="text" id="cmd-input" autofocus autocomplete="off" maxlength="3">
    </div>

    <script>
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('terminal-output');
        let isTyping = false;

        document.addEventListener('click', () => input.focus());

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !isTyping) {
                const command = input.value.trim().toLowerCase();
                
                if (command !== '') {
                    output.textContent += `\nguest@hydra:~# ${command}`;
                    executeCommand(command);
                }
                
                input.value = '';
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        function typeLog(text, callback) {
            isTyping = true;
            let index = 0;
            output.textContent += '\n';
            
            const timer = setInterval(() => {
                if (index < text.length) {
                    output.textContent += text.charAt(index);
                    index++;
                    window.scrollTo(0, document.body.scrollHeight);
                } else {
                    clearInterval(timer);
                    isTyping = false;
                    if (callback) callback();
                }
            }, 15);
        }

        function executeCommand(cmd) {
            switch (cmd) {
                case 'jp': // 変更点：jp入力で日本語のコマンド一覧を表示
                    typeLog(
                        "--- ハッカーシステム コマンド一覧 ---\n" +
                        "jp  - このコマンドメニューを表示\n" +
                        "scn - ターゲットのポートスキャンを実行\n" +
                        "run - クラッキングツールの起動\n" +
                        "sys - システム情報の取得\n" +
                        "log - 過去のハッキング接続履歴を表示\n" +
                        "prx - プロキシサーバーの接続状況を確認\n" +
                        "bps - ファイアウォールの強制バイパス\n" +
                        "cfg - システム環境設定ファイルの閲覧\n" +
                        "src - 不正アクセスのソースコードを展開\n" +
                        "cls - 画面ログをクリアする"
                    );
                    break;

                case 'scn':
                    typeLog("周辺のネットワークをスキャン中...\n" +
                            "Port 22 : 開放 (SSH)\n" +
                            "Port 80 : 開放 (HTTP)\n" +
                            "Port 443: 開放 (HTTPS)\n" +
                            "脆弱性：ファイアウォールにバックドアの兆候を発見。");
                    break;

                case 'run':
                    typeLog("ブルートフォース攻撃を初期化中...", () => {
                        setTimeout(() => typeLog("暗号化ペイロードをインジェクション中... [50%]"), 600);
                        setTimeout(() => typeLog("メインコアを強制迂回中... [100%]"), 1200);
                        setTimeout(() => typeLog("アクセス承認。ルート権限（ROOT）を奪取しました。"), 1800);
                    });
                    break;

                case 'sys':
                    typeLog("システム：Hydra-Core Linux v9.4\n" +
                            "CPU：量子インテル 64コアプロセッサ\n" +
                            "メモリ：256GB キャッシュ構造\n" +
                            "稼働時間：432日 12時間 連続稼働中");
                    break;

                case 'log':
                    typeLog("接続日時             IPアドレス       ステータス\n" +
                            "2026-10-15 14:02    10.0.4.12       接続完了\n" +
                            "2026-10-15 14:05    192.168.1.99    アクセス拒否\n" +
                            "2026-10-15 14:10    UNKNOWN         侵入失敗");
                    break;

                case 'prx':
                    typeLog("Onionネットワーク経由でパケットをルーティング中...\n" +
                            "ノード 1: ドイツ (アクティブ)\n" +
                            "ノード 2: アイスランド (アクティブ)\n" +
                            "ノード 3: 東京 (暗号化通信)\n" +
                            "匿名化レベル: 98% (安全)");
                    break;

                case 'bps':
                    typeLog("セキュリティレイヤーの防御壁を解析中...\n" +
                            "偽装パケットを連続送信中...\n" +
                            "ファイアウォールの遮断に成功。セキュリティが無効化されました。");
                    break;

                case 'cfg':
                    typeLog("設定ファイル config.json を読み込み中...\n" +
                            "{\n" +
                            "  \"allow_root\": true,\n" +
                            "  \"encryption\": \"AES-256\",\n" +
                            "  \"stealth_mode\": true\n" +
                            "}");
                    break;

                case 'src':
                    typeLog("void main() {\n" +
                            "    int *ptr = malloc(sizeof(int));\n" +
                            "    if (fork() == 0) {\n" +
                            "        execl(\"/bin/sh\", \"sh\", NULL);\n" +
                            "    }\n" +
                            "}");
                    break;

                case 'cls':
                    output.textContent = "画面をクリアしました。 'jp' でコマンドを表示します。";
                    break;

                default:
                    typeLog(`エラー: コマンド '${cmd}' は存在しません。 'jp' を入力してください。`);
                    break;
            }
        }
    </script>
</body>
</html>
