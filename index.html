<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            transition: background-color 0.3s;
        }
        #terminal-output {
            white-space: pre-wrap;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #0fa;
            margin-right: 10px;
            user-select: none;
        }
        #cmd-input {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }

        /* アラート用スタイル */
        .alert-text {
            color: #f00 !important;
            font-weight: bold;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.1; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="terminal-output">======================================================================
Welcome to Hydra-Core Terminal v2.7.1 [Stop Command Patched]
一覧表示は 'jp' と入力してください。
★ 'ysu'（サーバー乗っ取り）などの演出中に 'stp' で強制停止できます。

    <div class="input-line">
        <span class="prompt" id="terminal-prompt">root@hydra-net:~#</span>
        <input type="text" id="cmd-input" autofocus autocomplete="off">
    </div>

    <script>
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('terminal-output');
        const prompt = document.getElementById('terminal-prompt');
        let typeTimer = null; 

        document.addEventListener('click', () => input.focus());

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                if (command !== '') {
                    output.textContent += `\n${prompt.textContent} ${command}`;
                    executeCommand(command);
                }
                input.value = '';
                setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 10);
            }
        });

        // 動いているタイピング処理を安全に止める関数
        function stopTyping() {
            if (typeTimer) {
                clearInterval(typeTimer);
                typeTimer = null;
            }
        }

        function printLog(text) {
            stopTyping(); // 新しい描写の前に古いタイマーを止める
            let index = 0;
            output.textContent += '\n';
            
            typeTimer = setInterval(() => {
                if (index < text.length) {
                    output.textContent += text.charAt(index);
                    window.scrollTo(0, document.body.scrollHeight);
                    index++;
                } else {
                    clearInterval(typeTimer);
                    typeTimer = null;
                }
            }, 4);
        }

        function executeCommand(cmd) {
            // 【特例】stp が入力されたら即座にタイマーを止めて終了する
            if (cmd === 'stp') {
                stopTyping();
                output.textContent += "\n[WARNING] Process halted by user. Ready.";
                window.scrollTo(0, document.body.scrollHeight);
                return;

            switch (cmd) {
                case 'jp':
                    output.textContent += "\n" + 
                        "=================== ハッカーシステム コマンドメニュー ===================\n\n" +

                        "scn - ポートスキャン    prx - プロキシ状態      png - 疎通テストを実行  ipc - IP構成の確認\n" +
                        "run - ペイロード実行    bps - 防御壁バイパス    brt - 総当たり攻撃開始  dos - DDOS攻撃の装填\n" +
                        "log - 侵入履歴の閲覧    src - ソースコード展開  cat - 秘密ファイルの閲覧 rst - 強制リセット\n" +
                        "ysu - 【サーバー乗っ取り】 標的サーバーへの強制クラッキング（進化版）\n" +
                        "alt - 【緊急警告】 偽のシステム崩壊レッドアラートを起動\n" +
                        "stp - 【強制停止】 進行中の文字出力をその場でストップする";
                    window.scrollTo(0, document.body.scrollHeight);
                    break;

                case 'ysu': 
                    printLog(
                        "[CRITICAL] TARGET SERVER HIJACK SEQUENCE INITIATED...\n" +
                        "Connecting to target IP: 157.112.44.89 ... [OK]\n" +
                        "Scanning network topology and encryption wrappers...\n" +
                        "----------------------------------------------------------------\n" +
                        "[ANALYSIS]  [██████░░░░░░░░░░░░░░] 30% - Injecting Exploit Vector\n" +
                        "[ANALYSIS]  [████████████░░░░░░░░] 60% - Overwriting Memory Bank\n" +
                        "[ANALYSIS]  [████████████████████] 100% - Firewall Overridden\n" +
                        "----------------------------------------------------------------\n" +
                        "Unlocking Root Hashes (MD5/SHA-256):\n" +
                        " >> Match Found: 'k1m1tsu_2026'\n" +
                        " >> Hijacking Session Tokens... [SUCCESS]\n" +
                        " >> Deploying Ghost Backdoor...\n\n" +
                        "====================================================\n" +
                        "   SERVER HIJACK COMPLETED. YOU ARE NOW THE OWNER.  \n" +
                        "====================================================\n" +
                        "対象サーバーのコアシステムを完全制圧しました。ルートシェル解放。"
                    );
                    break;

                case 'alt':
                    document.body.style.backgroundColor = "#200"; 
                    prompt.textContent = "ALERT@SYSTEM:~#"; 
                    prompt.style.color = "#f00";
                    input.style.color = "#f00";
                    output.innerHTML += `\n<span class="alert-text">` +
                        "====================================================\n" +
                        "🚨 [CRITICAL WARNING] SYSTEM OVERRUN DETECTED 🚨\n" +
                        "====================================================\n" +
                        "COUNTER-INTRUSION DETECTED BY FOREIGN HOST.\n" +
                        "DELETING CORE DATABASE MODULES... [PENDING]\n" +
                        "EMERGENCY OVERRIDE REQUIRED.\n" +
                        "====================================================\n" +
                        "⚠️ 警告: 逆ハッキングを検知しました。画面を戻すには 'cls' を実行してください。</span>";
                    break;

                case 'cls':
                    stopTyping();
                    document.body.style.backgroundColor = "#000";
                    prompt.textContent = "root@hydra-net:~#";
                    prompt.style.color = "#0fa";
                    input.style.color = "#0f0";
                    output.textContent = "Screen cleared. Alert dismissed. Standby for command.";
                    break;

                // --- 既存のコマンド ---
                case 'sys': printLog("OS: Hydra Linux 9.4\nCPU: Quantum 128-Core\nRAM: 512GB\nSecure Layer: ENABLED"); break;
                case 'cfg': printLog("Reading config...\n{\n  \"stealth\": true,\n  \"proxy_chains\": 4,\n  \"auto_destruct\": false\n}"); break;
                case 'ver': printLog("Hydra Terminal Core v2.7.1-release (Build 20261015)"); break;

    </script>
