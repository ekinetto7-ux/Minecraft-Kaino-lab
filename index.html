<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL - OS v6.0</title>
    <style>
        body {
            background-color: #020508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* 背景のマトリックス風キャンバス */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        /* ウィンドウフレーム */
        #window-frame {
            width: 100%;
            max-width: 950px;
            height: 88vh;
            background-color: rgba(5, 8, 15, 0.9);
            border: 1px solid #00ffcc66;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .window-header {
            background-color: #0d1322;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #00ffcc33;
        }
        .window-buttons {
            display: flex;
            gap: 8px;
        }
        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .btn-red { background-color: #ff5f56; }
        .btn-yellow { background-color: #ffbd2e; }
        .btn-green { background-color: #27c93f; }
        .window-title {
            margin-left: 15px;
            font-size: 13px;
            color: #8899a6;
            letter-spacing: 1px;
        }
        #terminal {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            padding: 15px;
        }
        #command-form {
            display: flex;
            align-items: center;
            font-size: 15px;
            padding: 12px 15px;
            background-color: #060912;
            border-top: 1px solid #00ffcc33;
        }
        .prompt {
            color: #ff007f;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .warning { color: #ff3366; font-weight: bold; }
        .success { color: #00ffcc; }
        .system { color: #ffaa00; }
        .stream { color: #00aa66; }
        .matrix { color: #00ff00; }
        .dim { color: #335544; }
    </style>
</head>
<body>

    <!-- 背景のマトリックス・レイン用キャンバス -->
    <canvas id="matrix-bg"></canvas>

    <div id="window-frame">
        <div class="window-header">
            <div class="window-buttons">
                <div class="btn btn-red"></div>
                <div class="btn btn-yellow"></div>
                <div class="btn btn-green"></div>
            </div>
            <div class="window-title">root@cyber-shell:v6.0 (secure-mode)</div>
        </div>

        <div id="terminal">
            <span class="system">=======================================================</span>
            <span class="system">  CYBER TERMINAL v6.0-ULTIMATE [SECURE OVERRIDE]</span>
            <span class="system">=======================================================</span>
            Type <span class="success">jp</span> for Japanese command list, or <span class="success">aut</span> for live stream.
        </div>

        <form id="command-form">
            <span class="prompt">root@cyber:~#</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </form>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        const form = document.getElementById('command-form');
        
        let autoStreamInterval = null;
        let isProcessing = false;

        // --- タイピング音（Web Audio APIで合成・音声ファイル不要） ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playKeySound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            // ランダムに高さを変えてリアルな打鍵音にする
            osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        input.addEventListener('keydown', () => {
            playKeySound();
        });

        // --- 背景マトリックス・レインのアニメーション ---
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const katakana = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
        const alphabet = katakana + latin;
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const rainDrops = [];

        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 5, 8, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // --- ターミナル操作ロジック ---
        document.addEventListener('click', () => {
            if (!isProcessing) input.focus();
        });

        window.onload = () => {
            input.focus();
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isProcessing) return;

            const cmd = input.value.trim().toLowerCase();
            if (cmd === '') return;
            
            if (cmd !== 'aut' && cmd !== 'stp') {
                stopAutoStream();
            }

            appendOutput(`root@cyber:~# ${cmd}`);
            input.value = '';

            processCommand(cmd);
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function runSimulatedTask(title, successMsg, callback) {
            isProcessing = true;
            input.disabled = true;

            appendOutput(`[*] ${title}...`, "system");
            let progress = 0;
            
            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 25) + 15;
                if (progress >= 100) progress = 100;
                
                const bars = '█'.repeat(Math.floor(progress / 10)) + '░'.repeat(10 - Math.floor(progress / 10));
                terminal.lastChild.textContent = `[*] ${title}... [${bars}] ${progress}%`;

                if (progress === 100) {
                    clearInterval(timer);
                    appendOutput(`[OK] ${successMsg}`, "success");
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                    if (callback) callback();
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }, 100);
        }

        function startAutoStream() {
            if (autoStreamInterval) return;

            appendOutput("[*] LIVE SECURITY STREAM ACTIVATED (Type 'stp' to stop)", "system");

            const streamLogs = [
                "KERNEL: Segment fault avoided at 0x7ffd4a",
                "NET: Inbound packet from 185.220.101.5 [TOR EXIT NODE]",
                "AUTH: Failed login attempt for user 'admin' from 10.0.4.15",
                "SYS: Memory usage stable at 14.2% [OK]",
                "SEC: Firewall block rule applied to port 22 (SSH)",
                "ENCR: AES-256 handshake established with proxy node"
            ];

            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                appendOutput(log, "dim");
            }, 300);
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

        function processCommand(cmd) {
            if (cmd !== 'jp' && cmd.length !== 3) {
                appendOutput(`bash: ${cmd}: command not found. Type 'jp' for help.`, "warning");
                return;
            }

            switch(cmd) {
                case 'jp':
                    appendOutput("========================================", "system");
                    appendOutput("  【日本語システムコマンド一覧 (v6.0)】", "system");
                    appendOutput("========================================", "system");
                    appendOutput("  jp  : 日本語コマンド一覧を表示");
                    appendOutput("  hlp : 英語ヘルプを表示");
                    appendOutput("  aut : リアルタイム監視ログを流す");
                    appendOutput("  stp : 監視ログを停止する");
                    appendOutput("  hak : メインフレームのハッキングを実行");
                    appendOutput("  scn : 全ネットワークの脆弱性をスキャン");
                    appendOutput("  gen : ランダム暗号キー＆パスワードを生成");
                    appendOutput("  mtr : マトリックス風コードを大量発生");
                    appendOutput("  brk : システムクラッシュ演出を発動");
                    appendOutput("  inf : ネットワーク＆IPステータス確認");
                    appendOutput("  pwd : 現在の作業ディレクトリを表示");
                    appendOutput("  ls  : ディレクトリ内のファイル一覧");
                    appendOutput("  dlc : 機密データベースの抜出");
                    appendOutput("  cls : 画面をクリアする");
                    appendOutput("  rst : システムを再起動する");
                    break;

                case 'hlp':
                    appendOutput("Commands: jp, hlp, aut, stp, hak, scn, gen, mtr, brk, inf, pwd, ls, dlc, cls, rst", "system");
                    break;

                case 'aut':
                    startAutoStream();
                    break;

                case 'stp':
                    stopAutoStream();
                    appendOutput("[*] ストリームを停止しました。", "warning");
                    break;

                case 'hak':
                    runSimulatedTask("Bypassing mainframe firewall", "Root privileges granted. Welcome back, Admin.", () => {
                        appendOutput("ACCESS TOKEN: 0x9F8B2C4E1A-ROOT", "success");
                    });
                    break;

                case 'scn':
                    runSimulatedTask("Scanning subnets & vulnerability ports", "Scan complete. 3 open ports detected.", () => {
                        appendOutput("PORT 21 (FTP): VULNERABLE\nPORT 80 (HTTP): SECURE\nPORT 443 (HTTPS): SECURE", "warning");
                    });
                    break;

                case 'gen':
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
                    let key = "";
                    for(let i=0; i<32; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
                    appendOutput(`[GEN] Generated Hash Key: ${key}`, "success");
                    break;

                case 'mtr':
                    appendOutput("[!] INITIALIZING MATRIX STREAM...", "matrix");
                    for(let i=0; i<6; i++) {
                        let line = "";
                        for(let j=0; j<45; j++) line += Math.floor(Math.random() * 2);
                        appendOutput(line, "matrix");
                    }
                    break;

                case 'brk':
                    appendOutput("[!] CRITICAL WARNING: KERNEL PANIC OVERRIDE", "warning");
                    appendOutput("[X] OVERRIDING SECURITY PROTOCOLS...", "warning");
                    appendOutput("[X] SYSTEM SHUTDOWN IN 3... 2... 1...", "warning");
                    document.body.style.backgroundColor = "#ff000022";
                    setTimeout(() => { document.body.style.backgroundColor = "#020508"; }, 1500);
                    break;

                case 'inf':
                    appendOutput("TARGET: 192.168.1.105 (CYBER-CORE-01)");
                    appendOutput("GATEWAY: 10.0.0.1 | MASK: 255.255.255.0");
                    appendOutput("ENCRYPTION: RSA-4096 / AES-256 [SECURE]", "success");
                    break;

                case 'pwd':
                    appendOutput("/var/root/secure/kernel/sys_core");
                    break;

                case 'ls ':
                case 'ls_':
                case 'dir':
                    appendOutput("total 64");
                    appendOutput("drwx------  4 root root 4096 Oct 15 06:15 .");
                    appendOutput("-rw-r--r--  1 root root  840 config.conf");
                    appendOutput("-rw-r--r--  1 root root 1024 payload.bin");
                    appendOutput("-rwxr-xr-x  1 root root 2048 override.sh", "success");
                    break;

                case 'dlc':
                    runSimulatedTask("Downloading encrypted database (1.24 GB)", "Download complete. Saved to /tmp/user_data.db", () => {
                        appendOutput("HASH CHECK: SHA256 [OK]", "success");
                    });
                    break;

                case 'cls':
                    terminal.innerHTML = "";
                    break;

                case 'rst':
                    appendOutput("Rebooting kernel...", "warning");
                    isProcessing = true;
                    input.disabled = true;
                    setTimeout(() => {
                        terminal.innerHTML = '<span class="system">=== SYSTEM RESTARTED ===</span>\nType <span class="success">jp</span> for command list.';
                        isProcessing = false;
                        input.disabled = false;
                        input.focus();
                    }, 1200);
                    break;

                default:
                    appendOutput(`Command '${cmd}' not recognized. Type 'jp'.`, "warning");
                    break;
            }
        }
    </script>
</body>
</html>
