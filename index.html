<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker OS v2.3.0</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        #terminal-output {
            white-space: pre-wrap;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #0fa;
            margin-right: 10px;
            user-select: none;
        }
        #cmd-input {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="terminal-output">======================================================================
Welcome to Hydra-Core Terminal v2.3.0 [Infinite Mode Edition]
一覧表示は 'jp' と入力してください。
★新コマンド 'inf' で無限に文字列が出力されます。（止めるには 'stp'）
======================================================================</div>

    <div class="input-line">
        <span class="prompt">root@hydra-net:~#</span>
        <input type="text" id="cmd-input" autofocus autocomplete="off">
    </div>

    <script>
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('terminal-output');
        let currentTimer = null; 
        let timeoutTimers = [];  
        let infiniteTimer = null; // 無限ループを管理するタイマー

        document.addEventListener('click', () => input.focus());

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                if (command !== '') {
                    output.textContent += `\nroot@hydra-net:~# ${command}`;
                    executeCommand(command);
                }
                input.value = '';
                setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 10);
            }
        });

        // すべての進行中プロセス（無限ループも含む）をクリアする関数
        function clearAllTimers() {
            if (currentTimer) {
                clearInterval(currentTimer);
                currentTimer = null;
            }
            if (infiniteTimer) {
                clearInterval(infiniteTimer);
                infiniteTimer = null;
            }
            timeoutTimers.forEach(t => clearTimeout(t));
            timeoutTimers = [];
        }

        function typeLog(text, callback) {
            if (currentTimer) clearInterval(currentTimer);
            
            let index = 0;
            output.textContent += '\n';
            
            if (text.length > 200) {
                output.textContent += text;
                if (callback) callback();
                window.scrollTo(0, document.body.scrollHeight);
                return;
            }

            currentTimer = setInterval(() => {
                if (index < text.length) {
                    output.textContent += text.charAt(index);
                    index++;
                    window.scrollTo(0, document.body.scrollHeight);
                } else {
                    clearInterval(currentTimer);
                    currentTimer = null;
                    if (callback) callback();
                }
            }, 10);
        }

        // 無限に出力する謎の暗号・コードのパーツ
        const hexChars = "0123456789ABCDEFSYSTEM_ERROR_BYPASS_INJECT_LOG_DATA_";
        function generateRandomLine() {
            let line = "SYSTEM_DATA: ";
            for (let i = 0; i < 4; i++) {
                line += "0x" + Math.floor(Math.random() * 16).toString(16).toUpperCase() + Math.floor(Math.random() * 16).toString(16).toUpperCase() + " ";
            }
            line += " -- [LOADING MODULE " + Math.floor(Math.random() * 999) + "] -- " + (Math.random() > 0.5 ? "SUCCESS" : "OVERFLOW");
            return line;
        }

        function executeCommand(cmd) {
            // stpコマンド、または他のコマンドが打たれたら無限ループを即停止
            if (cmd === 'stp') {
                clearAllTimers();
                typeLog("[WARNING] Infinite loop halted. System stabilized.");
                return;
            }

            // 新しいコマンドが実行されたら一度すべて停止
            clearAllTimers();

            switch (cmd) {
                case 'jp':
                    typeLog(
                        "=================== ハッカーシステム コマンドメニュー (22種) ===================\n\n" +
                        "jp  - メニュー表示      sys - システム情報      cfg - コンフィグ閲覧    ver - バージョン確認\n" +
                        "cls - 画面ログ消去      tim - 現在時刻の表示    mem - メモリ使用率      upt - 起動時間の計測\n" +
                        "scn - ポートスキャン    prx - プロキシ状態      png - 疎通テストを実行  ipc - IP構成の確認\n" +
                        "run - ペイロード実行    bps - 防御壁バイパス    brt - 総当たり攻撃開始  dos - DDOS攻撃の装填\n" +
                        "log - 侵入履歴の閲覧    src - ソースコード展開  cat - 秘密ファイルの閲覧 rst - 強制リセット\n" +
                        "inf - 文字無限出力      stp - プロセス強制停止"
                    );
                    break;

                case 'inf': // 【新機能】無限ログ出力
                    output.textContent += "\n[INITIALIZING INFINITE STREAM] Press 'stp' to abort.\n";
                    infiniteTimer = setInterval(() => {
                        output.textContent += "\n" + generateRandomLine();
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 50); // 50ミリ秒ごとに新しいログをずっと生成
                    break;

                // --- システム系 ---
                case 'sys': typeLog("OS: Hydra Linux 9.4\nCPU: Quantum 128-Core\nRAM: 512GB\nSecure Layer: ENABLED"); break;
                case 'cfg': typeLog("Reading config...\n{\n  \"stealth\": true,\n  \"proxy_chains\": 4,\n  \"auto_destruct\": false\n}"); break;
                case 'ver': typeLog("Hydra Terminal Core v2.3.0-release (Build 20261015)"); break;
                case 'cls': output.textContent = "Screen cleared. Type 'jp' for commands."; break;
                case 'tim': typeLog(`Current Server Time: ${new Date().toLocaleString('ja-JP')}`); break;
                case 'mem': typeLog("Memory Allocation:\n[██████████░░░░░░░░░░] 52% Used\nFree: 245.7 GB / 512 GB"); break;
                case 'upt': typeLog("System Uptime: 1,024 hours 43 minutes 12 seconds"); break;

                // --- ネットワーク系 ---
                case 'scn': typeLog("Scanning ports...\nPort 22: OPEN (SSH)\nPort 80: OPEN (HTTP)\nPort 443: OPEN (HTTPS)\nPort 3306: OPEN (MySQL)"); break;
                case 'prx': typeLog("Proxy status: ENCRYPTED\nChain: JP -> US -> DE -> IS\nAnonymity Level: 99.8%"); break;
                case 'png': typeLog("PING target.gov (10.4.21.99): 56 data bytes\n64 bytes from 10.4.21.99: icmp_seq=1 ttl=54 time=12.4 ms\nConnection stable."); break;
                case 'ipc': typeLog("eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\ninet 192.168.23.104  netmask 255.255.255.0"); break;

                // --- シミュレーション攻撃系 ---
                case 'run': 
                    typeLog("Executing exploit weapon...", () => { 
                        timeoutTimers.push(setTimeout(() => typeLog("Injecting rootkit... [OK]"), 500));
                        timeoutTimers.push(setTimeout(() => typeLog("System hijacked."), 1000));
                    }); 
                    break;
                case 'bps': typeLog("Bypassing firewall layers...\nLayer 1: PASSED\nLayer 2: PASSED\nCloudflare: OVERIDDEN [100%]"); break;
                case 'brt': typeLog("Starting Brute-Force on SSH...\nTrying wordlist (1/5000)...\n[MATCH] password='admin1234'"); break;
                case 'dos': typeLog("Assembling Denial of Service attack...\nTarget flooded with UDP packets. Target status: DOWN"); break;

                // --- ファイル・操作系 ---
                case 'log': typeLog("TIMESTAMP        EVENT              OPERATOR\n14:05:32     Root Access Granted  THIS TERMINAL"); break;
                case 'src': typeLog("void main() {\n    char *shield = malloc(1024);\n    while(1) { fork(); }\n}"); break;
                case 'cat': typeLog("Reading secret.txt...\n[CONFIDENTIAL]\nPassphrase: 'omega_alpha'"); break;
                case 'rst': typeLog("Resetting secure shell environment...", () => { location.reload(); }); break;

                default:
                    typeLog(`エラー: コマンド '${cmd}' は存在しません。 'jp' を入力してください。`);
                    break;
            }
        }
    </script>
</body>
</html>
