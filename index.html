<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebCraft 3D - Mobile & PC Edition</title>
    <style>
        body {
            margin: 0; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
            touch-action: none; /* スマホでのピンチズームやスクロールを防止 */
            background: #87CEEB;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.85); }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        
        #hud {
            position: absolute; top: 8px; left: 8px; color: white;
            background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 6px; z-index: 10;
            font-size: 12px; line-height: 1.4; pointer-events: none;
        }

        /* 上部クイックメニュー（スマホ・タブレット用） */
        #top-actions {
            position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 15;
        }
        .action-mini-btn {
            background: rgba(0,0,0,0.65); color: white; border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px; padding: 8px 10px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .action-mini-btn:active { background: rgba(255,255,255,0.3); }

        /* ホットバー */
        #hotbar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 3px; background: rgba(0,0,0,0.7); padding: 4px; border-radius: 6px; z-index: 15;
            max-width: 95vw; overflow-x: auto;
        }
        .slot {
            width: 40px; height: 40px; flex-shrink: 0; border: 2px solid #555; border-radius: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 9px; text-align: center; position: relative; cursor: pointer;
            background: rgba(255,255,255,0.1);
        }
        .slot.active { border-color: #FFF; background: rgba(255,255,255,0.35); transform: scale(1.05); }
        .slot-color { width: 18px; height: 18px; border-radius: 3px; margin-bottom: 1px; border: 1px solid rgba(0,0,0,0.4); }
        .slot-count { position: absolute; bottom: 1px; right: 3px; font-weight: bold; font-size: 10px; text-shadow: 1px 1px 0 #000; }

        /* スマホ用バーチャルジョイスティック＆操作ボタン */
        #joystick-zone {
            position: absolute; bottom: 75px; left: 20px; width: 120px; height: 120px;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%; z-index: 15; display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob {
            width: 48px; height: 48px; background: rgba(255,255,255,0.7);
            border-radius: 50%; position: absolute; pointer-events: none;
        }

        #mobile-controls {
            position: absolute; bottom: 75px; right: 20px; display: flex; flex-direction: column;
            align-items: flex-end; gap: 10px; z-index: 15;
        }
        .control-row { display: flex; gap: 10px; }
        .touch-btn {
            width: 58px; height: 58px; border-radius: 50%; background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.6); color: white; font-size: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; font-weight: bold;
        }
        .touch-btn span { font-size: 9px; margin-top: 2px; }
        .touch-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }

        /* モーダル画面 */
        .modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95); border: 3px solid #777; border-radius: 8px;
            padding: 16px; color: white; z-index: 30; width: 90vw; max-width: 540px; max-height: 75vh; overflow-y: auto;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 10px; }
        
        #blocker {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.75);
            display: flex; align-items: center; justify-content: center; color: white; z-index: 40;
            flex-direction: column; cursor: pointer; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #mining-bar-container {
            display: none; position: absolute; top: 55%; left: 50%; transform: translateX(-50%);
            width: 100px; height: 8px; background: rgba(0,0,0,0.7); border: 1px solid #fff; z-index: 10;
        }
        #mining-bar { width: 0%; height: 100%; background: #4CAF50; }
        .btn { background: #4CAF50; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="blocker">
        <h2>WebCraft 3D (スマホ・PC対応)</h2>
        <p style="font-size:13px; max-width:450px; line-height:1.6;">
            <b>【スマホ・タブレット】</b> 左スティックで移動 / 画面スワイプで視点 / 右ボタンで破壊・配置・ジャンプ<br>
            <b>【PC】</b> WASDで移動 / マウスで視点 / 左クリック破壊 / 右クリック配置
        </p>
        <button class="btn" id="start-btn">タップしてプレイ開始</button>
    </div>

    <div id="crosshair"></div>
    <div id="mining-bar-container"><div id="mining-bar"></div></div>

    <div id="hud">
        <div>モード: <strong id="mode-display" style="color:#4CAF50;">クリエイティブ</strong></div>
        <div>選択: <strong id="selected-item-name">草ブロック</strong></div>
        <div id="health-display" style="display:none; color:#FF5252;">体力: ❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
    </div>

    <!-- 上部クイックメニュー -->
    <div id="top-actions">
        <button class="action-mini-btn" onclick="toggleModal('inventory-modal')">🎒一覧</button>
        <button class="action-mini-btn" onclick="toggleModal('crafting-modal')">⚒️作成</button>
        <button class="action-mini-btn" onclick="toggleGameMode()">🔄切替</button>
        <button class="action-mini-btn" onclick="saveWorld()">💾保存</button>
    </div>

    <!-- スマホ用ジョイスティック -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <!-- スマホ用アクションボタン -->
    <div id="mobile-controls">
        <div class="control-row">
            <div class="touch-btn" id="btn-fly-down" style="display:none;">⬇️<span>下降</span></div>
            <div class="touch-btn" id="btn-jump">⬆️<span>ジャンプ</span></div>
        </div>
        <div class="control-row">
            <div class="touch-btn" id="btn-break">🔨<span>破壊</span></div>
            <div class="touch-btn" id="btn-place">🧱<span>配置</span></div>
        </div>
    </div>

    <div id="hotbar"></div>

    <div id="inventory-modal" class="modal">
        <h3 style="margin-top:0; font-size:16px;">全40種類アイテム一覧 (タップで選択スロットへ)</h3>
        <div id="inventory-grid" class="grid"></div>
        <button class="btn" onclick="toggleModal('inventory-modal')">閉じる</button>
    </div>

    <div id="crafting-modal" class="modal">
        <h3 style="margin-top:0; font-size:16px;">クラフト作業台</h3>
        <div id="crafting-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button class="btn" style="margin-top:15px;" onclick="toggleModal('crafting-modal')">閉じる</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. サウンドシステム ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'break') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'place') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'explosion') {
                osc.type = 'square'; osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(20, now + 0.5);
                gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        // --- 2. 40種類のアイテム定義 ---
        const ITEMS = [
            { id: 1, name: "草ブロック", color: 0x558B2F, type: "block", hardness: 0.6 },
            { id: 2, name: "土", color: 0x795548, type: "block", hardness: 0.5 },
            { id: 3, name: "石", color: 0x9E9E9E, type: "block", hardness: 1.5 },
            { id: 4, name: "丸石", color: 0x757575, type: "block", hardness: 2.0 },
            { id: 5, name: "砂", color: 0xFFF59D, type: "block", hardness: 0.5 },
            { id: 6, name: "砂利", color: 0xBDBDBD, type: "block", hardness: 0.6 },
            { id: 7, name: "粘土", color: 0x90A4AE, type: "block", hardness: 0.6 },
            { id: 8, name: "雪ブロック", color: 0xFFFFFF, type: "block", hardness: 0.4 },
            { id: 9, name: "氷", color: 0x81D4FA, type: "block", hardness: 0.5, transparent: true },
            { id: 10, name: "黒曜石", color: 0x311B92, type: "block", hardness: 5.0 },
            { id: 11, name: "オーク原木", color: 0x5D4037, type: "block", hardness: 1.2 },
            { id: 12, name: "オーク木材", color: 0xA1887F, type: "block", hardness: 1.0 },
            { id: 13, name: "白樺原木", color: 0xECEFF1, type: "block", hardness: 1.2 },
            { id: 14, name: "白樺木材", color: 0xFFE0B2, type: "block", hardness: 1.0 },
            { id: 15, name: "葉ブロック", color: 0x388E3C, type: "block", hardness: 0.2, transparent: true },
            { id: 16, name: "サボテン", color: 0x2E7D32, type: "block", hardness: 0.4 },
            { id: 17, name: "カボチャ", color: 0xEF6C00, type: "block", hardness: 0.8 },
            { id: 18, name: "スイカ", color: 0x8BC34A, type: "block", hardness: 0.8 },
            { id: 19, name: "石炭鉱石", color: 0x424242, type: "block", hardness: 2.0 },
            { id: 20, name: "鉄鉱石", color: 0xD7CCC8, type: "block", hardness: 2.5 },
            { id: 21, name: "金鉱石", color: 0xFFD54F, type: "block", hardness: 2.5 },
            { id: 22, name: "ダイヤ鉱石", color: 0x4DD0E1, type: "block", hardness: 3.0 },
            { id: 23, name: "鉄ブロック", color: 0xE0E0E0, type: "block", hardness: 3.0 },
            { id: 24, name: "金ブロック", color: 0xFFC107, type: "block", hardness: 3.0 },
            { id: 25, name: "ダイヤ塊", color: 0x00BCD4, type: "block", hardness: 3.5 },
            { id: 26, name: "ラピス塊", color: 0x1E88E5, type: "block", hardness: 2.5 },
            { id: 27, name: "レンガ", color: 0xB71C1C, type: "block", hardness: 2.0 },
            { id: 28, name: "石レンガ", color: 0x616161, type: "block", hardness: 1.8 },
            { id: 29, name: "ガラス", color: 0xE0F7FA, type: "block", hardness: 0.3, transparent: true },
            { id: 30, name: "発光石", color: 0xFFF176, type: "block", hardness: 0.5 },
            { id: 31, name: "本棚", color: 0x8D6E63, type: "block", hardness: 1.0 },
            { id: 32, name: "羊毛(白)", color: 0xFAFAFA, type: "block", hardness: 0.5 },
            { id: 33, name: "羊毛(赤)", color: 0xE53935, type: "block", hardness: 0.5 },
            { id: 34, name: "羊毛(青)", color: 0x1E88E5, type: "block", hardness: 0.5 },
            { id: 35, name: "作業台", color: 0x6D4C41, type: "block", hardness: 1.2 },
            { id: 36, name: "かまど", color: 0x546E7A, type: "block", hardness: 2.0 },
            { id: 37, name: "TNT", color: 0xD32F2F, type: "block", hardness: 0.2, isTnt: true },
            { id: 38, name: "木ツルハシ", color: 0xA1887F, type: "tool", miningSpeed: 2.0 },
            { id: 39, name: "ダイヤツルハシ", color: 0x00E5FF, type: "tool", miningSpeed: 6.0 },
            { id: 40, name: "焼きリンゴ", color: 0xFF1744, type: "food", heal: 4 }
        ];

        const RECIPES = [
            { result: ITEMS[11], count: 4, req: { item: ITEMS[10], count: 1 }, name: "原木→オーク木材×4" },
            { result: ITEMS[37], count: 1, req: { item: ITEMS[5], count: 4 }, name: "砂×4→TNT×1" },
            { result: ITEMS[38], count: 1, req: { item: ITEMS[11], count: 2 }, name: "木材×2→木ツルハシ" },
            { result: ITEMS[39], count: 1, req: { item: ITEMS[24], count: 1 }, name: "ダイヤ塊→ダイヤツルハシ" }
        ];

        // --- 3. ゲーム状態 & Three.js シーン ---
        let gameMode = "creative";
        let selectedSlot = 0;
        let hotbar = Array(9).fill(0).map((_, i) => ({ item: ITEMS[i % ITEMS.length], count: 64 }));
        let isPlaying = false;
        let isModalOpen = false;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // スマホでの高負荷防止
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        const worldBlocks = new Map();
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const materialsCache = new Map();

        function getMaterial(item) {
            if (!materialsCache.has(item.id)) {
                materialsCache.set(item.id, new THREE.MeshLambertMaterial({
                    color: item.color,
                    transparent: !!item.transparent,
                    opacity: item.transparent ? 0.8 : 1.0
                }));
            }
            return materialsCache.get(item.id);
        }

        function addBlock(x, y, z, item) {
            const key = `${x},${y},${z}`;
            if (worldBlocks.has(key)) return;
            const mesh = new THREE.Mesh(boxGeo, getMaterial(item));
            mesh.position.set(x, y, z);
            mesh.userData = { item: item, pos: { x, y, z } };
            scene.add(mesh);
            worldBlocks.set(key, mesh);
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            if (!worldBlocks.has(key)) return null;
            const mesh = worldBlocks.get(key);
            scene.remove(mesh);
            worldBlocks.delete(key);
            playSound('break');
            return mesh.userData.item;
        }

        // --- 4. ワールド生成 & セーブ ---
        function generateWorld() {
            const saved = localStorage.getItem('webcraft_world');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    data.forEach(b => addBlock(b.x, b.y, b.z, ITEMS.find(i => i.id === b.id) || ITEMS[0]));
                    return;
                } catch (e) {}
            }
            for (let x = -14; x <= 14; x++) {
                for (let z = -14; z <= 14; z++) {
                    const h = Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2);
                    addBlock(x, h, z, ITEMS[0]);
                    addBlock(x, h - 1, z, ITEMS[1]);
                    addBlock(x, h - 2, z, ITEMS[2]);
                }
            }
        }
        generateWorld();

        function saveWorld() {
            const blocksArr = [];
            worldBlocks.forEach((mesh) => {
                blocksArr.push({ x: mesh.userData.pos.x, y: mesh.userData.pos.y, z: mesh.userData.pos.z, id: mesh.userData.item.id });
            });
            localStorage.setItem('webcraft_world', JSON.stringify(blocksArr));
            alert('ワールドを保存しました！');
        }

        // --- 5. モブシステム ---
        const mobs = [];
        class Mob {
            constructor(type, x, y, z) {
                this.type = type;
                const group = new THREE.Group();
                const mat = new THREE.MeshLambertMaterial({ color: type === 'pig' ? 0xF48FB1 : 0x388E3C });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), mat);
                body.position.y = 0.5;
                group.add(body);
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat);
                head.position.set(0, 0.9, type === 'pig' ? 0.7 : 0.5);
                group.add(head);
                group.position.set(x, y, z);
                scene.add(group);
                this.mesh = group;
                this.velocity = new THREE.Vector3((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2).normalize().multiplyScalar(1.5);
                this.timer = 0;
            }
            update(delta, playerPos) {
                this.timer += delta;
                if (this.timer > 3) {
                    this.timer = 0;
                    if (this.type === 'pig') {
                        this.velocity.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2).normalize().multiplyScalar(1.5);
                    }
                }
                if (this.type === 'zombie') {
                    const dir = new THREE.Vector3().subVectors(playerPos, this.mesh.position);
                    dir.y = 0;
                    if (dir.length() < 15 && dir.length() > 1.2) {
                        this.velocity.copy(dir.normalize().multiplyScalar(2.0));
                    } else {
                        this.velocity.set(0, 0, 0);
                    }
                }
                this.mesh.position.x += this.velocity.x * delta;
                this.mesh.position.z += this.velocity.z * delta;
                if (this.velocity.length() > 0.1) {
                    this.mesh.rotation.y = Math.atan2(this.velocity.x, this.velocity.z);
                }
            }
        }
        for (let i = 0; i < 4; i++) {
            mobs.push(new Mob('pig', (Math.random() - 0.5) * 16, 2, (Math.random() - 0.5) * 16));
            mobs.push(new Mob('zombie', (Math.random() - 0.5) * 16, 2, (Math.random() - 0.5) * 16));
        }

        // --- 6. PC & スマホ・タブレット両対応の操作系 ---
        let velocity = new THREE.Vector3();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joyX = 0, joyY = 0; // ジョイスティック入力 (-1 ~ 1)
        let canJump = false, isFlying = false, lastJumpTap = 0;
        let pitch = 0, yaw = 0;
        let isBreaking = false, miningProgress = 0;

        // ゲーム開始処理
        const blocker = document.getElementById('blocker');
        document.getElementById('start-btn').addEventListener('click', () => {
            blocker.style.display = 'none';
            isPlaying = true;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            // PCならポインターロックを試みる
            if (!('ontouchstart' in window)) {
                document.body.requestPointerLock?.();
            }
        });

        // PCマウス視点操作
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && !isModalOpen) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                updateCameraRotation();
            }
        });

        // スマホ・タブレット スワイプ視点操作
        let lookTouchId = null;
        let lastLookX = 0, lastLookY = 0;

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (!isPlaying || isModalOpen) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (lookTouchId === null) {
                    lookTouchId = t.identifier;
                    lastLookX = t.clientX;
                    lastLookY = t.clientY;
                }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!isPlaying || isModalOpen) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === lookTouchId) {
                    const dx = t.clientX - lastLookX;
                    const dy = t.clientY - lastLookY;
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    updateCameraRotation();
                    lastLookX = t.clientX;
                    lastLookY = t.clientY;
                }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        });

        function updateCameraRotation() {
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        // スマホ・タブレット バーチャルジョイスティック
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyTouchId = null;

        joyZone.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            const t = e.changedTouches[0];
            joyTouchId = t.identifier;
            updateJoystick(t.clientX, t.clientY);
        }, { passive: false });

        joyZone.addEventListener('touchmove', (e) => {
            e.preventDefault(); e.stopPropagation();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                }
            }
        }, { passive: false });

        joyZone.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null;
                    joyX = 0; joyY = 0;
                    joyKnob.style.transform = `translate(0px, 0px)`;
                }
            }
        });

        function updateJoystick(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const maxRadius = rect.width / 2 - 20;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);
            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxRadius;
            joyY = dy / maxRadius;
        }

        // スマホ・タブレット アクションボタンイベント
        const btnJump = document.getElementById('btn-jump');
        const btnFlyDown = document.getElementById('btn-fly-down');
        const btnBreak = document.getElementById('btn-break');
        const btnPlace = document.getElementById('btn-place');

        function triggerJump() {
            const now = performance.now();
            if (gameMode === 'creative' && now - lastJumpTap < 300) {
                isFlying = !isFlying;
                velocity.y = 0;
                btnFlyDown.style.display = isFlying ? 'flex' : 'none';
            } else if (isFlying) {
                velocity.y = 6;
            } else if (canJump) {
                velocity.y = 7.5;
                canJump = false;
            }
            lastJumpTap = now;
        }

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); });
        btnJump.addEventListener('touchend', () => { if (isFlying) velocity.y = 0; });
        btnJump.addEventListener('mousedown', triggerJump);
        btnJump.addEventListener('mouseup', () => { if (isFlying) velocity.y = 0; });

        btnFlyDown.addEventListener('touchstart', (e) => { e.preventDefault(); if (isFlying) velocity.y = -6; });
        btnFlyDown.addEventListener('touchend', () => { if (isFlying) velocity.y = 0; });

        btnBreak.addEventListener('touchstart', (e) => { e.preventDefault(); isBreaking = true; miningProgress = 0; });
        btnBreak.addEventListener('touchend', () => { isBreaking = false; miningProgress = 0; document.getElementById('mining-bar-container').style.display = 'none'; });
        btnBreak.addEventListener('mousedown', () => { isBreaking = true; miningProgress = 0; });
        btnBreak.addEventListener('mouseup', () => { isBreaking = false; miningProgress = 0; document.getElementById('mining-bar-container').style.display = 'none'; });

        btnPlace.addEventListener('touchstart', (e) => { e.preventDefault(); handlePlaceAction(); });
        btnPlace.addEventListener('mousedown', handlePlaceAction);

        // PCキーボード＆マウスクリック対応
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyE') { toggleModal('inventory-modal'); return; }
            if (e.code === 'KeyC') { toggleModal('crafting-modal'); return; }
            if (e.code === 'KeyM') { toggleGameMode(); return; }
            if (isModalOpen) return;
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': triggerJump(); break;
                case 'ShiftLeft': if (isFlying) velocity.y = -6; break;
            }
            if (e.key >= '1' && e.key <= '9') { selectedSlot = parseInt(e.key) - 1; updateUI(); }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'Space': case 'ShiftLeft': if (isFlying) velocity.y = 0; break;
            }
        });

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body && !('ontouchstart' in window)) {
                document.body.requestPointerLock?.();
                return;
            }
            if (e.button === 0) { isBreaking = true; miningProgress = 0; }
            else if (e.button === 2) { handlePlaceAction(); }
        });
        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) { isBreaking = false; miningProgress = 0; document.getElementById('mining-bar-container').style.display = 'none'; }
        });
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- 7. ブロック配置・破壊・モード切替 ---
        const raycaster = new THREE.Raycaster();
        raycaster.far = 6;

        function getTargetIntersect() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Array.from(worldBlocks.values()));
            return intersects.length > 0 ? intersects[0] : null;
        }

        function handlePlaceAction() {
            const slot = hotbar[selectedSlot];
            if (!slot || slot.count <= 0) return;
            if (slot.item.type === 'food') {
                if (gameMode === 'survival') { slot.count--; updateUI(); }
                return;
            }
            if (slot.item.type !== 'block') return;
            const hit = getTargetIntersect();
            if (!hit) return;

            const pos = hit.object.position.clone().add(hit.face.normal);
            addBlock(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z), slot.item);
            playSound('place');

            if (slot.item.isTnt) {
                const tntPos = pos.clone();
                setTimeout(() => {
                    playSound('explosion');
                    for (let x = -2; x <= 2; x++) {
                        for (let y = -2; y <= 2; y++) {
                            for (let z = -2; z <= 2; z++) {
                                removeBlock(Math.round(tntPos.x + x), Math.round(tntPos.y + y), Math.round(tntPos.z + z));
                            }
                        }
                    }
                }, 2000);
            }
            if (gameMode === 'survival') { slot.count--; updateUI(); }
        }

        function toggleGameMode() {
            gameMode = gameMode === 'creative' ? 'survival' : 'creative';
            if (gameMode === 'survival') { isFlying = false; btnFlyDown.style.display = 'none'; }
            const modeEl = document.getElementById('mode-display');
            modeEl.textContent = gameMode === 'creative' ? 'クリエイティブ' : 'サバイバル';
            modeEl.style.color = gameMode === 'creative' ? '#4CAF50' : '#FF9800';
            document.getElementById('health-display').style.display = gameMode === 'survival' ? 'block' : 'none';
            updateUI();
        }

        // --- 8. UI & モーダル構築 ---
        function toggleModal(id) {
            const modal = document.getElementById(id);
            const willOpen = modal.style.display !== 'block';
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            modal.style.display = willOpen ? 'block' : 'none';
            isModalOpen = willOpen;
            if (willOpen && document.pointerLockElement) document.exitPointerLock();
        }

        function updateUI() {
            const hotbarEl = document.getElementById('hotbar');
            hotbarEl.innerHTML = '';
            hotbar.forEach((slot, idx) => {
                const div = document.createElement('div');
                div.className = 'slot' + (idx === selectedSlot ? ' active' : '');
                const hexColor = '#' + slot.item.color.toString(16).padStart(6, '0');
                div.innerHTML = `
                    <div class="slot-color" style="background:${hexColor};"></div>
                    <div style="font-size:8px; overflow:hidden; white-space:nowrap; width:36px;">${slot.item.name}</div>
                    <div class="slot-count">${gameMode === 'creative' ? '∞' : slot.count}</div>
                `;
                div.onclick = () => { selectedSlot = idx; updateUI(); };
                hotbarEl.appendChild(div);
            });
            document.getElementById('selected-item-name').textContent = hotbar[selectedSlot].item.name;
        }

        function initModals() {
            const invGrid = document.getElementById('inventory-grid');
            ITEMS.forEach(item => {
                const div = document.createElement('div');
                div.className = 'slot';
                div.style.width = '50px'; div.style.height = '50px';
                div.innerHTML = `<div class="slot-color" style="background:#${item.color.toString(16).padStart(6,'0')}"></div><div style="font-size:8px;">${item.name}</div>`;
                div.onclick = () => { hotbar[selectedSlot] = { item: item, count: 64 }; updateUI(); toggleModal('inventory-modal'); };
                invGrid.appendChild(div);
            });

            const craftList = document.getElementById('crafting-list');
            RECIPES.forEach(rec => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = `${rec.name} (必要: ${rec.req.count}個)`;
                btn.onclick = () => {
                    const slot = hotbar[selectedSlot];
                    if (gameMode === 'survival' && (slot.item.id !== rec.req.item.id || slot.count < rec.req.count)) {
                        alert('選択中のスロットに素材が足りません！');
                        return;
                    }
                    if (gameMode === 'survival') slot.count -= rec.req.count;
                    hotbar[selectedSlot] = { item: rec.result, count: rec.count };
                    updateUI();
                    alert(`${rec.result.name}を作成しました！`);
                };
                craftList.appendChild(btn);
            });
        }

        // --- 9. メインループ ---
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (isPlaying && !isModalOpen) {
                const speed = isFlying ? 10.0 : 5.5;
                const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

                // キーボード + ジョイスティック入力を合成
                let inputForward = (moveForward ? 1 : 0) - (moveBackward ? 1 : 0) - joyY;
                let inputRight = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0) + joyX;

                velocity.x = (forward.x * inputForward + right.x * inputRight) * speed;
                velocity.z = (forward.z * inputForward + right.z * inputRight) * speed;

                if (!isFlying) velocity.y -= 20.0 * delta;

                camera.position.x += velocity.x * delta;
                if (checkCollision(camera.position)) camera.position.x -= velocity.x * delta;
                camera.position.z += velocity.z * delta;
                if (checkCollision(camera.position)) camera.position.z -= velocity.z * delta;
                camera.position.y += velocity.y * delta;
                if (checkCollision(camera.position)) {
                    if (velocity.y < 0) canJump = true;
                    camera.position.y -= velocity.y * delta;
                    velocity.y = 0;
                }

                if (camera.position.y < -15) { camera.position.set(0, 10, 0); velocity.set(0, 0, 0); }

                mobs.forEach(mob => mob.update(delta, camera.position));

                // 採掘処理
                if (isBreaking) {
                    const hit = getTargetIntersect();
                    if (hit) {
                        const pos = hit.object.userData.pos;
                        const blockItem = hit.object.userData.item;
                        if (gameMode === 'creative') {
                            removeBlock(pos.x, pos.y, pos.z);
                            isBreaking = false;
                        } else {
                            const reqTime = (blockItem.hardness || 1.0) / (hotbar[selectedSlot].item.miningSpeed || 1.0);
                            miningProgress += delta;
                            const barCont = document.getElementById('mining-bar-container');
                            barCont.style.display = 'block';
                            document.getElementById('mining-bar').style.width = Math.min((miningProgress / reqTime) * 100, 100) + '%';

                            if (miningProgress >= reqTime) {
                                removeBlock(pos.x, pos.y, pos.z);
                                miningProgress = 0;
                                barCont.style.display = 'none';
                            }
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function checkCollision(pos) {
            const minX = Math.floor(pos.x - 0.3), maxX = Math.floor(pos.x + 0.3);
            const minY = Math.floor(pos.y - 1.5), maxY = Math.floor(pos.y + 0.2);
            const minZ = Math.floor(pos.z - 0.3), maxZ = Math.floor(pos.z + 0.3);
            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (worldBlocks.has(`${x},${y},${z}`)) return true;
                    }
                }
            }
            return false;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initModals();
        updateUI();
        animate();
    </script>
</body>
</html>
