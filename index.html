<!DOCTYPE html>
<html lang="ja">
<head>

    <title>HACKER TERMINAL - Japanese Command List</title>

        #terminal {

            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.4;
            height: 85%;
            overflow-y: auto;
        }
        #input-area {
            display: flex;
            align-items: center;
            font-size: 18px;
            margin-top: 10px;
            border-top: 1px solid #003311;
            padding-top: 10px;
        }
        .prompt {
            color: #33ccff;
            font-weight: bold;
            margin-right: 8px;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            outline: none;
            width: 100%;
        }
        .warning { color: #ff3333; font-weight: bold; }
        .success { color: #33ccff; }
        .system { color: #ffcc00; }
        .stream { color: #00aa44; }
    </style>

    </div>

    <div id="input-area">
        <span class="prompt">root@system:~$</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        
        let autoStreamInterval = null;

        document.addEventListener('click', () => input.focus());

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                
                stopAutoStream();

                appendOutput(`root@system:~$ ${cmd}`);
                processCommand(cmd);

                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

                "警告: セクター7で異常を検知",
                "TORネットワークを経由して再接続中..."
            ];

            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                const prefix = Math.random() > 0.5 ? "[+] " : "[x] ";
                appendOutput(prefix + log, "stream");
            }, 300);
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

                    appendOutput("  ls  : ファイル一覧を表示");
                    appendOutput("  dlc : データベースをダウンロード");
                    appendOutput("  cls : 画面をクリア（消去）");
                    appendOutput("  rst : システム再起動");

                    appendOutput("Available 3-letter commands:", "system");

                    appendOutput("  inf : Display network info & IP");
