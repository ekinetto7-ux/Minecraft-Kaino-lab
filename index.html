<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker OS v2.5.3</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        #terminal-output {
            white-space: pre-wrap;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #0fa;
            margin-right: 10px;
            user-select: none;
        }
        #cmd-input {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="terminal-output">======================================================================
Welcome to Hydra-Core Terminal v2.5.3 [Simple Edition]
一覧表示は 'jp' と入力してください。
★ 'ysu' でサーバーを乗っ取ります。
======================================================================</div>

    <div class="input-line">
        <span class="prompt">root@hydra-net:~#</span>
        <input type="text" id="cmd-input" autofocus autocomplete="off">
    </div>

    <script>
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('terminal-output');
        let typeTimer = null; 

        document.addEventListener('click', () => input.focus());

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                if (command !== '') {
                    output.textContent += `\nroot@hydra-net:~# ${command}`;
                    executeCommand(command);
                }
                input.value = '';
                setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 10);
            }
        });

        // 文字を出力するシンプルな関数
        function printLog(text) {
            if (typeTimer) clearInterval(typeTimer); // 動いているタイマーがあれば止める
            
            let index = 0;
            output.textContent += '\n';
            
            // カタカタ演出
            typeTimer = setInterval(() => {
                if (index < text.length) {
                    output.textContent += text.charAt(index);
                    index++;
                    window.scrollTo(0, document.body.scrollHeight);
                } else {
                    clearInterval(typeTimer);
                    typeTimer = null;
                }
            }, 5);
        }

        function executeCommand(cmd) {
            switch (cmd) {
                case 'jp':
                    // 文字数が多いヘルプメニューは一瞬で表示させてフリーズを完全に防ぐ
                    output.textContent += "\n" + 
                        "=================== ハッカーシステム コマンドメニュー ===================\n\n" +
                        "jp  - メメニュー表示     sys - システム情報      cfg - コンフィグ閲覧    ver - バージョン確認\n" +
                        "cls - 画面ログ消去      tim - 現在時刻の表示    mem - メモリ使用率      upt - 起動時間の計測\n" +
                        "scn - ポートスキャン    prx - プロキシ状態      png - 疎通テストを実行  ipc - IP構成の確認\n" +
                        "run - ペイロード実行    bps - 防御壁バイパス    brt - 総当たり攻撃開始  dos - DDOS攻撃の装填\n" +
                        "log - 侵入履歴の閲覧    src - ソースコード展開  cat - 秘密ファイルの閲覧 rst - 強制リセット\n" +
                        "ysu - 【サーバー乗っ取り】 標的サーバーへの強制クラッキング・侵入";
                    window.scrollTo(0, document.body.scrollHeight);
                    break;

                case 'ysu': // 👈 演出をすべてカットした超シンプルな乗っ取りコマンド
                    printLog(
                        "[CRITICAL] TARGET SERVER HIJACK SEQUENCE INITIATED...\n" +
                        "Connecting to target IP: 157.112.44.89 ... [OK]\n" +
                        "Bypassing firewall layers ... [SUCCESS]\n" +
                        "Cracking root password hashes ... [MATCH FOUND]\n" +
                        "====================================================\n" +
                        "   SERVER HIJACK COMPLETED. YOU ARE NOW THE OWNER.  \n" +
                        "====================================================\n" +
                        "ターゲットサーバーの全権限を掌握しました。"
                    );
                    break;

                // --- その他のコマンド（すべてシンプル仕様） ---
                case 'sys': printLog("OS: Hydra Linux 9.4\nCPU: Quantum 128-Core\nRAM: 512GB\nSecure Layer: ENABLED"); break;
                case 'cfg': printLog("Reading config...\n{\n  \"stealth\": true,\n  \"proxy_chains\": 4,\n  \"auto_destruct\": false\n}"); break;
                case 'ver': printLog("Hydra Terminal Core v2.5.3-release (Build 20261015)"); break;
                case 'cls': output.textContent = "Screen cleared. Type 'jp' for commands."; break;
                case 'tim': printLog(`Current Server Time: ${new Date().toLocaleString('ja-JP')}`); break;
                case 'mem': printLog("Memory Allocation:\n[██████████░░░░░░░░░░] 52% Used\nFree: 245.7 GB / 512 GB"); break;
                case 'upt': printLog("System Uptime: 1,024 hours 43 minutes 12 seconds"); break;
                case 'scn': printLog("Scanning ports...\nPort 22: OPEN (SSH)\nPort 80: OPEN (HTTP)\nPort 443: OPEN (HTTPS)\nPort 3306: OPEN (MySQL)"); break;
                case 'prx': printLog("Proxy status: ENCRYPTED\nChain: JP -> US -> DE -> IS\nAnonymity Level: 99.8%"); break;
                case 'png': printLog("PING target.gov (10.4.21.99): 56 data bytes\n64 bytes from 10.4.21.99: icmp_seq=1 time=12.4 ms"); break;
                case 'ipc': printLog("eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\ninet 192.168.23.104  netmask 255.255.255.0"); break;
                case 'run': printLog("Executing exploit weapon...\nInjecting rootkit... [OK]\nSystem hijacked."); break;
                case 'bps': printLog("Bypassing firewall layers...\nLayer 1: PASSED\nLayer 2: PASSED\nCloudflare: OVERIDDEN [100%]"); break;
                case 'brt': printLog("Starting Brute-Force on SSH...\nTrying wordlist...\n[MATCH] password='admin1234'"); break;
                case 'dos': printLog("Assembling Denial of Service attack...\nTarget flooded with UDP packets. Target status: DOWN"); break;
                case 'log': printLog("TIMESTAMP        EVENT              OPERATOR\n14:05:32     Root Access Granted  THIS TERMINAL"); break;
                case 'src': printLog("void main() {\n    char *shield = malloc(1024);\n    while(1) { fork(); }\n}"); break;
                case 'cat': printLog("Reading secret.txt...\n[CONFIDENTIAL]\nPassphrase: 'omega_alpha'"); break;
                case 'rst': output.textContent = "Resetting environment..."; location.reload(); break;

                default:
                    printLog(`エラー: コマンド '${cmd}' は存在しません。 'jp' を入力してください。`);
                    break;
            }
        }
    </script>
</body>
</html>
