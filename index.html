<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER TERMINAL</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.4;
            height: 85%;
            overflow-y: auto;
        }
        #input-area {
            display: flex;
            align-items: center;
            font-size: 18px;
            margin-top: 10px;
            border-top: 1px solid #003311;
            padding-top: 10px;
        }
        .prompt {
            color: #33ccff;
            font-weight: bold;
            margin-right: 8px;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            outline: none;
            width: 100%;
        }
        .warning { color: #ff3333; font-weight: bold; }
        .success { color: #33ccff; }
        .system { color: #ffcc00; }
        .stream { color: #00aa44; }
    </style>
</head>
<body>

    <div id="terminal">
        <span class="system">=== SECURE SHELL v4.2.1 ===</span>
        Type <span class="success">jp</span> for Japanese command list.
    </div>

    <div id="input-area">
        <span class="prompt">root@system:~$</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        
        let autoStreamInterval = null;

        // ページ内のどこをクリックしても入力欄にフォーカスを戻す
        document.addEventListener('click', () => {
            input.focus();
        });

        // ページ読み込み時にも強制フォーカス
        window.onload = () => {
            input.focus();
        };

        // エンターキーの検知を確実にする
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                
                stopAutoStream();

                appendOutput(`root@system:~$ ${cmd}`);
                processCommand(cmd);

                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function startAutoStream() {
            if (autoStreamInterval) return;

            appendOutput("[*] 自動流し込みモード起動", "system");

            const streamLogs = [
                "カーネルファイアウォールを回避中...",
                "暗号ハッシュを解読中: 0x8F9A2C1B4E...",
                "ポート443にシェルコードを注入中...",
                "リモートデータベースにアクセス中...",
                "プロキシサーバーを経由中 [10.42.8.1]...",
                "ペイロードのダウンロード完了... [OK]",
                "管理者権限（ROOT）を取得しました。",
                "パケットを送信中 -> 宛先: 192.168.1.105",
                "システムログを消去中..."
            ];

            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                const prefix = Math.random() > 0.5 ? "[+] " : "[x] ";
                appendOutput(prefix + log, "stream");
            }, 300);
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

        function processCommand(cmd) {
            if (cmd !== 'jp' && cmd.length !== 3 && cmd !== '') {
                appendOutput("エラー: コマンドは 'jp' または3文字で入力してください", "warning");
                return;
            }

            switch(cmd) {
                case 'jp':
                    appendOutput("【日本語コマンド一覧】", "system");
                    appendOutput("  jp  : 日本語コマンド一覧");
                    appendOutput("  hlp : 英語コマンド一覧");
                    appendOutput("  aut : 自動オートモード開始");
                    appendOutput("  stp : 自動モード停止");
                    appendOutput("  hak : ハッキング開始");
                    appendOutput("  inf : ネットワーク情報表示");
                    appendOutput("  pwd : ディレクトリ表示");
                    appendOutput("  ls  : ファイル一覧");
                    appendOutput("  dlc : データダウンロード");
                    appendOutput("  cls : 画面クリア");
                    appendOutput("  rst : システム再起動");
                    break;

                case 'hlp':
                    appendOutput("Available commands: jp, hlp, aut, stp, hak, inf, pwd, ls, dlc, cls, rst", "system");
                    break;

                case 'aut':
                    startAutoStream();
                    break;

                case 'stp':
                    stopAutoStream();
                    appendOutput("[*] ストリーム停止", "warning");
                    break;

                case 'hak':
                    appendOutput("[!] ファイアウォール突破...", "warning");
                    appendOutput("[OK] アクセス許可されました。", "success");
                    break;

                case 'inf':
                    appendOutput("IP: 192.168.1.105 | GATEWAY: 10.0.0.1 [SECURE]", "success");
                    break;

                case 'pwd':
                    appendOutput("/var/root/secure/kernel");
                    break;

                case 'ls ':
                case 'ls_':
                case 'dir':
                    appendOutput("payload.bin  override.sh  user_data.db", "success");
                    break;

                case 'dlc':
                    appendOutput("Downloading... [████████████] 100% [OK]", "success");
                    break;

                case 'cls':
                    terminal.innerHTML = "";
                    break;

                case 'rst':
                    appendOutput("Rebooting...", "warning");
                    setTimeout(() => {
                        terminal.innerHTML = '<span class="system">=== RESTARTED ===</span>\nType <span class="success">jp</span>';
                    }, 800);
                    break;

                default:
                    if (cmd === '') break;
                    appendOutput(`不明なコマンド: '${cmd}' ('jp'で一覧)`, "warning");
                    break;
            }
        }
    </script>
</body>
</html>
