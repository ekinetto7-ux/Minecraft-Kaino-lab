<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROOT TERMINAL</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; padding: 20px; margin: 0; font-size: 16px; }
        #output { width: 100%; height: calc(100vh - 80px); overflow-y: auto; box-sizing: border-box; white-space: pre-wrap; }
        #input-line { display: flex; align-items: center; margin-top: 10px; background-color: #000; }
        .prompt { color: #0f0; margin-right: 10px; font-weight: bold; }
        #cmd-input { background: transparent; border: none; color: #fff; font-family: monospace; font-size: 16px; width: 100%; outline: none; }
        .blue { color: #8af; }
        .red { color: #f55; }
        .yellow { color: #ff0; }
    </style>
</head>
<body>
    <div id="output">=== 🚨 ADMINISTRATIVE TERMINAL v2.0 🚨 ===
[STATUS: READY] コマンド一覧: inf / scn / net / sys / atk / stp / bye / cls

</div>
    <div id="input-line">
        <span class="prompt">root@ipad:~#</span>
        <input type="text" id="cmd-input" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('cmd-input');
        let globalLoop = null;

        function focusInput() { input.focus(); }
        document.addEventListener('click', focusInput);
        document.addEventListener('touchstart', focusInput);
        window.onload = focusInput;

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                output.innerHTML += `<div><span class="prompt">root@ipad:~#</span> <span style="color:#fff">${input.value}</span></div>`;
                
                // コマンド分岐
                if (command === 'inf') {
                    output.innerHTML += `<div class="blue">[iPad_STATUS_LOG]
➜ BATTERY: 100% (HEALTHY) | VOLTAGE: 3.82V
➜ CPU_LOAD: 12.5% (STABLE) | CORE_ACTIVE: 8
➜ NETWORK: CONNECTED (SECURE)</div>`;
                } 
                else if (command === 'cls') {
                    output.innerHTML = '';
                } 
                else if (command === 'scn') {
                    output.innerHTML += `<div>[NETWORK_SCAN] スキャンを開始します...</div>`;
                    let count = 0;
                    let interval = setInterval(() => {
                        output.innerHTML += `<div class="blue">➜ Checking IP 192.168.1.${Math.floor(Math.random()*254)} ... [OK]</div>`;
                        output.scrollTop = output.scrollHeight;
                        count++;
                        if(count > 10) {
                            clearInterval(interval);
                            output.innerHTML += `<div class="red">[SUCCESS] スキャン完了。脆弱性はありません。</div>`;
                            output.scrollTop = output.scrollHeight;
                        }
                    }, 150);
                } 
                else if (command === 'net') {
                    output.innerHTML += `<div class="blue">[NETWORK_CONFIG]
➜ GLOBAL_IP: 210.${Math.floor(Math.random()*255)}.45.112
➜ SUBNET_MASK: 255.255.255.0
➜ HOSTNAME: apple.ipad.internal.root
➜ OPEN_PORT: 80, 443, 22 (SSH_ACTIVE)</div>`;
                }
                else if (command === 'sys') {
                    output.innerHTML += `<div>[SYSTEM_DECRYPT] ストレージを解析中...</div>`;
                    let pct = 0;
                    let interval = setInterval(() => {
                        pct += Math.floor(Math.random()*15) + 5;
                        if(pct > 100) pct = 100;
                        output.innerHTML += `<div class="yellow">➜ Progress: ${pct}% ... 解読中</div>`;
                        output.scrollTop = output.scrollHeight;
                        if(pct >= 100) {
                            clearInterval(interval);
                            output.innerHTML += `<div class="blue">[COMPLETE] 全システムファイルの展開に成功しました。</div>`;
                            output.scrollTop = output.scrollHeight;
                        }
                    }, 200);
                }
                else if (command === 'atk') {
                    output.innerHTML += `<div class="red">[ATTACK_STREAM] 疑似パケットの高速送信を開始。停止は 'stp'</div>`;
                    if(globalLoop) clearInterval(globalLoop);
                    globalLoop = setInterval(() => {
                        output.innerHTML += `<div class="red">[SEND] PACKET ➜ DEST: 10.0.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)} | SIZE: 64KB | STATUS: 200</div>`;
                        output.scrollTop = output.scrollHeight;
                    }, 50);
                }
                else if (command === 'stp') {
                    if(globalLoop) {
                        clearInterval(globalLoop);
                        globalLoop = null;
                        output.innerHTML += `<div class="blue">[STOP] すべてのバックグラウンドログを強制停止しました。</div>`;
                    } else {
                        output.innerHTML += `<div>エラー: 動いているプロセスがありません。</div>`;
                    }
                }
                else if (command === 'bye') {
                    output.innerHTML += `<div class="red">[SHUTDOWN] 管理者セッションを終了します...
[LOGOUT] root@ipad disconnected.</div>`;
                    setTimeout(() => { output.innerHTML = ''; }, 1500);
                }
                else if (command !== "") {
                    output.innerHTML += `<div class="red">エラー: '${command}' は存在しません。</div>`;
                }

                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        });
    </script>
</body>
</html>
