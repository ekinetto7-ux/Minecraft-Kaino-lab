<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL - OS v7.0 ULTIMATE</title>
    <style>
        body {
            background-color: #020508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        #window-frame {
            width: 100%;
            max-width: 980px;
            height: 90vh;
            background-color: rgba(5, 8, 15, 0.92);
            border: 1px solid #00ffcc66;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .window-header {
            background-color: #0d1322;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #00ffcc33;
        }
        .window-buttons {
            display: flex;
            gap: 8px;
        }
        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .btn-red { background-color: #ff5f56; }
        .btn-yellow { background-color: #ffbd2e; }
        .btn-green { background-color: #27c93f; }
        .window-title {
            margin-left: 15px;
            font-size: 13px;
            color: #8899a6;
            letter-spacing: 1px;
        }
        #terminal {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            padding: 15px;
        }
        #command-form {
            display: flex;
            align-items: center;
            font-size: 15px;
            padding: 12px 15px;
            background-color: #060912;
            border-top: 1px solid #00ffcc33;
        }
        .prompt {
            color: #ff007f;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .warning { color: #ff3366; font-weight: bold; }
        .success { color: #00ffcc; }
        .system { color: #ffaa00; }
        .stream { color: #00aa66; }
        .matrix { color: #00ff00; }
        .dim { color: #335544; }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div id="window-frame">
        <div class="window-header">
            <div class="window-buttons">
                <div class="btn btn-red"></div>
                <div class="btn btn-yellow"></div>
                <div class="btn btn-green"></div>
            </div>
            <div class="window-title">root@cyber-shell:v7.0 (ultimate-edition)</div>
        </div>

        <div id="terminal">
            <span class="system">=======================================================</span>
            <span class="system">  CYBER TERMINAL v7.0-ULTIMATE [20 COMMANDS UNLOCKED]</span>
            <span class="system">=======================================================</span>
            Type <span class="success">jp</span> for Japanese command list, or <span class="success">aut</span> for live stream.
        </div>

        <form id="command-form">
            <span class="prompt">root@cyber:~#</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </form>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        const form = document.getElementById('command-form');
        
        let autoStreamInterval = null;
        let isProcessing = false;

        // タイピング音生成
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playKeySound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        input.addEventListener('keydown', () => { playKeySound(); });

        // 背景マトリックス
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@
