<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebCraft 3D</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-container"></div>

  <!-- クロスヘア -->
  <div id="crosshair">+</div>

  <!-- 左上ステータス＆メニューボタン -->
  <div id="hud-top">
    <div id="coords">X: 0 Y: 0 Z: 0</div>
    <button id="menu-btn" type="button">メニュー</button>
  </div>

  <!-- メニュー画面（ポーズ・ワールド管理） -->
  <div id="overlay">
    <div class="menu-box">
      <h1>WebCraft 3D</h1>
      <p class="subtitle">基本ワールド・建築システム</p>
      <button id="play-btn" class="primary-btn" type="button">ワールドに入る / 再開</button>
      <div class="menu-row">
        <button id="save-btn" type="button">ワールドを保存</button>
        <button id="new-world-btn" type="button">新しいワールド生成</button>
      </div>
      <p id="status-msg"></p>
      <div class="controls-guide">
        <strong>【PC操作】</strong><br />
        WASD：移動 ／ Space：ジャンプ ／ マウス：視点<br />
        左クリック：ブロック破壊 ／ 右クリック：ブロック設置<br />
        1〜8キー or ホイール：ブロック選択 ／ Esc：メニュー<br /><br />
        <strong>【スマホ操作】</strong><br />
        左画面ドラッグ：移動 ／ 右画面ドラッグ：視点<br />
        画面右下のボタン：破壊・設置・ジャンプ
      </div>
    </div>
  </div>

  <!-- 画面下のホットバー -->
  <div id="hotbar"></div>

  <!-- スマホ用タッチコントロール -->
  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>
    <div id="action-buttons">
      <button id="btn-break" type="button">壊す</button>
      <button id="btn-place" type="button">置く</button>
      <button id="btn-jump" type="button">JUMP</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
