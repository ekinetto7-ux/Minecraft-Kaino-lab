<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINECRAFT - Modular Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <h1 class="mc-title">MINECRAFT</h1>
        <p class="mc-subtitle">Modular Survival Prototype</p>
        <button class="mc-btn" onclick="startTheGame()">ゲームを始める</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen hidden">
        <div id="crosshair"></div>
        <div id="info">操作: 画面ドラッグで視点移動<br>左下十字キーで移動 / 右下ボタンでジャンプ</div>

        <!-- 十字キー -->
        <div id="dpad">
            <div></div><div class="dpad-btn" id="move-forward">▲</div><div></div>
            <div class="dpad-btn" id="move-left">◀</div><div class="dpad-btn">●</div><div class="dpad-btn" id="move-right">▶</div>
            <div></div><div class="dpad-btn" id="move-back">▼</div><div></div>
        </div>

        <!-- アクションボタン -->
        <div id="action-btns">
            <div class="action-btn" id="btn-jump">ジャンプ</div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
