<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINECRAFT - Web Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; overflow: hidden;
            font-family: 'Courier New', 'Hiragino Kaku Gothic ProN', monospace, sans-serif;
            touch-action: none; background: #1e1e1e; color: white;
        }

        /* 本家風ベベル（立体）ボタン */
        .mc-btn {
            background: #727272; border: 3px solid #1e1e1e;
            box-shadow: inset 3px 3px 0 #a8a8a8, inset -3px -3px 0 #484848;
            color: #ffffff; font-weight: bold; font-size: 16px; padding: 12px 20px;
            cursor: pointer; text-shadow: 2px 2px 0 #2b2b2b; text-align: center;
        }
        .mc-btn:hover { background: #7f8a99; box-shadow: inset 3px 3px 0 #b8c7db, inset -3px -3px 0 #4c535c; }
        .mc-btn:active { box-shadow: inset -3px -3px 0 #a8a8a8, inset 3px 3px 0 #484848; }
        .mc-btn.green { background: #3c8527; box-shadow: inset 3px 3px 0 #63b548, inset -3px -3px 0 #235215; }
        .mc-btn.green:hover { background: #489c30; }
        .mc-btn.red { background: #a82828; box-shadow: inset 3px 3px 0 #d95252, inset -3px -3px 0 #6b1515; }

        /* 画面オーバーレイ */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; background: rgba(0, 0, 0, 0.35);
        }
        .hidden { display: none !important; }

        /* 本家風ブロックロゴ */
        .mc-logo-box {
            text-align: center; margin-bottom: 30px; position: relative;
        }
        .mc-logo {
            font-size: clamp(38px, 9vw, 76px); font-weight: 900; letter-spacing: 3px;
            color: #d8d8d8;
            text-shadow:
                0 2px 0 #999, 0 4px 0 #777, 0 6px 0 #555, 0 8px 0 #333,
                0 12px 15px rgba(0,0,0,0.85);
        }
        .mc-splash {
            color: #ffff55; font-weight: bold; font-size: clamp(14px, 3vw, 20px);
            text-shadow: 2px 2px 0 #3f3f00;
            position: absolute; right: -10px; bottom: -14px;
            animation: splashPulse 0.6s infinite alternate ease-in-out;
        }
        @keyframes splashPulse {
            from { transform: rotate(-12deg) scale(0.95); }
            to { transform: rotate(-12deg) scale(1.08); }
        }

        /* パネル */
        .mc-panel {
            background: #c6c6c6; border: 4px solid #1e1e1e;
            box-shadow: inset 4px 4px 0 #ffffff, inset -4px -4px 0 #555555;
            color: #222; width: 92vw; max-width: 560px; padding: 18px;
        }
        .mc-panel h2 { margin: 0 0 12px 0; font-size: 19px; text-align: center; color: #333; }

        #world-list-container {
            background: #1a1a1a; border: 3px solid #555; height: 210px; overflow-y: auto;
            padding: 8px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px;
        }
        .world-item {
            background: #333; border: 2px solid #666; padding: 10px 12px; color: white;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .world-item:hover { border-color: #fff; background: #444; }
        .world-info h4 { margin: 0 0 4px 0; font-size: 15px; color: #fff; }
        .world-info p { margin: 0; font-size: 11px; color: #aaa; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #333; }
        .mc-input {
            width: 100%; padding: 9px; background: #000; color: #fff;
            border: 2px solid #777; font-size: 14px; font-family: inherit;
        }
        .toggle-row { display: flex; gap: 6px; }
        .toggle-btn { flex: 1; padding: 9px; font-size: 13px; }
        .toggle-btn.selected { background: #3c8527; box-shadow: inset 3px 3px 0 #63b548, inset -3px -3px 0 #235215; }

        /* ゲーム内HUD（原作準拠のシンプル配置） */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
            mix-blend-mode: difference;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #ffffff; }
        #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
        #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }

        /* 上部中央の小さなポーズ・チャット風アイコン（統合版準拠） */
        #top-bar {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 20;
        }
        .mc-top-icon {
            background: rgba(30, 30, 30, 0.7); border: 2px solid #888;
            color: white; font-size: 12px; font-weight: bold; padding: 6px 10px;
            cursor: pointer; text-shadow: 1px 1px 0 #000;
        }

        /* 座標表示（統合版左上の座標ボックス風） */
        #coords-box {
            position: absolute; top: 44px; left: 8px;
            background: rgba(0, 0, 0, 0.45); color: #fff;
            padding: 4px 8px; font-size: 12px; pointer-events: none; z-index: 10;
            text-shadow: 1px 1px 0 #000;
        }

        /* ステータスバー（ホットバーのすぐ上に配置する原作スタイル） */
        #status-bars {
            position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
            width: min(396px, 94vw); display: flex; justify-content: space-between;
            pointer-events: none; z-index: 15; font-size: 13px; text-shadow: 1px 1px 0 #000;
        }

        /* ホットバー（原作の石枠デザイン） */
        #hotbar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            display: flex; background: #8b8b8b; padding: 2px;
            border: 3px solid #1e1e1e; box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #fff;
            z-index: 15;
        }
        .slot {
            width: 40px; height: 40px; border: 2px solid #373737;
            background: #8b8b8b; display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer;
        }
        .slot.active {
            border: 3px solid #ffffff; background: #a5a5a5; z-index: 2; transform: scale(1.06);
        }
        .slot-icon { width: 26px; height: 26px; image-rendering: pixelated; }
        .slot-count {
            position: absolute; bottom: 1px; right: 2px; color: white;
            font-weight: bold; font-size: 11px; text-shadow: 1.5px 1.5px 0 #222;
        }
        .slot-more {
            width: 36px; height: 40px; background: #5a5a5a; border: 2px solid #222;
            color: white; font-weight: bold; font-size: 16px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }

        /* スマホ・タブレット用コントローラー（統合版十字キー＋右側ボタン配置） */
        #dpad {
            position: absolute; bottom: 68px; left: 18px; width: 132px; height: 132px;
            z-index: 15; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px;
        }
        .dpad-btn {
            background: rgba(255, 255, 255, 0.22); border: 2px solid rgba(255, 255, 255, 0.35);
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.85); font-size: 16px; font-weight: bold;
        }
        .dpad-btn:active { background: rgba(255, 255, 255, 0.5); }

        #right-touch-controls {
            position: absolute; bottom: 68px; right: 18px;
            display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 15;
        }
        .touch-circle {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.22); border: 2px solid rgba(255, 255, 255, 0.45);
            color: white; font-size: 11px; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-shadow: 1px 1px 0 #000;
        }
        .touch-circle:active { background: rgba(255, 255, 255, 0.5); }

        /* モーダル（マイクラ風インベントリ） */
        .modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #c6c6c6; border: 4px solid #1e1e1e;
            box-shadow: inset 4px 4px 0 #fff, inset -4px -4px 0 #555;
            color: #222; padding: 14px; z-index: 30;
            width: 92vw; max-width: 500px; max-height: 78vh; overflow-y: auto;
        }
        .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; margin-top: 8px; background: #8b8b8b; padding: 6px; border: 2px solid #373737; }
        .inv-cell {
            aspect-ratio: 1; background: #8b8b8b; border: 2px solid #373737;
            box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
        }
        .inv-cell:hover { background: #a8a8a8; }

        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(220, 0, 0, 0.35); pointer-events: none; z-index: 25; display: none;
        }
        #item-toast {
            position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 13px; text-shadow: 1.5px 1.5px 0 #000;
            pointer-events: none; z-index: 15; opacity: 0; transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <div id="home-screen" class="screen">
        <div class="mc-logo-box">
            <div class="mc-logo">MINECRAFT</div>
            <div class="mc-splash">Web Edition!</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:12px; width:270px;">
            <button class="mc-btn green" onclick="openWorldSelect()">プレイ</button>
            <button class="mc-btn" onclick="toggleAudioBGM()">BGM: <span id="bgm-status">ON</span></button>
            <button class="mc-btn" onclick="alert('【操作ガイド】\n■PC: WASD移動 / マウス視点 / 左クリック破壊・攻撃 / 右クリック配置 / Eキー持ち物\n■スマホ・タブレット: 左十字キー移動 / 画面なぞって視点 / 右ボタンでジャンプ・破壊・配置')">操作方法</button>
        </div>
    </div>

    <!-- 2. ワールド選択画面 -->
    <div id="world-select-screen" class="screen hidden">
        <div class="mc-panel">
            <h2>ワールドを選択</h2>
            <div id="world-list-container"></div>
            <div style="display:flex; gap:8px;">
                <button class="mc-btn green" style="flex:2;" onclick="openCreateWorld()">新しく作る</button>
                <button class="mc-btn" style="flex:1;" onclick="showScreen('home-screen')">戻る</button>
            </div>
        </div>
    </div>

    <!-- 3. 新規ワールド作成画面 -->
    <div id="create-world-screen" class="screen hidden">
        <div class="mc-panel">
            <h2>新しいワールドを作成</h2>
            <div class="form-group">
                <label>ワールド名</label>
                <input type="text" id="new-world-name" class="mc-input" value="マイワールド">
            </div>
            <div class="form-group">
                <label>デフォルトのゲームモード</label>
                <div class="toggle-row" id="mode-selector">
                    <button class="mc-btn toggle-btn selected" data-val="survival" onclick="selectOption('mode-selector', this)">サバイバル</button>
                    <button class="mc-btn toggle-btn" data-val="creative" onclick="selectOption('mode-selector', this)">クリエイティブ</button>
                </div>
            </div>
            <div class="form-group">
                <label>ワールドの種類</label>
                <div class="toggle-row" id="type-selector">
                    <button class="mc-btn toggle-btn selected" data-val="normal" onclick="selectOption('type-selector', this)">無限(森林・海)</button>
                    <button class="mc-btn toggle-btn" data-val="flat" onclick="selectOption('type-selector', this)">フラット</button>
                    <button class="mc-btn toggle-btn" data-val="island" onclick="selectOption('type-selector', this)">スカイブロック</button>
                </div>
            </div>
            <div class="form-group">
                <label>シード値（任意）</label>
                <input type="text" id="new-world-seed" class="mc-input" placeholder="空白でランダム生成">
            </div>
            <div style="display:flex; gap:8px; margin-top:16px;">
                <button class="mc-btn green" style="flex:2;" onclick="createAndStartWorld()">作成</button>
                <button class="mc-btn" style="flex:1;" onclick="openWorldSelect()">戻る</button>
            </div>
        </div>
    </div>

    <!-- 4. ゲーム内HUD -->
    <div id="game-ui" class="hidden">
        <div id="crosshair"></div>
        <div id="damage-flash"></div>
        <div id="item-toast">草ブロック</div>

        <div id="top-bar">
            <button class="mc-top-icon" onclick="toggleModal('crafting-modal')">⚒️ クラフト</button>
            <button class="mc-top-icon" onclick="toggleGameMode()">🔄 <span id="mode-label">サバイバル</span></button>
            <button class="mc-top-icon" onclick="saveAndQuit()">⏸️ 保存して終了</button>
        </div>

        <div id="coords-box">位置: 0, 0, 0</div>

        <!-- 原作準拠：ホットバー直上のハート＆満腹度バー -->
        <div id="status-bars">
            <div id="health-bar">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
            <div id="hunger-bar">🍖🍖🍖🍖🍖🍖🍖🍖🍖🍖</div>
        </div>

        <!-- 原作準拠の石枠ホットバー -->
        <div id="hotbar"></div>

        <!-- 統合版準拠の左十字キー -->
        <div id="dpad">
            <div></div>
            <div class="dpad-btn" id="dp-up">▲</div>
            <div></div>
            <div class="dpad-btn" id="dp-left">◀</div>
            <div class="dpad-btn" id="dp-center" style="font-size:10px;">●</div>
            <div class="dpad-btn" id="dp-right">▶</div>
            <div></div>
            <div class="dpad-btn" id="dp-down">▼</div>
            <div></div>
        </div>

        <!-- 右側アクションボタン -->
        <div id="right-touch-controls">
            <div class="touch-circle" id="btn-fly-down" style="display:none;">⬇️<span>下降</span></div>
            <div class="touch-circle" id="btn-jump">⬆️<span>ジャンプ</span></div>
            <div style="display:flex; gap:10px;">
                <div class="touch-circle" id="btn-break">⛏️<span>破壊/攻撃</span></div>
                <div class="touch-circle" id="btn-place">🧱<span>配置/使用</span></div>
            </div>
        </div>

        <!-- インベントリ（持ち物）モーダル -->
        <div id="inventory-modal" class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; font-size:16px;">アイテム一覧（40種）</h3>
                <button class="mc-btn red" style="padding:4px 10px; font-size:12px;" onclick="toggleModal('inventory-modal')">✕</button>
            </div>
            <p style="font-size:11px; color:#444; margin:4px 0;">タップすると選択中のホットバー枠にセットされます</p>
            <div id="inventory-grid" class="inv-grid"></div>
        </div>

        <!-- クラフトモーダル -->
        <div id="crafting-modal" class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; font-size:16px;">クラフト</h3>
                <button class="mc-btn red" style="padding:4px 10px; font-size:12px;" onclick="toggleModal('crafting-modal')">✕</button>
            </div>
            <div id="crafting-list" style="display:flex; flex-direction:column; gap:6px; margin-top:10px;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. 原作風ドット絵テクスチャ生成（6面描き分け対応） ---
        function makeCanvasTex(drawFn) {
            const c = document.createElement('canvas');
            c.width = 16; c.height = 16;
            const ctx = c.getContext('2d');
            drawFn(ctx);
            const tex = new THREE.CanvasTexture(c);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return { tex, url: c.toDataURL() };
        }

        function fillNoise(ctx, hex, variance = 22) {
            const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
            for (let y = 0; y < 16; y++) {
                for (let x = 0; x < 16; x++) {
                    const d = (Math.random() - 0.5) * variance;
                    ctx.fillStyle = `rgb(${clamp(r+d)},${clamp(g+d)},${clamp(b+d)})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        }
        function clamp(v) { return Math.min(255, Math.max(0, Math.floor(v))); }

        // 特殊テクスチャ群
        const TEX_GRASS_TOP = makeCanvasTex(ctx => fillNoise(ctx, 0x5d9b37, 28));
        const TEX_DIRT = makeCanvasTex(ctx => fillNoise(ctx, 0x79553a, 26));
        const TEX_GRASS_SIDE = makeCanvasTex(ctx => {
            fillNoise(ctx, 0x79553a, 26);
            for (let x = 0; x < 16; x++) {
                const h = 3 + (x % 3 === 0 ? 2 : (x % 2));
                for (let y = 0; y < h; y++) {
                    ctx.fillStyle = y === h - 1 ? '#487a2a' : '#5d9b37';
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        });
        const TEX_OAK_TOP = makeCanvasTex(ctx => {
            fillNoise(ctx, 0x9c7f4e, 15);
            ctx.strokeStyle = '#5c4424'; ctx.lineWidth = 1;
            ctx.strokeRect(0.5, 0.5, 15, 15);
            ctx.strokeRect(3.5, 3.5, 9, 9);
            ctx.strokeRect(6.5, 6.5, 3, 3);
        });
        const TEX_OAK_SIDE = makeCanvasTex(ctx => {
            fillNoise(ctx, 0x5c4424, 18);
            ctx.fillStyle = '#3e2d16';
            for (let x = 1; x < 16; x += 3) ctx.fillRect(x, 0, 1, 16);
        });
        const TEX_CRAFT_TOP = makeCanvasTex(ctx => {
            fillNoise(ctx, 0x9c7f4e, 15);
            ctx.fillStyle = '#3e2d16';
            ctx.fillRect(0, 0, 16, 2); ctx.fillRect(0, 14, 16, 2);
            ctx.fillRect(0, 0, 2, 16); ctx.fillRect(14, 0, 2, 16);
            ctx.fillRect(5, 2, 1, 12); ctx.fillRect(10, 2, 1, 12);
            ctx.fillRect(2, 5, 12, 1); ctx.fillRect(2, 10, 12, 1);
        });
        const TEX_TNT_SIDE = makeCanvasTex(ctx => {
            fillNoise(ctx, 0xc9302c, 20);
            ctx.fillStyle = '#eeeeee'; ctx.fillRect(0, 5, 16, 6);
            ctx.fillStyle = '#111111';
            // T N T 文字ドット
            ctx.fillRect(2, 6, 3, 1); ctx.fillRect(3, 6, 1, 4);
            ctx.fillRect(6, 6, 1, 4); ctx.fillRect(7, 7, 1, 1); ctx.fillRect(8, 8, 1, 1); ctx.fillRect(9, 6, 1, 4);
            ctx.fillRect(11, 6, 3, 1); ctx.fillRect(12, 6, 1, 4);
        });
        const TEX_FURNACE_FRONT = makeCanvasTex(ctx => {
            fillNoise(ctx, 0x777777, 25);
            ctx.fillStyle = '#222222';
            ctx.fillRect(4, 3, 8, 4);
            ctx.fillRect(4, 10, 8, 5);
        });

        // --- 2. 40種類のアイテム定義 ---
        const ITEMS = [
            { id: 1, name: "草ブロック", color: 0x5d9b37, type: "block", hardness: 0.6, multiTex: [TEX_GRASS_SIDE, TEX_GRASS_SIDE, TEX_GRASS_TOP, TEX_DIRT, TEX_GRASS_SIDE, TEX_GRASS_SIDE] },
            { id: 2, name: "土", color: 0x79553a, type: "block", hardness: 0.5, customTex: TEX_DIRT },
            { id: 3, name: "石", color: 0x808080, type: "block", hardness: 1.5 },
            { id: 4, name: "丸石", color: 0x6b6b6b, type: "block", hardness: 2.0, pat: 'cobble' },
            { id: 5, name: "砂", color: 0xe3d796, type: "block", hardness: 0.5 },
            { id: 6, name: "砂利", color: 0x8a8585, type: "block", hardness: 0.6 },
            { id: 7, name: "粘土", color: 0x9aa3b0, type: "block", hardness: 0.6 },
            { id: 8, name: "雪ブロック", color: 0xf7fafa, type: "block", hardness: 0.4 },
            { id: 9, name: "氷", color: 0x82b6ff, type: "block", hardness: 0.5, transparent: true },
            { id: 10, name: "黒曜石", color: 0x1b122b, type: "block", hardness: 5.0 },
            { id: 11, name: "オークの原木", color: 0x5c4424, type: "block", hardness: 1.2, multiTex: [TEX_OAK_SIDE, TEX_OAK_SIDE, TEX_OAK_TOP, TEX_OAK_TOP, TEX_OAK_SIDE, TEX_OAK_SIDE] },
            { id: 12, name: "オークの板材", color: 0x9c7f4e, type: "block", hardness: 1.0, pat: 'planks' },
            { id: 13, name: "シラカバの原木", color: 0xd9dad5, type: "block", hardness: 1.2, pat: 'birch' },
            { id: 14, name: "シラカバの板材", color: 0xc4b581, type: "block", hardness: 1.0, pat: 'planks' },
            { id: 15, name: "オークの葉", color: 0x357a28, type: "block", hardness: 0.2, transparent: true },
            { id: 16, name: "サボテン", color: 0x1e6623, type: "block", hardness: 0.4 },
            { id: 17, name: "カボチャ", color: 0xc97316, type: "block", hardness: 0.8 },
            { id: 18, name: "スイカ", color: 0x6ea82d, type: "block", hardness: 0.8 },
            { id: 19, name: "石炭鉱石", color: 0x808080, type: "block", hardness: 2.0, oreColor: '#1e1e1e' },

                }

                fillNoise(ctx, item.color, 24);
                if (item.pat === 'planks') {
                    ctx.fillStyle = '#4a381d';
                    ctx.fillRect(0, 3, 16, 1); ctx.fillRect(0, 7, 16, 1); ctx.fillRect(0, 11, 16, 1); ctx.fillRect(0, 15, 16, 1);
                } else if (item.pat === 'brick') {
                    ctx.fillStyle = '#444444';

                    ctx.clearRect(2, 2, 12, 12);

        // --- 3. マイクラ風サウンド＆BGM（Web Audio API） ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmEnabled = true;

        function toggleAudioBGM() {
            bgmEnabled = !bgmEnabled;
            document.getElementById('bgm-status').textContent = bgmEnabled ? 'ON' : 'OFF';
            if (bgmEnabled && audioCtx.state === 'suspended') audioCtx.resume();

        // C418風の穏やかなピアノアルペジオを自動演奏
        const pianoNotes = [261.63, 329.63, 392.00, 493.88, 523.25, 392.00, 329.63, 293.66];
        let noteIdx = 0;
        setInterval(() => {
            if (!bgmEnabled || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(pianoNotes[noteIdx % pianoNotes.length], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 2.3);
            noteIdx++;
        }, 1800);

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'break') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.09);
                gain.gain.setValueAtTime(0.22, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                osc.start(now); osc.stop(now + 0.09);
            } else if (type === 'place') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.07);
                gain.gain.setValueAtTime(0.22, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
                osc.start(now); osc.stop(now + 0.07);
            } else if (type === 'hit') {
                osc.type = 'square'; osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(55, now + 0.14);
                gain.gain.setValueAtTime(0.28, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
                osc.start(now); osc.stop(now + 0.14);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(75, now);
                osc.frequency.linearRampToValueAtTime(18, now + 0.55);
                gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.55);
                osc.start(now); osc.stop(now + 0.55);
            }
        }

        // --- 4. 画面遷移・ワールド管理 ---

        // --- 5. Three.js シーン & ブロック選択枠・プレイヤーの右腕 ---

        const worldBlocks = new Map();

        function addBlock(x, y, z, item) {
            const key = `${x},${y},${z}`;
            if (worldBlocks.has(key)) return;
            const mesh = new THREE.Mesh(boxGeo, itemMaterials.get(item.id));
            mesh.position.set(x, y, z);
            mesh.userData = { item: item, pos: { x, y, z } };
            scene.add(mesh);
            worldBlocks.set(key, mesh);
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            if (!worldBlocks.has(key)) return null;
            const mesh = worldBlocks.get(key);
            scene.remove(mesh);
            worldBlocks.delete(key);
            playSound('break');
            return mesh.userData.item;
        }

        function clearWorld() {
            worldBlocks.forEach(m => scene.remove(m));
            worldBlocks.clear();

            mobs.length = 0;

        function seededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return () => (s = s * 16807 % 2147483647) / 2147483647;
        }

        function buildTerrain(type, seedNum) {
            clearWorld();
            const rand = seededRandom(seedNum);

            if (type === 'flat') {
                for (let x = -18; x <= 18; x++) {
                    for (let z = -18; z <= 18; z++) {
                        addBlock(x, 0, z, ITEMS[0]);
                        addBlock(x, -1, z, ITEMS[1]);
                        addBlock(x, -2, z, ITEMS[2]);
                    }
                }
            } else if (type === 'island') {
                // スカイブロック風のL字浮島＋木
                for (let x = -3; x <= 3; x++) {
                    for (let z = -3; z <= 3; z++) {
                        if (x > 0 && z > 0) continue;
                        addBlock(x, 0, z, ITEMS[0]);
                        addBlock(x, -1, z, ITEMS[1]);
                        addBlock(x, -2, z, ITEMS[2]);
                    }
                }
                spawnTree(-2, 1, -2);
            } else {
                const ox = rand() * 100, oz = rand() * 100;
                for (let x = -18; x <= 18; x++) {
                    for (let z = -18; z <= 18; z++) {
                        const h = Math.floor(Math.sin((x + ox) * 0.18) * Math.cos((z + oz) * 0.18) * 3 + Math.sin((x - oz) * 0.3) * 1.2);
                        if (h <= -2) {
                            addBlock(x, -2, z, ITEMS[8]); // 水面（氷テクスチャ代用）
                            addBlock(x, -3, z, ITEMS[4]); // 砂底
                        } else {
                            addBlock(x, h, z, ITEMS[0]);
                            addBlock(x, h - 1, z, ITEMS[1]);
                            addBlock(x, h - 2, z, ITEMS[2]);
                            addBlock(x, h - 3, z, rand() < 0.12 ? ITEMS[21] : ITEMS[2]);
                            if (Math.abs(x) > 3 && Math.abs(z) > 3 && rand() < 0.025) spawnTree(x, h + 1, z);
                        }
                    }
                }
            }
            spawnInitialMobs();
        }

        function spawnTree(x, y, z) {
            for (let ty = 0; ty < 4; ty++) addBlock(x, y + ty, z, ITEMS[10]);
            for (let lx = -2; lx <= 2; lx++) {
                for (let lz = -2; lz <= 2; lz++) {
                    for (let ly = 3; ly <= 4; ly++) {
                        if (Math.abs(lx) + Math.abs(lz) < 4) addBlock(x + lx, y + ly, z + lz, ITEMS[14]);
                    }
                }
            }
        }

        function createAndStartWorld() {

            const seedIn = document.getElementById('new-world-seed').value.trim();
            const seed = seedIn ? parseInt(seedIn) || seedIn.split('').reduce((a, c) => a + c.charCodeAt(0), 0) : Math.floor(Math.random() * 999999);

            const id = 'w_' + Date.now();
            const meta = { id, name, mode, type, seed, updatedAt: new Date().toLocaleDateString() };
            const worlds = getSavedWorlds();
            worlds.unshift(meta);
            localStorage.setItem('mc_web_worlds', JSON.stringify(worlds));

            currentWorldId = id; currentWorldMeta = meta; gameMode = mode;
            buildTerrain(type, seed);
            setupPlayerStart();
            saveWorldData();
            enterGameUI();
        }

        function loadWorld(id) {
            const meta = getSavedWorlds().find(w => w.id === id);
            if (!meta) return;
            currentWorldId = id; currentWorldMeta = meta; gameMode = meta.mode;

            clearWorld();
            const raw = localStorage.getItem('mc_web_data_' + id);
            if (raw) {
                const data = JSON.parse(raw);
                data.blocks.forEach(b => addBlock(b.x, b.y, b.z, ITEMS.find(i => i.id === b.id) || ITEMS[0]));
                if (data.hotbar) hotbar = data.hotbar.map(s => ({ item: ITEMS.find(i => i.id === s.id) || ITEMS[0], count: s.count }));
            } else {
                buildTerrain(meta.type, meta.seed);
            }
            spawnInitialMobs();
            setupPlayerStart();
            enterGameUI();
        }

        function saveWorldData() {
            if (!currentWorldId) return;
            const blocks = [];
            worldBlocks.forEach(m => blocks.push({ x: m.userData.pos.x, y: m.userData.pos.y, z: m.userData.pos.z, id: m.userData.item.id }));
            localStorage.setItem('mc_web_data_' + currentWorldId, JSON.stringify({ blocks, hotbar: hotbar.map(s => ({ id: s.item.id, count: s.count })) }));
            const worlds = getSavedWorlds();
            const w = worlds.find(item => item.id === currentWorldId);
            if (w) {
                w.mode = gameMode;
                w.updatedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                localStorage.setItem('mc_web_worlds', JSON.stringify(worlds));
            }
        }

        // --- 6. モブ（ブタ・ゾンビ・クリーパー） ---
        const mobs = [];
        class Mob {
            constructor(type, x, y, z) {
                this.type = type; // 'pig', 'zombie', 'creeper'
                this.hp = type === 'pig' ? 6 : 12;
                const group = new THREE.Group();

                if (type === 'pig') {
                    const mat = new THREE.MeshLambertMaterial({ color: 0xf48fb1 });
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), mat); body.position.y = 0.5;
                    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat); head.position.set(0, 0.85, 0.7);
                    group.add(body, head);
                } else if (type === 'creeper') {
                    const mat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.1, 0.4), mat); body.position.y = 0.75;
                    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat); head.position.set(0, 1.6, 0);
                    group.add(body, head);
                } else {
                    // ゾンビ（緑の顔＋青い服）
                    const skin = new THREE.MeshLambertMaterial({ color: 0x4b7a38 });
                    const shirt = new THREE.MeshLambertMaterial({ color: 0x009688 });
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.4), shirt); body.position.y = 0.85;
                    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), skin); head.position.set(0, 1.7, 0);
                    group.add(body, head);
                }

                group.position.set(x, y, z);
                group.traverse(o => { o.userData.mob = this; });
                scene.add(group);
                this.mesh = group;
                this.velocity = new THREE.Vector3();
                this.timer = 0; this.cooldown = 0;
            }
            update(delta, playerPos) {
                this.timer += delta;
                if (this.cooldown > 0) this.cooldown -= delta;
                if (this.type === 'pig') {
                    if (this.timer > 3) {
                        this.timer = 0;
                        this.velocity.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2).normalize().multiplyScalar(1.4);
                    }
                } else {
                    const dir = new THREE.Vector3().subVectors(playerPos, this.mesh.position);
                    dir.y = 0;
                    const dist = dir.length();
                    if (dist < 16 && dist > 1.3) {
                        this.velocity.copy(dir.normalize().multiplyScalar(2.3));
                    } else {
                        this.velocity.set(0, 0, 0);
                        if (dist <= 1.4 && gameMode === 'survival' && this.cooldown <= 0) {
                            this.cooldown = 1.2;
                            damagePlayer(1);
                        }
                    }
                }
                this.mesh.position.x += this.velocity.x * delta;
                this.mesh.position.z += this.velocity.z * delta;
                if (this.velocity.length() > 0.1) this.mesh.rotation.y = Math.atan2(this.velocity.x, this.velocity.z);
            }
            takeDamage(dmg) {
                this.hp -= dmg;
                playSound('hit');
                this.mesh.position.y += 0.4;
                if (this.hp <= 0) {
                    scene.remove(this.mesh);
                    const i = mobs.indexOf(this);
                    if (i > -1) mobs.splice(i, 1);
                    if (gameMode === 'survival') addItemToInventory(ITEMS[39]);
                }
            }
        }

        function spawnInitialMobs() {
            for (let i = 0; i < 3; i++) {
                mobs.push(new Mob('pig', (Math.random() - 0.5) * 16, 4, (Math.random() - 0.5) * 16));
                mobs.push(new Mob('zombie', (Math.random() - 0.5) * 18, 4, (Math.random() - 0.5) * 18));
                mobs.push(new Mob('creeper', (Math.random() - 0.5) * 18, 4, (Math.random() - 0.5) * 18));
            }
        }

        function damagePlayer(dmg) {
            health = Math.max(0, health - dmg);
            playSound('hit');
            const f = document.getElementById('damage-flash');
            f.style.display = 'block'; setTimeout(() => f.style.display = 'none', 140);
            updateUI();
            if (health <= 0) {
                alert('あなたは死んでしまった！');
                health = 10; hunger = 10;
                camera.position.set(0, 10, 0);
                updateUI();
            }
        }

        // --- 7. PC & スマホ・タブレット操作系 ---
        let velocity = new THREE.Vector3();
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let canJump = false, isFlying = false, lastJumpTap = 0;
        let pitch = 0, yaw = 0;
        let isBreaking = false, miningProgress = 0;
        let hotbar = Array(8).fill(0).map((_, i) => ({ item: ITEMS[i], count: 64 }));
        let selectedSlot = 0;

        // 十字キー（タッチ・マウス両対応）
        function bindDpad(id, setter) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); setter(true); });
            el.addEventListener('touchend', e => { e.preventDefault(); setter(false); });
            el.addEventListener('mousedown', () => setter(true));
            el.addEventListener('mouseup', () => setter(false));
        }
        bindDpad('dp-up', v => moveF = v);
        bindDpad('dp-down', v => moveB = v);
        bindDpad('dp-left', v => moveL = v);
        bindDpad('dp-right', v => moveR = v);

        // PCマウス視点
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === document.body && !isModalOpen && isPlaying) {
                yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
                updateCameraRot();
            }
        });

        // スマホ・タブレットスワイプ視点
        let lookId = null, lastX = 0, lastY = 0;
        renderer.domElement.addEventListener('touchstart', e => {
            if (!isPlaying || isModalOpen) return;
            for (let t of e.changedTouches) {
                if (lookId === null) { lookId = t.identifier; lastX = t.clientX; lastY = t.clientY; }
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchmove', e => {
            if (!isPlaying || isModalOpen) return;
            e.preventDefault();
            for (let t of e.changedTouches) {
                if (t.identifier === lookId) {
                    yaw -= (t.clientX - lastX) * 0.005;
                    pitch -= (t.clientY - lastY) * 0.005;
                    updateCameraRot();
                    lastX = t.clientX; lastY = t.clientY;
                }
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchend', e => {
            for (let t of e.changedTouches) if (t.identifier === lookId) lookId = null;
        });

        function updateCameraRot() {
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;
        }

        // ジャンプ・破壊・配置ボタン
        const btnJump = document.getElementById('btn-jump');
        const btnFlyDown = document.getElementById('btn-fly-down');
        function triggerJump() {
            const now = performance.now();
            if (gameMode === 'creative' && now - lastJumpTap < 300) {
                isFlying = !isFlying; velocity.y = 0;
                btnFlyDown.style.display = isFlying ? 'flex' : 'none';
            } else if (isFlying) velocity.y = 6;
            else if (canJump) { velocity.y = 7.5; canJump = false; }
            lastJumpTap = now;
        }
        btnJump.addEventListener('touchstart', e => { e.preventDefault(); triggerJump(); });
        btnJump.addEventListener('touchend', () => { if (isFlying) velocity.y = 0; });
        btnFlyDown.addEventListener('touchstart', e => { e.preventDefault(); if (isFlying) velocity.y = -6; });
        btnFlyDown.addEventListener('touchend', () => { if (isFlying) velocity.y = 0; });

        document.getElementById('btn-break').addEventListener('touchstart', e => { e.preventDefault(); startAttackOrMine(); });
        document.getElementById('btn-break').addEventListener('touchend', () => stopMine());
        document.getElementById('btn-place').addEventListener('touchstart', e => { e.preventDefault(); handlePlaceAction(); });

        // PCキーボード
        document.addEventListener('keydown', e => {
            if (!isPlaying) return;
            if (e.code === 'KeyE') { toggleModal('inventory-modal'); return; }
            if (e.code === 'KeyC') { toggleModal('crafting-modal'); return; }
            if (isModalOpen) return;
            if (e.code === 'KeyW') moveF = true;
            if (e.code === 'KeyS') moveB = true;
            if (e.code === 'KeyA') moveL = true;
            if (e.code === 'KeyD') moveR = true;
            if (e.code === 'Space') triggerJump();
            if (e.code === 'ShiftLeft' && isFlying) velocity.y = -6;
            if (e.key >= '1' && e.key <= '8') { selectedSlot = parseInt(e.key) - 1; showItemToast(); updateUI(); }
        });
        document.addEventListener('keyup', e => {
            if (e.code === 'KeyW') moveF = false;
            if (e.code === 'KeyS') moveB = false;
            if (e.code === 'KeyA') moveL = false;
            if (e.code === 'KeyD') moveR = false;
            if ((e.code === 'Space' || e.code === 'ShiftLeft') && isFlying) velocity.y = 0;
        });

        renderer.domElement.addEventListener('mousedown', e => {
            if (!isPlaying || isModalOpen) return;
            if (document.pointerLockElement !== document.body && !('ontouchstart' in window)) {
                document.body.requestPointerLock?.(); return;
            }
            if (e.button === 0) startAttackOrMine();
            else if (e.button === 2) handlePlaceAction();
        });
        document.addEventListener('mouseup', e => { if (e.button === 0) stopMine(); });
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- 8. 攻撃・採掘・配置 ---
        const raycaster = new THREE.Raycaster();
        raycaster.far = 6;

        function startAttackOrMine() {
            armSwing = 1.0; // 右腕を振るアニメーション開始
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const mobHits = raycaster.intersectObjects(mobs.map(m => m.mesh), true);
            if (mobHits.length > 0 && mobHits[0].object.userData.mob) {
                mobHits[0].object.userData.mob.takeDamage(hotbar[selectedSlot].item.damage || 2);
                return;
            }
            isBreaking = true; miningProgress = 0;
        }

        function stopMine() {
            isBreaking = false; miningProgress = 0; crackOverlay.visible = false;
        }

        function getTargetBlock() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(Array.from(worldBlocks.values()));
            return hits.length > 0 ? hits[0] : null;
        }

        function handlePlaceAction() {
            armSwing = 1.0;
            const slot = hotbar[selectedSlot];
            if (!slot || (gameMode === 'survival' && slot.count <= 0)) return;

            if (slot.item.type === 'food') {
                if (gameMode === 'survival' && health < 10) {
                    health = Math.min(10, health + slot.item.heal);
                    hunger = Math.min(10, hunger + 4);
                    slot.count--; playSound('place'); updateUI();
                }
                return;
            }
            if (slot.item.type !== 'block') return;
            const hit = getTargetBlock();
            if (!hit) return;

            const pos = hit.object.position.clone().add(hit.face.normal);
            addBlock(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z), slot.item);
            playSound('place');

            if (slot.item.isTnt) {
                const tPos = pos.clone();
                setTimeout(() => {
                    playSound('explosion');
                    for (let x = -2; x <= 2; x++) for (let y = -2; y <= 2; y++) for (let z = -2; z <= 2; z++)
                        removeBlock(Math.round(tPos.x + x), Math.round(tPos.y + y), Math.round(tPos.z + z));
                }, 2000);
            }
            if (gameMode === 'survival') { slot.count--; updateUI(); }
        }

        function addItemToInventory(item) {
            for (let s of hotbar) if (s.item.id === item.id && s.count > 0 && s.count < 64) { s.count++; updateUI(); return; }
            for (let i = 0; i < hotbar.length; i++) if (hotbar[i].count <= 0) { hotbar[i] = { item, count: 1 }; updateUI(); return; }
        }

        function toggleGameMode() {
            gameMode = gameMode === 'creative' ? 'survival' : 'creative';
            if (gameMode === 'survival') { isFlying = false; btnFlyDown.style.display = 'none'; }
            updateModeUI(); updateUI();
        }

        function updateModeUI() {
            document.getElementById('mode-label').textContent = gameMode === 'creative' ? 'クリエイティブ' : 'サバイバル';
            document.getElementById('status-bars').style.display = gameMode === 'survival' ? 'flex' : 'none';
        }

        let toastTimer = null;
        function showItemToast() {
            const cur = hotbar[selectedSlot];
            const el = document.getElementById('item-toast');
            el.textContent = (gameMode === 'creative' || cur.count > 0) ? cur.item.name : '';
            el.style.opacity = 1;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.style.opacity = 0, 1500);
        }

        // --- 9. UI & インベントリ構築 ---
        function toggleModal(id) {
            const m = document.getElementById(id);
            const open = m.style.display !== 'block';
            document.querySelectorAll('.modal').forEach(el => el.style.display = 'none');
            m.style.display = open ? 'block' : 'none';
            isModalOpen = open;
            if (open && document.pointerLockElement) document.exitPointerLock();
        }

        function updateUI() {
            const hb = document.getElementById('hotbar');
            hb.innerHTML = '';
            hotbar.forEach((slot, idx) => {
                const div = document.createElement('div');
                div.className = 'slot' + (idx === selectedSlot ? ' active' : '');
                const has = gameMode === 'creative' || slot.count > 0;
                div.innerHTML = `
                    <img class="slot-icon" src="${itemIconUrls.get(slot.item.id)}" style="opacity:${has ? 1 : 0}">
                    <div class="slot-count">${gameMode === 'creative' ? '' : (slot.count > 1 ? slot.count : '')}</div>
                `;
                div.onclick = () => { selectedSlot = idx; showItemToast(); updateUI(); };
                hb.appendChild(div);
            });
            // 原作の「...」インベントリボタン
            const moreBtn = document.createElement('div');
            moreBtn.className = 'slot-more';
            moreBtn.textContent = '•••';
            moreBtn.onclick = () => toggleModal('inventory-modal');
            hb.appendChild(moreBtn);

            document.getElementById('health-bar').textContent = '❤️'.repeat(health) + '🖤'.repeat(10 - health);
            document.getElementById('hunger-bar').textContent = '🍖'.repeat(hunger) + '🦴'.repeat(10 - hunger);
        }

        function initModals() {
            const grid = document.getElementById('inventory-grid');
            ITEMS.forEach(item => {
                const cell = document.createElement('div');
                cell.className = 'inv-cell';
                cell.innerHTML = `<img class="slot-icon" src="${itemIconUrls.get(item.id)}"><span style="font-size:8px; color:#fff; text-shadow:1px 1px 0 #000; text-align:center;">${item.name}</span>`;
                cell.onclick = () => { hotbar[selectedSlot] = { item, count: 64 }; showItemToast(); updateUI(); toggleModal('inventory-modal'); };
                grid.appendChild(cell);
            });

            const craft = document.getElementById('crafting-list');
            RECIPES.forEach(r => {
                const btn = document.createElement('button');
                btn.className = 'mc-btn'; btn.style.fontSize = '13px';
                btn.textContent = r.name;
                btn.onclick = () => {
                    const s = hotbar[selectedSlot];
                    if (gameMode === 'survival' && (s.item.id !== r.req.item.id || s.count < r.req.count)) {
                        alert('選択中のホットバー枠に必要素材がありません！'); return;
                    }
                    if (gameMode === 'survival') s.count -= r.req.count;
                    hotbar[selectedSlot] = { item: r.result, count: r.count };
                    updateUI(); alert(`${r.result.name} をクラフトしました！`);
                };
                craft.appendChild(btn);
            });
        }

        // --- 10. メインループ（オートジャンプ・黒い選択枠・ヒビ割れ・腕振り） ---
        buildTerrain('normal', 2026);
        camera.position.set(0, 7, 14);

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!isPlaying) {
                const angle = time * 0.00012;
                camera.position.x = Math.sin(angle) * 16;
                camera.position.z = Math.cos(angle) * 16;
                camera.lookAt(0, 2, 0);
                renderer.render(scene, camera);
                return;
            }

            if (!isModalOpen) {
                // 昼夜サイクル
                worldTime = (worldTime + delta) % 150;
                const isNight = worldTime > 90;
                scene.background.lerp(isNight ? new THREE.Color(0x0b1021) : new THREE.Color(0x78a7ff), 0.02);
                scene.fog.color.copy(scene.background);
                ambientLight.intensity = isNight ? 0.35 : 0.75;

                // 移動＆原作準拠オートジャンプ
                const speed = isFlying ? 10.0 : 5.2;
                const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

                const inF = (moveF ? 1 : 0) - (moveB ? 1 : 0);
                const inR = (moveR ? 1 : 0) - (moveL ? 1 : 0);
                velocity.x = (fwd.x * inF + rgt.x * inR) * speed;
                velocity.z = (fwd.z * inF + rgt.z * inR) * speed;

                if (!isFlying) velocity.y -= 22.0 * delta;

                // X軸移動＋オートジャンプ判定
                camera.position.x += velocity.x * delta;
                if (checkCollision(camera.position)) {
                    camera.position.y += 1.05; // 1段上を試す
                    if (!isFlying && canJump && !checkCollision(camera.position)) {
                        velocity.y = 5.5; canJump = false;
                    } else {
                        camera.position.y -= 1.05;
                        camera.position.x -= velocity.x * delta;
                    }
                }

                // Z軸移動＋オートジャンプ判定
                camera.position.z += velocity.z * delta;
                if (checkCollision(camera.position)) {
                    camera.position.y += 1.05;
                    if (!isFlying && canJump && !checkCollision(camera.position)) {
                        velocity.y = 5.5; canJump = false;
                    } else {
                        camera.position.y -= 1.05;
                        camera.position.z -= velocity.z * delta;
                    }
                }

                camera.position.y += velocity.y * delta;
                if (checkCollision(camera.position)) {
                    if (velocity.y < 0) canJump = true;
                    camera.position.y -= velocity.y * delta;
                    velocity.y = 0;
                }

                if (camera.position.y < -15) { camera.position.set(0, 12, 0); velocity.set(0, 0, 0); }

                // 座標HUD更新
                document.getElementById('coords-box').textContent =
                    `位置: ${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`;

                // 歩行時の右腕の揺れ＆採掘時の腕振りアニメーション
                const isMoving = Math.hypot(velocity.x, velocity.z) > 0.2;
                if (armSwing > 0 || isBreaking) {
                    armSwing = Math.max(0, armSwing - delta * 4);
                    const swingAngle = Math.sin((isBreaking ? time * 0.02 : armSwing * Math.PI)) * 0.7;
                    armMesh.rotation.x = 0.2 - swingAngle;
                } else if (isMoving) {
                    armMesh.position.y = -0.38 + Math.sin(time * 0.012) * 0.03;
                    armMesh.rotation.x = 0.2;
                }

                // 視線先のブロックに黒い選択枠を表示
                const targetHit = getTargetBlock();
                if (targetHit) {
                    highlightBox.visible = true;
                    highlightBox.position.copy(targetHit.object.position);
                } else {
                    highlightBox.visible = false;
                }

                // 採掘処理＆ヒビ割れ表示
                if (isBreaking && targetHit) {
                    const pos = targetHit.object.userData.pos;
                    const blockItem = targetHit.object.userData.item;
                    if (gameMode === 'creative') {
                        removeBlock(pos.x, pos.y, pos.z);
                        isBreaking = false;
                    } else {
                        const reqTime = (blockItem.hardness || 1.0) / (hotbar[selectedSlot].item.miningSpeed || 1.0);
                        miningProgress += delta;
                        const ratio = Math.min(miningProgress / reqTime, 0.99);
                        crackOverlay.visible = true;
                        crackOverlay.position.copy(targetHit.object.position);
                        crackOverlay.material = crackMaterials[Math.floor(ratio * crackMaterials.length)];

                        if (miningProgress >= reqTime) {
                            const dropped = removeBlock(pos.x, pos.y, pos.z);
                            if (dropped) addItemToInventory(dropped);
                            miningProgress = 0;
                            crackOverlay.visible = false;
                        }
                    }
                } else {
                    crackOverlay.visible = false;
                }

                mobs.forEach(m => m.update(delta, camera.position));
            }
            renderer.render(scene, camera);
        }

        function checkCollision(pos) {
            const minX = Math.floor(pos.x - 0.3), maxX = Math.floor(pos.x + 0.3);
            const minY = Math.floor(pos.y - 1.5), maxY = Math.floor(pos.y + 0.2);
            const minZ = Math.floor(pos.z - 0.3), maxZ = Math.floor(pos.z + 0.3);
            for (let x = minX; x <= maxX; x++)
                for (let y = minY; y <= maxY; y++)
                    for (let z = minZ; z <= maxZ; z++)
                        if (worldBlocks.has(`${x},${y},${z}`)) return true;
            return false;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initModals();
        animate();
    </script>
</body>
</html>
