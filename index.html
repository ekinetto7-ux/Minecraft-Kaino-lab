<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coker’s Professional POS System</title>
    <style>
        :root {
            --bg-dark: #1e293b;
            --primary: #0284c7;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --surface: #ffffff;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: #f1f5f9; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .pos-layout { width: 100%; max-width: 900px; height: 600px; background: var(--surface); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: grid; grid-template-columns: 1fr 360px; overflow: hidden; }
        @media (max-width: 768px) { .pos-layout { grid-template-columns: 1fr; height: auto; max-width: 450px; } }

        /* 左側：操作パネル */
        .panel-left { padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid var(--border); overflow-y: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .header-bar h1 { margin: 0; font-size: 1.1rem; color: var(--bg-dark); }
        .terminal-id { font-size: 0.75rem; background: #e2e8f0; padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        .section-title { font-size: 0.75rem; font-weight: bold; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        
        .grid-products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-item { padding: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; text-align: left; transition: 0.1s; font-weight: bold; }
        .btn-item:hover { background: #e0f2fe; border-color: var(--primary); }
        .btn-item .price { display: block; font-size: 0.85rem; color: #64748b; font-weight: normal; margin-top: 4px; }

        .grid-discounts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-disc { padding: 10px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; cursor: pointer; font-weight: bold; color: var(--warning); text-align: left; }
        .btn-disc:hover { background: #fef3c7; }

        /* 右側：レシート・カートパネル */
        .panel-right { background: #f8fafc; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .cart-box { background: white; border: 1px solid var(--border); border-radius: 6px; flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 15px; }
        .cart-header { background: #e2e8f0; padding: 8px 12px; font-size: 0.8rem; font-weight: bold; display: flex; justify-content: space-between; }
        .cart-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; max-height: 180px; }
        .cart-row { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; font-size: 0.85rem; align-items: center; }
        .cart-row button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem; }

        .summary-box { background: var(--bg-dark); color: white; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; color: #94a3b8; }
        .summary-total { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; color: #fff; }

        .pay-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .btn-pay { padding: 12px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; font-size: 0.9rem; text-align: center; }
        .btn-mana { background: #7c3aed; }
        .btn-cash { background: var(--success); }
        .btn-clear { width: 100%; padding: 8px; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; color: #475569; }
        .btn-clear:hover { background: var(--danger); color: white; }

        /* 現金お預かりモーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 320px; text-align: center; }
        .modal-content input { width: 100%; padding: 10px; font-size: 1.2rem; text-align: right; margin: 15px 0; border: 1px solid var(--border); border-radius: 4px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="pos-layout">
    <!-- 左側：商品・割引 -->
    <div class="panel-left">
        <div class="header-bar">
            <h1>Coker’s POS</h1>
            <div class="terminal-id">POS #01</div>
        </div>

        <div>
            <div class="section-title">商品登録</div>
            <div class="grid-products">
                <button class="btn-item" onclick="addItem('食品 (大)', 220)">
                    食品 (大)
                    <span class="price">¥220</span>
                </button>
                <button class="btn-item" onclick="addItem('食品 (小)', 110)">
                    食品 (小)
                    <span class="price">¥110</span>
                </button>
            </div>
        </div>

        <div>
            <div class="section-title">割引・調整</div>
            <div class="grid-discounts">
                <button class="btn-disc" onclick="addDiscount('無料', -1000)">無料よ (全額OFF)</button>
                <button class="btn-disc" onclick="addDiscount('100円引き', 100)">100円引き (-¥100)</button>
            </div>
        </div>
    </div>

    <!-- 右側：カート・会計 -->
    <div class="panel-right">
        <div>
            <div class="section-title">お会計明細</div>
            <div class="cart-box">
                <div class="cart-header">
                    <span>商品名 / 割引</span>
                    <span>小計</span>
                </div>
                <ul id="cart-list" class="cart-list">
                    <li style="color:#94a3b8; text-align:center; padding:30px 0; font-size:0.85rem;">カートは空です</li>
                </ul>
            </div>
        </div>

        <div>
            <div class="summary-box">
                <div class="summary-row">
                    <span>アイテム点数</span>
                    <span id="item-count">0 点</span>
                </div>
                <div class="summary-total">
                    <span>合計金額</span>
                    <span>¥<span id="total-price">0</span></span>
                </div>
            </div>

            <div class="pay-actions">
                <button class="btn-pay btn-mana" onclick="checkoutMana()">Manaカード</button>
                <button class="btn-pay btn-cash" onclick="openCashModal()">現金決済</button>
            </div>
            <button class="btn-clear" onclick="resetCart()">取引キャンセル (リセット)</button>
        </div>
    </div>
</div>

<!-- 現金お預かりモーダル -->
<div id="cash-modal" class="modal">
    <div class="modal-content">
        <h3>現金のお預かり</h3>
        <p>合計金額: ¥<span id="modal-total">0</span></p>
        <input type="number" id="received-amount" placeholder="お預かり金額を入力">
        <div class="modal-btns">
            <button style="background:#e2e8f0;" onclick="closeCashModal()">戻る</button>
            <button style="background:var(--success); color:white;" onclick="processCashCheckout()">お会計確定</button>
        </div>
    </div>
</div>

<script>
    let cart = [];
    let total = 0;

    function addItem(name, price) {
        cart.push({ name: name, price: price });
        updateCart();
    }

    function addDiscount(name, discountValue) {
        if (name === '無料よ') {
            cart.push({ name: '【割引】無料よ', price: -total });
        } else {
            cart.push({ name: '【割引】' + name, price: -discountValue });
        }
        updateCart();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        updateCart();
    }

    function updateCart() {
        const listEl = document.getElementById('cart-list');
        listEl.innerHTML = '';
        total = 0;

        if (cart.length === 0) {
            listEl.innerHTML = '<li style="color:#94a3b8; text-align:center; padding:30px 0; font-size:0.85rem;">カートは空です</li>';
        } else {
            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement('li');
                li.className = 'cart-row';
                li.innerHTML = `<span>${item.name}</span><span>¥${item.price} <button onclick="removeItem(${index})">✕</button></span>`;
                listEl.appendChild(li);
            });
        }

        if (total < 0) total = 0;
        document.getElementById('total-price').innerText = total;
        document.getElementById('item-count').innerText = cart.length + ' 点';
    }

    function checkoutMana() {
        if (cart.length === 0) {
            alert('商品が選択されていません。');
            return;
        }
        alert(`【Manaカード決済】\n合計 ¥${total} の決済が完了しました。\nご利用ありがとうございました！`);
        resetCart();
    }

    function openCashModal() {
        if (cart.length === 0) {
            alert('商品が選択されていません。');
            return;
        }
        document.getElementById('modal-total').innerText = total;
        document.getElementById('received-amount').value = '';
        document.getElementById('cash-modal').style.display = 'flex';
        document.getElementById('received-amount').focus();
    }

    function closeCashModal() {
        document.getElementById('cash-modal').style.display = 'none';
    }

    function processCashCheckout() {
        const received = parseInt(document.getElementById('received-amount').value);
        if (isNaN(received) || received < total) {
            alert('お預かり金額が不足しているか、正しく入力されていません。');
            return;
        }
        const change = received - total;
        alert(`【現金決済】\nお預かり: ¥${received}\nお釣り: ¥${change}\n\nお会計が完了しました。ありがとうございました！`);
        closeCashModal();
        resetCart();
    }

    function resetCart() {
        cart = [];
        updateCart();
    }
</script>

</body>
</html>
