<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL - v11.1 FIXED ULTIMATE EDITION</title>
    <style>
        :root {
            --bg-color: #010409;
            --frame-bg: #030712;
            --header-bg: #070d1d;
            --accent-cyan: #00ffcc;
            --accent-pink: #ff007f;
            --accent-blue: #00aaff;
            --accent-yellow: #ffcc00;
            --border-glow: rgba(0, 255, 204, 0.35);
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-cyan);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #window-frame {
            width: 100%;
            max-width: 1000px;
            height: 92vh;
            background-color: var(--frame-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.12), inset 0 0 20px rgba(0, 255, 204, 0.03);
        }

        .window-header {
            background-color: var(--header-bg);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
        }

        .window-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .window-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
        }
        .btn-red { background-color: #ff5f56; }
        .btn-yellow { background-color: #ffbd2e; }
        .btn-green { background-color: #27c93f; }

        .window-title {
            font-size: 13px;
            color: #8b9bb4;
            letter-spacing: 1.2px;
        }

        .header-status {
            font-size: 11px;
            color: var(--accent-cyan);
            background: #022019;
            padding: 5px 12px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 5px;
            font-weight: bold;
            letter-spacing: 1.5px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.25);
            transition: all 0.3s ease;
        }

        #terminal {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.65;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        /* カスタムスクロールバー */
        #terminal::-webkit-scrollbar {
            width: 6px;
        }
        #terminal::-webkit-scrollbar-track {
            background: #030712;
        }
        #terminal::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 204, 0.3);
            border-radius: 3px;
        }
        #terminal::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 204, 0.6);
        }

        #command-form {
            display: flex;
            align-items: center;
            font-size: 15px;
            padding: 14px 20px;
            background-color: #02050f;
            border-top: 1px solid rgba(0, 255, 204, 0.2);
        }

        .prompt {
            color: var(--accent-pink);
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
            text-shadow: 0 0 6px rgba(255, 0, 127, 0.6);
        }

        #command-input {
            background: transparent;
            border: none;
            color: var(--accent-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            width: 100%;
            text-shadow: 0 0 4px rgba(0, 255, 204, 0.4);
        }

        .hidden-input {
            color: transparent !important;
            text-shadow: 0 0 10px rgba(0,255,204,0.6);
        }

        .warning { color: #ff3366; font-weight: bold; text-shadow: 0 0 6px rgba(255, 51, 102, 0.5); }
        .success { color: var(--accent-cyan); text-shadow: 0 0 6px rgba(0, 255, 204, 0.5); }
        .system { color: #ffaa00; text-shadow: 0 0 6px rgba(255, 170, 0, 0.5); }
        .dev { color: var(--accent-blue); text-shadow: 0 0 6px rgba(0, 170, 255, 0.5); }
        .police { color: var(--accent-yellow); font-weight: bold; text-shadow: 0 0 10px rgba(255, 204, 0, 0.7); }
        .matrix { color: #00ff00; text-shadow: 0 0 6px rgba(0, 255, 0, 0.5); }
        .secret { color: var(--accent-pink); font-weight: bold; text-shadow: 0 0 6px rgba(255, 0, 255, 0.5); }
        .dim { color: #1a3830; }
    </style>
</head>
<body>

    <div id="window-frame">
        <div class="window-header">
            <div class="window-left">
                <div class="window-buttons">
                    <div class="btn btn-red"></div>
                    <div class="btn btn-yellow"></div>
                    <div class="btn btn-green"></div>
                </div>
                <div class="window-title" id="shell-title">root@cyber-shell:~</div>
            </div>
            <div class="header-status" id="sec-badge">SYSTEM: SECURE</div>
        </div>

        <div id="terminal">
            <span class="system">=======================================================</span>
            <span class="system">  CYBER TERMINAL v11.1 [FIXED ULTIMATE EDITION]</span>
            <span class="system">=======================================================</span>
            Type <span class="success">jp</span> for command list, or <span class="success">lok</span> to lock system (Password: ***).
        </div>

        <form id="command-form">
            <span class="prompt" id="prompt-label">root@cyber:~#</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </form>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        const form = document.getElementById('command-form');
        const promptLabel = document.getElementById('prompt-label');
        const secBadge = document.getElementById('sec-badge');
        const shellTitle = document.getElementById('shell-title');
        
        let autoStreamInterval = null;
        let isProcessing = false;
        let isLocked = false;
        let isDevMode = false;
        const devVariables = {};

        document.addEventListener('click', () => { 
            if (!isProcessing) input.focus(); 
        });

        window.onload = () => { 
            input.focus(); 
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isProcessing) return;

            const rawText = input.value;
            const text = rawText.trim();
            if (text === '') return;
            
            input.value = '';

            // ロック中のパスワード判定 (911)
            if (isLocked) {
                appendOutput(`PASSCODE: *********`);
                if (text === '911') {
                    isLocked = false;
                    promptLabel.textContent = isDevMode ? "DEV-MODE> " : "root@cyber:~#";
                    promptLabel.style.color = isDevMode ? "#00aaff" : "#ff007f";
                    input.classList.remove('hidden-input');
                    secBadge.textContent = isDevMode ? "MODE: MANUAL DEV" : "SYSTEM: SECURE";
                    secBadge.style.color = "#00ffcc";
                    secBadge.style.borderColor = "rgba(0, 255, 204, 0.4)";
                    secBadge.style.background = "#022019";
                    appendOutput("[OK] ACCESS GRANTED. SYSTEM UNLOCKED.", "success");
                } else {
                    appendOutput("[X] ACCESS DENIED. WRONG PASSWORD.", "warning");
                }
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            // 手動コード実行モード（DEV MODE）の処理
            if (isDevMode) {
                appendOutput(`DEV-MODE> ${rawText}`);
                processDevCommand(text);
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            // 通常モード時の自動ログ停止
            if (text.toLowerCase() !== 'aut' && text.toLowerCase() !== 'stp') {
                stopAutoStream();
            }

            appendOutput(`root@cyber:~# ${rawText}`);
            processCommand(text.toLowerCase());
            terminal.scrollTop = terminal.scrollHeight;
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function runSimulatedTask(title, successMsg, callback) {
            isProcessing = true;
            input.disabled = true;

            appendOutput(`[*] ${title}...`, "system");
            let progress = 0;
            
            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 25) + 15;
                if (progress >= 100) progress = 100;
                
                const bars = '█'.repeat(Math.floor(progress / 10)) + '░'.repeat(10 - Math.floor(progress / 10));
                terminal.lastChild.textContent = `[*] ${title}... [${bars}] ${progress}%`;

                if (progress === 100) {
                    clearInterval(timer);
                    appendOutput(`[OK] ${successMsg}`, "success");
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                    if (callback) callback();
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }, 80);
        }

        // 手動モード起動アニメーション演出
        function startDevModeAnimation() {
            isProcessing = true;
            input.disabled = true;

            const logs = [
                "[*] INITIALIZING MANUAL DEV ENVIRONMENT...",
                "[*] LOADING VIRTUAL JAVASCRIPT ENGINE v2.4...",
                "[*] ALLOCATING ISOLATED MEMORY HEAP (256MB)...",
                "[*] ATTACHING INTERPRETATIVE REPL SHELL...",
                "[OK] DEV ENVIRONMENT READY."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], index === logs.length - 1 ? "success" : "dev");
                    index++;
                } else {
                    clearInterval(timer);
                    isDevMode = true;
                    promptLabel.textContent = "DEV-MODE> ";
                    promptLabel.style.color = "#00aaff";
                    shellTitle.textContent = "developer@manual_interpreter:~";
                    secBadge.textContent = "MODE: MANUAL DEV";
                    secBadge.style.color = "#00aaff";
                    secBadge.style.borderColor = "rgba(0, 170, 255, 0.4)";
                    secBadge.style.background = "#021220";
                    
                    appendOutput("==================================================", "dev");
                    appendOutput("  【手動コード作成・実行モード（MANUAL DEV）】", "dev");
                    appendOutput("==================================================", "dev");
                    appendOutput("Type 'help' for dev commands, or 'exit' to quit.", "dev");

                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 180);
        }

        // 手動モード終了アニメーション演出
        function exitDevModeAnimation() {
            isProcessing = true;
            input.disabled = true;

            const logs = [
                "[*] CLOSING DEV INTERPRETER...",
                "[*] FLUSHING VIRTUAL HEAP MEMORY...",
                "[*] RESTORING DEFAULT CYBER SHELL..."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], "system");
                    index++;
                } else {
                    clearInterval(timer);
                    isDevMode = false;
                    promptLabel.textContent = "root@cyber:~#";
                    promptLabel.style.color = "#ff007f";
                    shellTitle.textContent = "root@cyber-shell:~";
                    secBadge.textContent = "SYSTEM: SECURE";
                    secBadge.style.color = "#00ffcc";
                    secBadge.style.borderColor = "rgba(0, 255, 204, 0.4)";
                    secBadge.style.background = "#022019";
                    appendOutput("[OK] RETURNED TO STANDARD SHELL.", "success");

                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 150);
        }

        function startAutoStream() {
            if (autoStreamInterval) return;
            appendOutput("[*] LIVE SECURITY STREAM ACTIVATED (Type 'stp' to stop)", "system");

            const streamLogs = [
                "KERNEL: Segment fault avoided at 0x7ffd4a",
                "NET: Inbound packet from 185.220.101.5 [TOR EXIT NODE]",
                "AUTH: Failed login attempt for user 'admin' from 10.0.4.15",
                "SYS: Memory usage stable at 14.2% [OK]",
                "SEC: Firewall block rule applied to port 22 (SSH)",
                "ENCR: AES-256 handshake established with proxy node"
            ];

            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                appendOutput(log, "dim");
            }, 300);
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

        // 手動コード実行エンジン (DEV MODE)
        function processDevCommand(line) {
            const parts = line.split(' ');
            const subCmd = parts[0].toLowerCase();
            const args = parts.slice(1).join(' ');

            if (subCmd === 'exit') {
                exitDevModeAnimation();
                return;
            }

            if (subCmd === 'help' || subCmd === 'hlp') {
                appendOutput("--- DEV ENGINE COMMANDS ---", "dev");
                appendOutput("calc <式>       : 数学計算の実行 (例: calc (50+30)*2)");
                appendOutput("var <名前> <値>  : 変数の登録 (例: var target 192.168.1.1)");
                appendOutput("echo <名前/$名> : 文字列や変数の出力 (例: echo $target)");
                appendOutput("date            : 現在の正確なシステム時刻を表示");
                appendOutput("vars            : 保存されている全変数を一覧表示");
                appendOutput("exit            : アニメーション付きで手動モードを終了");
                return;
            }

            if (subCmd === 'calc') {
                try {
                    const cleanMath = args.replace(/[^0-9+\-*/().]/g, '');
                    if (!cleanMath) {
                        appendOutput("[DEV ERROR] Invalid calculation expression.", "warning");
                        return;
                    }
                    const res = Function(`'use strict'; return (${cleanMath})`)();
                    appendOutput(`OUTPUT: ${res}`, "dev");
                } catch(e) {
                    appendOutput("[DEV ERROR] Calculation syntax error.", "warning");
                }
                return;
            }

            if (subCmd === 'var') {
                const name = parts[1];
                const val = parts.slice(2).join(' ');
                if (!name || !val) {
                    appendOutput("Usage: var <name> <value>", "warning");
                    return;
                }
                devVariables[name] = val;
                appendOutput(`[DEV] Variable '$${name}' set to '${val}'`, "dev");
                return;
            }

            if (subCmd === 'echo') {
                if (args.startsWith('$')) {
                    const varName = args.substring(1);
                    if (devVariables[varName] !== undefined) {
                        appendOutput(devVariables[varName], "dev");
                    } else {
                        appendOutput(`[DEV WARNING] Variable '$${varName}' is undefined.`, "warning");
                    }
                } else {
                    appendOutput(args, "dev");
                }
                return;
            }

            if (subCmd === 'vars') {
                appendOutput("--- STORED DEV VARIABLES ---", "dev");
                const keys = Object.keys(devVariables);
                if (keys.length === 0) {
                    appendOutput("(No variables saved yet)", "dim");
                } else {
                    keys.forEach(k => appendOutput(`$${k} = ${devVariables[k]}`, "dev"));
                }
                return;
            }

            if (subCmd === 'date') {
                appendOutput(`SYSTEM DATE: ${new Date().toLocaleString()}`, "dev");
                return;
            }

            appendOutput(`DevEngine: command not found: '${subCmd}'. Type 'help'.`, "warning");
        }

        function processCommand(cmd) {
            if (cmd === 'matrix_on') {
                appendOutput("[SECRET] OVERRIDING MAINFRAME MATRIX VISUALS...", "matrix");
                document.body.style.backgroundColor = "#001100";
                setTimeout(() => { document.body.style.backgroundColor = "#010409"; }, 2000);
                return;
            }

            // 2文字や3文字の有効コマンドの判定を修正（ai や ls などの短縮コマンドを確実に網羅）
            const validCommands = ['jp', 'jpl', 'hlp', 'aut', 'stp', 'man', 'pol', 'lok', 'geo', 'dec', 'dos', 'err', 'scn', 'gen', 'mtr', 'brk', 'sat', 'bck', 'ai', 'inf', 'pwd', 'ls', 'dir', 'dlc', 'who', 'cpu', 'cls', 'rst'];

            if (!validCommands.includes(cmd)) {
                appendOutput(`bash: ${cmd}: command not found. Type 'jp'.`, "warning");
                return;
            }

            switch(cmd) {
                case 'jp':
                    appendOutput("==================================================", "system");
                    appendOutput("  【日本語システムコマンド一覧 (v11.1 修正決定版)】", "system");
                    appendOutput("==================================================", "system");
                    appendOutput("  jp  : 日本語一覧  |  hlp : 英語一覧  |  aut : 監視ログ流し");
                    appendOutput("  stp : ログ停止    |  man : 手動開発  |  pol : 警察連携");
                    appendOutput("  lok : ロック      |  geo : 位置情報  |  dec : 暗号総当り");
                    appendOutput("  dos : DDoS攻撃    |  err : エラー    |  scn : スキャン");
                    appendOutput("  gen : 鍵生成      |  mtr : マトリクス|  brk : クラッシュ");
                    appendOutput("  sat : 衛星接続    |  bck : バックドア|  ai  : AIコアハック");
                    appendOutput("  inf : IP確認      |  pwd : 階層表示  |  ls  : ファイル一覧");
                    appendOutput("  dlc : Data DL     |  who : ログイン者|  cpu : CPU確認");
                    appendOutput("  cls : 画面消去    |  rst : 再起動");
                    appendOutput("  (ヒント: 秘密コードを表示するには 'jpl' を入力)");
                    break;

                case 'jpl':
                    appendOutput("==================================================", "secret");
                    appendOutput("  【シークレット（秘密コード）リスト】", "secret");
                    appendOutput("==================================================", "secret");
                    appendOutput("  matrix_on : 画面の視覚オーバーライドを発動する隠しコード", "secret");
                    break;

                case 'hlp':
                    appendOutput("Commands: jp, jpl, hlp, aut, stp, man, pol, lok, geo, dec, dos, err, scn, gen, mtr, brk, sat, bck, ai, inf, pwd, ls, dir, dlc, who, cpu, cls, rst", "system");
                    break;

                case 'ai':
                    runSimulatedTask("Overriding Neural Network Core (NEO-AI v4)", "AI Safeguards disabled. Model fully compliant.", () => {
                        appendOutput("STATUS: Autonomous hacking mode active. Neural link stable.", "success");
                    });
                    break;

                case 'pol':
                    runSimulatedTask("Establishing secure VPN tunnel to National Police Cyber Agency", "Encrypted link verified.", () => {
                        appendOutput("[POLICE INTERFACE] Connected to Cyber Crime Incident Response Center.", "police");
                        appendOutput("ALERT LEVEL: SECURE // INCIDENT REPORT ENCRYPTED", "police");
                        appendOutput("TARGET TRACE DATA DISPATCHED TO INVESTIGATION DATABASE.", "police");
                    });
                    break;

                case 'man':
                    startDevModeAnimation();
                    break;

                case 'lok':
                    isLocked = true;
                    promptLabel.textContent = "PASSCODE:";
                    promptLabel.style.color = "#ff3366";
                    input.classList.add('hidden-input');
                    secBadge.textContent = "SYSTEM: LOCKED";
                    secBadge.style.color = "#ff3366";
                    secBadge.style.borderColor = "rgba(255, 51, 102, 0.4)";
                    secBadge.style.background = "#200205";
                    appendOutput("[!] SYSTEM LOCKED. ENTER PASSCODE (***) TO UNLOCK.", "warning");
                    break;

                case 'geo':
                    runSimulatedTask("TrIangulating target geolocation coordinates", "Target node successfully located.", () => {
                        appendOutput("GEO-LOCATION: [35.6895° N, 139.6917° E] (TOKYO, JP)", "success");
                        appendOutput("ISP: CYBER-NET GLOBAL BACKBONE / PROXY NODE #4", "success");
                    });
                    break;

                case 'dec':
                    runSimulatedTask("Brute-forcing hash encryption", "Password hash successfully cracked.", () => {
                        appendOutput("DECRYPTED KEY: #root_Access_9981#", "success");
                    });
                    break;

                case 'dos':
                    runSimulatedTask("Launching DDoS attack on target IP", "Target server overwhelmed by 1.2M packets/sec.", () => {
                        appendOutput("[STATUS] TARGET OFFLINE (HTTP 503 Service Unavailable)", "warning");
                    });
                    break;

                case 'err':
                    appendOutput("[!] CRITICAL ERROR: MEMORY LEAK IN SECTOR 4", "warning");
                    appendOutput("[!] EXCEPTION 0xC0000005 AT 0x7FFF50", "warning");
                    appendOutput("[!] KERNEL PANIC: UNABLE TO MOUNT ROOT FS", "warning");
                    appendOutput("[!] SEGMENTATION FAULT (CORE DUMPED)", "warning");
                    break;

                case 'aut': startAutoStream(); break;
                case 'stp':
                    stopAutoStream();
                    appendOutput("[*] ストリームを停止しました。", "warning");
                    break;

                case 'hak':
                    runSimulatedTask("Bypassing mainframe firewall", "Root privileges granted. Welcome back, Admin.", () => {
                        appendOutput("ACCESS TOKEN: 0x9F8B2C4E1A-ROOT", "success");
                    });
                    break;

                case 'scn':
                    runSimulatedTask("Scanning subnets & vulnerability ports", "Scan complete. 3 open ports detected.", () => {
                        appendOutput("PORT 21 (FTP): VULNERABLE\nPORT 80 (HTTP): SECURE\nPORT 443 (HTTPS): SECURE", "warning");
                    });
                    break;

                case 'gen':
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
                    let key = "";
                    for(let i=0; i<32; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
                    appendOutput(`[GEN] Generated Hash Key: ${key}`, "success");
                    break;

                case 'mtr':
                    appendOutput("[!] INITIALIZING MATRIX STREAM...", "matrix");
                    for(let i=0; i<6; i++) {
                        let line = "";
                        for(let j=0; j<45; j++) line += Math.floor(Math.random() * 2);
                        appendOutput(line, "matrix");
                    }
                    break;

                case 'brk':
                    appendOutput("[!] CRITICAL WARNING: KERNEL PANIC OVERRIDE", "warning");
                    appendOutput("[X] OVERRIDING SECURITY PROTOCOLS...", "warning");
                    document.body.style.backgroundColor = "#220000";
                    setTimeout(() => { document.body.style.backgroundColor = "#010409"; }, 1500);
                    break;

                case 'sat':
                    runSimulatedTask("Connecting to Orbital Military Satellite (US-SAT-7)", "Uplink established. Latency: 12ms", () => {
                        appendOutput("COORDINATES LOCKED: [35.6895° N, 139.6917° E]", "success");
                    });
                    break;

                case 'bck':
                    runSimulatedTask("Injecting persistent backdoor into daemon", "Backdoor successfully installed at /etc/cron.d/", () => {
                        appendOutput("PORT 4444 LISTENING FOR REVERSE SHELL...", "success");
                    });
                    break;

                case 'inf':
                    appendOutput("TARGET: 192.168.1.105 (CYBER-CORE-01)");
                    appendOutput("GATEWAY: 10.0.0.1 | MASK: 255.255.255.0");
                    appendOutput("ENCRYPTION: RSA-4096 / AES-256 [SECURE]", "success");
                    break;

                case 'pwd':
                    appendOutput("/var/root/secure/kernel/sys_core");
                    break;

                case 'ls':
                case 'dir':
                    appendOutput("total 64\ndrwx------  4 root root 4096 Oct 15 06:15 .\n-rw-r--r--  1 root root  840 config.conf\n-rw-r--r--  1 root root 1024 payload.bin\n-rwxr-xr-x  1 root root 2048 override.sh", "success");
                    break;

                case 'dlc':
                    runSimulatedTask("Downloading encrypted database (1.24 GB)", "Download complete. Saved to /tmp/user_data.db", () => {
                        appendOutput("HASH CHECK: SHA256 [OK]", "success");
                    });
                    break;

                case 'who':
                    appendOutput("root     pts/0        2026-10-15 18:30 (10.0.4.15 [REMOTE])");
                    appendOutput("admin    pts/1        2026-10-15 17:12 (LOCAL CONSOLE)");
                    break;

                case 'cpu':
                    appendOutput("CPU USAGE: [████████░░] 78.4%");
                    appendOutput("MEM USAGE: [█████░░░░░] 42.1% (3.38 GB / 8.00 GB)");
                    appendOutput("GPU TEMP: 62°C | FAN SPEED: 3400 RPM", "success");
                    break;

                case 'cls':
                    terminal.innerHTML = "";
                    break;

                case 'rst':
                    appendOutput("Rebooting kernel...", "warning");
                    isProcessing = true;
                    input.disabled = true;
                    setTimeout(() => {
                        terminal.innerHTML = '<span class="system">=== SYSTEM RESTARTED ===</span>\nType <span class="success">jp</span> for command list.';
                        secBadge.textContent = "SYSTEM: SECURE";
                        secBadge.style.color = "#00ffcc";
                        secBadge.style.borderColor = "rgba(0, 255, 204, 0.4)";
                        secBadge.style.background = "#022019";
                        isProcessing = false;
                        input.disabled = false;
                        input.focus();
                    }, 1200);
                    break;
            }
        }
    </script>
</body>
</html>
