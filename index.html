<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebCraft 3D - Bedrock Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; overflow: hidden;
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
            touch-action: none; background: #1a1a1a; color: white;
        }

        /* マイクラ風UIボタンスタイル */
        .mc-btn {
            background: #727272; border: 3px solid #000;
            box-shadow: inset 3px 3px 0 #a8a8a8, inset -3px -3px 0 #484848;
            color: white; font-weight: bold; font-size: 16px; padding: 12px 24px;
            cursor: pointer; text-shadow: 2px 2px 0 #222; text-align: center;
            transition: filter 0.1s;
        }
        .mc-btn:hover { filter: brightness(1.15); }
        .mc-btn:active { box-shadow: inset -3px -3px 0 #a8a8a8, inset 3px 3px 0 #484848; }
        .mc-btn.green { background: #3c8527; box-shadow: inset 3px 3px 0 #63b548, inset -3px -3px 0 #235215; }
        .mc-btn.red { background: #a82828; box-shadow: inset 3px 3px 0 #d95252, inset -3px -3px 0 #6b1515; }

        /* 画面オーバーレイ（ホーム・ワールド選択・新規作成） */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(3px);
        }
        .hidden { display: none !important; }

        /* タイトルロゴ */
        .mc-logo {
            font-size: clamp(36px, 8vw, 68px); font-weight: 900; letter-spacing: 4px;
            color: #e0e0e0; text-shadow: 0 6px 0 #333, 0 10px 20px rgba(0,0,0,0.8);
            margin-bottom: 8px;
        }
        .mc-subtitle {
            color: #ffff55; font-weight: bold; font-size: 16px;
            text-shadow: 2px 2px 0 #3f3f00; transform: rotate(-4deg); margin-bottom: 35px;
        }

        /* パネル（ワールド一覧・新規作成） */
        .mc-panel {
            background: #c6c6c6; border: 4px solid #000;
            box-shadow: inset 4px 4px 0 #fff, inset -4px -4px 0 #555;
            color: #222; width: 92vw; max-width: 560px; padding: 20px; border-radius: 2px;
        }
        .mc-panel h2 { margin: 0 0 15px 0; font-size: 20px; text-align: center; color: #222; }

        #world-list-container {
            background: #222; border: 3px solid #555; height: 220px; overflow-y: auto;
            padding: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;
        }
        .world-item {
            background: #3a3a3a; border: 2px solid #666; padding: 10px 14px; color: white;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .world-item:hover { border-color: #fff; background: #4a4a4a; }
        .world-info h4 { margin: 0 0 4px 0; font-size: 16px; }
        .world-info p { margin: 0; font-size: 12px; color: #bbb; }

        /* フォーム要素 */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .mc-input {
            width: 100%; padding: 10px; background: #000; color: #fff;
            border: 2px solid #777; font-size: 15px;
        }
        .toggle-row { display: flex; gap: 8px; }
        .toggle-btn { flex: 1; padding: 10px; font-size: 14px; }
        .toggle-btn.selected { background: #3c8527; box-shadow: inset 3px 3px 0 #63b548, inset -3px -3px 0 #235215; }

        /* ゲーム内HUD */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.85); }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        #hud {
            position: absolute; top: 8px; left: 8px; color: white;
            background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 4px; z-index: 10;
            font-size: 12px; line-height: 1.5; pointer-events: none;
        }
        #top-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 15; }
        .mini-btn {
            background: rgba(0,0,0,0.65); color: white; border: 2px solid #888;
            padding: 7px 10px; font-size: 12px; font-weight: bold; cursor: pointer;
        }

        /* ホットバー */
        #hotbar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 3px; background: rgba(0,0,0,0.75); padding: 4px; border: 2px solid #555; z-index: 15;
            max-width: 96vw; overflow-x: auto;
        }
        .slot {
            width: 42px; height: 42px; flex-shrink: 0; border: 2px solid #555;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 9px; position: relative; cursor: pointer; background: rgba(255,255,255,0.1);
        }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.3); transform: scale(1.06); }
        .slot-icon { width: 20px; height: 20px; margin-bottom: 1px; border: 1px solid rgba(0,0,0,0.5); image-rendering: pixelated; }
        .slot-count { position: absolute; bottom: 1px; right: 3px; font-weight: bold; font-size: 10px; text-shadow: 1px 1px 0 #000; }

        /* スマホ用コントローラー */
        #joystick-zone {
            position: absolute; bottom: 72px; left: 20px; width: 115px; height: 115px;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%; z-index: 15; display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob { width: 44px; height: 44px; background: rgba(255,255,255,0.75); border-radius: 50%; position: absolute; pointer-events: none; }
        #mobile-controls { position: absolute; bottom: 72px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 15; }
        .control-row { display: flex; gap: 10px; }
        .touch-btn {
            width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.6); color: white; font-size: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-weight: bold;
        }
        .touch-btn span { font-size: 9px; }
        .touch-btn:active { background: rgba(255,255,255,0.4); }

        /* ゲーム内モーダル */
        .modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #c6c6c6; border: 4px solid #000; color: #222; padding: 16px; z-index: 30;
            width: 90vw; max-width: 520px; max-height: 75vh; overflow-y: auto;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 10px; }
        #mining-bar-container {
            display: none; position: absolute; top: 55%; left: 50%; transform: translateX(-50%);
            width: 100px; height: 8px; background: rgba(0,0,0,0.7); border: 1px solid #fff; z-index: 10;
        }
        #mining-bar { width: 0%; height: 100%; background: #4CAF50; }
        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.35); pointer-events: none; z-index: 25; display: none;
        }
    </style>
</head>
<body>

    <!-- 1. ホーム（タイトル）画面 -->
    <div id="home-screen" class="screen">
        <div class="mc-logo">WEBCRAFT</div>
        <div class="mc-subtitle">JavaScript 3D Edition!</div>
        <div style="display:flex; flex-direction:column; gap:14px; width:280px;">
            <button class="mc-btn green" onclick="openWorldSelect()">プレイ</button>
            <button class="mc-btn" onclick="alert('【操作方法】\nPC: WASD移動 / マウス視点 / 左クリック攻撃・破壊 / 右クリック配置\nスマホ: 左スティック移動 / 右スワイプ視点 / 右ボタン操作')">操作説明</button>
        </div>
    </div>

    <!-- 2. ワールド一覧画面 -->
    <div id="world-select-screen" class="screen hidden">
        <div class="mc-panel">
            <h2>ワールドを選択</h2>
            <div id="world-list-container"></div>
            <div style="display:flex; gap:10px;">
                <button class="mc-btn green" style="flex:2;" onclick="openCreateWorld()">新規ワールド作成</button>
                <button class="mc-btn" style="flex:1;" onclick="showScreen('home-screen')">戻る</button>
            </div>
        </div>
    </div>

    <!-- 3. 新規ワールド作成画面 -->
    <div id="create-world-screen" class="screen hidden">
        <div class="mc-panel">
            <h2>新しいワールドを作成</h2>
            <div class="form-group">
                <label>ワールド名</label>
                <input type="text" id="new-world-name" class="mc-input" value="マイワールド">
            </div>
            <div class="form-group">
                <label>ゲームモード</label>
                <div class="toggle-row" id="mode-selector">
                    <button class="mc-btn toggle-btn selected" data-val="survival" onclick="selectOption('mode-selector', this)">サバイバル</button>
                    <button class="mc-btn toggle-btn" data-val="creative" onclick="selectOption('mode-selector', this)">クリエイティブ</button>
                </div>
            </div>
            <div class="form-group">
                <label>ワールドタイプ</label>
                <div class="toggle-row" id="type-selector">
                    <button class="mc-btn toggle-btn selected" data-val="normal" onclick="selectOption('type-selector', this)">通常地形</button>
                    <button class="mc-btn toggle-btn" data-val="flat" onclick="selectOption('type-selector', this)">フラット</button>
                    <button class="mc-btn toggle-btn" data-val="island" onclick="selectOption('type-selector', this)">浮島</button>
                </div>
            </div>
            <div class="form-group">
                <label>シード値（空白でランダム）</label>
                <input type="text" id="new-world-seed" class="mc-input" placeholder="例: 12345">
            </div>
            <div style="display:flex; gap:10px; margin-top:18px;">
                <button class="mc-btn green" style="flex:2;" onclick="createAndStartWorld()">ワールドを作成して開始</button>
                <button class="mc-btn" style="flex:1;" onclick="openWorldSelect()">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 4. ゲームプレイ画面HUD -->
    <div id="game-ui" class="hidden">
        <div id="crosshair"></div>
        <div id="mining-bar-container"><div id="mining-bar"></div></div>
        <div id="damage-flash"></div>

        <div id="hud">
            <div><strong id="hud-world-name">ワールド</strong> (<span id="mode-display">サバイバル</span>)</div>
            <div>時刻: <span id="time-display">昼</span> | 選択: <strong id="selected-item-name">草ブロック</strong></div>
            <div id="health-display" style="color:#FF5252; font-size:14px;">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
        </div>

        <div id="top-actions">
            <button class="mini-btn" onclick="toggleModal('inventory-modal')">🎒アイテム</button>
            <button class="mini-btn" onclick="toggleModal('crafting-modal')">⚒️クラフト</button>
            <button class="mini-btn" onclick="toggleGameMode()">🔄モード</button>
            <button class="mini-btn" onclick="saveAndQuit()">⏸️保存して終了</button>
        </div>

        <div id="joystick-zone"><div id="joystick-knob"></div></div>

        <div id="mobile-controls">
            <div class="control-row">
                <div class="touch-btn" id="btn-fly-down" style="display:none;">⬇️<span>下降</span></div>
                <div class="touch-btn" id="btn-jump">⬆️<span>ジャンプ</span></div>
            </div>
            <div class="control-row">
                <div class="touch-btn" id="btn-break">⚔️<span>攻撃/破壊</span></div>
                <div class="touch-btn" id="btn-place">🧱<span>配置/使用</span></div>
            </div>
        </div>

        <div id="hotbar"></div>

        <div id="inventory-modal" class="modal">
            <h3 style="margin-top:0;">全40種アイテム一覧</h3>
            <div id="inventory-grid" class="grid"></div>
            <button class="mc-btn" style="width:100%; margin-top:12px;" onclick="toggleModal('inventory-modal')">閉じる</button>
        </div>

        <div id="crafting-modal" class="modal">
            <h3 style="margin-top:0;">クラフト作業台</h3>
            <div id="crafting-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            <button class="mc-btn" style="width:100%; margin-top:12px;" onclick="toggleModal('crafting-modal')">閉じる</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. ドット絵テクスチャ自動生成エンジン ---
        function createPixelTexture(baseColorHex, noiseIntensity = 25, pattern = 'noise') {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');

            const r = (baseColorHex >> 16) & 255;
            const g = (baseColorHex >> 8) & 255;
            const b = baseColorHex & 255;

            for (let y = 0; y < 16; y++) {
                for (let x = 0; x < 16; x++) {
                    let delta = (Math.random() - 0.5) * noiseIntensity;
                    if (pattern === 'brick' && (y % 4 === 0 || (x + (Math.floor(y / 4) % 2) * 4) % 8 === 0)) delta = -45;
                    if (pattern === 'wood' && x % 3 === 0) delta = -20;
                    if (pattern === 'ore' && Math.random() < 0.14) {
                        ctx.fillStyle = '#00ffff';
                        ctx.fillRect(x, y, 1, 1);
                        continue;
                    }
                    if (pattern === 'tnt' && y >= 6 && y <= 9) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(x, y, 1, 1);
                        continue;
                    }
                    const nr = Math.min(255, Math.max(0, Math.floor(r + delta)));
                    const ng = Math.min(255, Math.max(0, Math.floor(g + delta)));
                    const nb = Math.min(255, Math.max(0, Math.floor(b + delta)));
                    ctx.fillStyle = `rgb(${nr},${ng},${nb})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return { tex, dataUrl: canvas.toDataURL() };
        }

        // --- 2. 40種類のアイテム・ブロック定義 ---
        const ITEMS = [
            { id: 1, name: "草ブロック", color: 0x559933, type: "block", hardness: 0.6, pat: 'noise' },
            { id: 2, name: "土", color: 0x795548, type: "block", hardness: 0.5, pat: 'noise' },
            { id: 3, name: "石", color: 0x888888, type: "block", hardness: 1.5, pat: 'noise' },
            { id: 4, name: "丸石", color: 0x6e6e6e, type: "block", hardness: 2.0, pat: 'brick' },
            { id: 5, name: "砂", color: 0xe6d89c, type: "block", hardness: 0.5, pat: 'noise' },
            { id: 6, name: "砂利", color: 0x9e9e9e, type: "block", hardness: 0.6, pat: 'noise' },
            { id: 7, name: "粘土", color: 0x90A4AE, type: "block", hardness: 0.6, pat: 'noise' },
            { id: 8, name: "雪ブロック", color: 0xF5F5F5, type: "block", hardness: 0.4, pat: 'noise' },
            { id: 9, name: "氷", color: 0x81D4FA, type: "block", hardness: 0.5, transparent: true },
            { id: 10, name: "黒曜石", color: 0x261447, type: "block", hardness: 5.0, pat: 'noise' },
            { id: 11, name: "オーク原木", color: 0x5D4037, type: "block", hardness: 1.2, pat: 'wood' },
            { id: 12, name: "オーク木材", color: 0xA1887F, type: "block", hardness: 1.0, pat: 'wood' },
            { id: 13, name: "白樺原木", color: 0xECEFF1, type: "block", hardness: 1.2, pat: 'wood' },
            { id: 14, name: "白樺木材", color: 0xFFE0B2, type: "block", hardness: 1.0, pat: 'wood' },
            { id: 15, name: "葉ブロック", color: 0x2e7d32, type: "block", hardness: 0.2, transparent: true },
            { id: 16, name: "サボテン", color: 0x1b5e20, type: "block", hardness: 0.4, pat: 'wood' },
            { id: 17, name: "カボチャ", color: 0xEF6C00, type: "block", hardness: 0.8, pat: 'wood' },
            { id: 18, name: "スイカ", color: 0x7cb342, type: "block", hardness: 0.8, pat: 'wood' },
            { id: 19, name: "石炭鉱石", color: 0x424242, type: "block", hardness: 2.0, pat: 'noise' },
            { id: 20, name: "鉄鉱石", color: 0xbcaaa4, type: "block", hardness: 2.5, pat: 'noise' },
            { id: 21, name: "金鉱石", color: 0xFFD54F, type: "block", hardness: 2.5, pat: 'noise' },
            { id: 22, name: "ダイヤ鉱石", color: 0x757575, type: "block", hardness: 3.0, pat: 'ore' },
            { id: 23, name: "鉄ブロック", color: 0xE0E0E0, type: "block", hardness: 3.0 },
            { id: 24, name: "金ブロック", color: 0xFFC107, type: "block", hardness: 3.0 },
            { id: 25, name: "ダイヤ塊", color: 0x00BCD4, type: "block", hardness: 3.5 },
            { id: 26, name: "ラピス塊", color: 0x1E88E5, type: "block", hardness: 2.5 },
            { id: 27, name: "レンガ", color: 0x9e3b33, type: "block", hardness: 2.0, pat: 'brick' },
            { id: 28, name: "石レンガ", color: 0x6e6e6e, type: "block", hardness: 1.8, pat: 'brick' },
            { id: 29, name: "ガラス", color: 0xE0F7FA, type: "block", hardness: 0.3, transparent: true },
            { id: 30, name: "発光石", color: 0xFFF176, type: "block", hardness: 0.5 },
            { id: 31, name: "本棚", color: 0x8D6E63, type: "block", hardness: 1.0, pat: 'brick' },
            { id: 32, name: "羊毛(白)", color: 0xFAFAFA, type: "block", hardness: 0.5 },
            { id: 33, name: "羊毛(赤)", color: 0xE53935, type: "block", hardness: 0.5 },
            { id: 34, name: "羊毛(青)", color: 0x1E88E5, type: "block", hardness: 0.5 },
            { id: 35, name: "作業台", color: 0x6D4C41, type: "block", hardness: 1.2, pat: 'brick' },
            { id: 36, name: "かまど", color: 0x546E7A, type: "block", hardness: 2.0, pat: 'brick' },
            { id: 37, name: "TNT", color: 0xd32f2f, type: "block", hardness: 0.2, isTnt: true, pat: 'tnt' },
            { id: 38, name: "木ツルハシ", color: 0xA1887F, type: "tool", miningSpeed: 2.5, damage: 2 },
            { id: 39, name: "ダイヤの剣", color: 0x00E5FF, type: "tool", miningSpeed: 5.0, damage: 7 },
            { id: 40, name: "焼きリンゴ", color: 0xFF1744, type: "food", heal: 4 }
        ];

        // テクスチャ事前生成
        const itemTextures = new Map();
        ITEMS.forEach(item => {
            itemTextures.set(item.id, createPixelTexture(item.color, 30, item.pat || 'noise'));
        });

        const RECIPES = [
            { result: ITEMS[11], count: 4, req: { item: ITEMS[10], count: 1 }, name: "オーク原木×1 → オーク木材×4" },
            { result: ITEMS[37], count: 1, req: { item: ITEMS[4], count: 4 }, name: "砂×4 → TNT×1" },
            { result: ITEMS[38], count: 1, req: { item: ITEMS[11], count: 2 }, name: "オーク木材×2 → 木ツルハシ" },
            { result: ITEMS[39], count: 1, req: { item: ITEMS[24], count: 1 }, name: "ダイヤ塊×1 → ダイヤの剣" },
            { result: ITEMS[39], count: 1, req: { item: ITEMS[3], count: 3 }, name: "丸石×3 → ダイヤの剣（特別）" }
        ];

        // --- 3. サウンドエンジン ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'break') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.1);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'place') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'hit') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.15);
                gain.gain.setValueAtTime(0.35, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'explosion') {
                osc.type = 'square'; osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(18, now + 0.5);
                gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        // --- 4. 画面遷移 & ワールド管理システム ---
        let currentWorldId = null;
        let currentWorldMeta = null;
        let gameMode = "survival";
        let isPlaying = false;
        let isModalOpen = false;
        let health = 10;
        let worldTime = 0; // 0 ~ 120秒で昼夜サイクル

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('game-ui').classList.add('hidden');
            if (screenId) document.getElementById(screenId).classList.remove('hidden');
        }

        function selectOption(groupId, btn) {
            document.querySelectorAll(`#${groupId} .toggle-btn`).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function getSavedWorlds() {
            try { return JSON.parse(localStorage.getItem('webcraft_worlds_index') || '[]'); }
            catch (e) { return []; }
        }

        function openWorldSelect() {
            showScreen('world-select-screen');
            const listEl = document.getElementById('world-list-container');
            const worlds = getSavedWorlds();
            listEl.innerHTML = '';

            if (worlds.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:70px;">ワールドがありません。「新規ワールド作成」を押してください。</p>';
                return;
            }

            worlds.forEach(w => {
                const div = document.createElement('div');
                div.className = 'world-item';
                const modeLabel = w.mode === 'survival' ? 'サバイバル' : 'クリエイティブ';
                const typeLabel = w.type === 'normal' ? '通常' : (w.type === 'flat' ? 'フラット' : '浮島');
                div.innerHTML = `
                    <div class="world-info" onclick="loadWorld('${w.id}')">
                        <h4>${w.name}</h4>
                        <p>${modeLabel}モード | 地形: ${typeLabel} | 更新: ${w.updatedAt}</p>
                    </div>
                    <button class="mc-btn red" style="padding:6px 10px; font-size:12px;" onclick="deleteWorld('${w.id}')">削除</button>
                `;
                listEl.appendChild(div);
            });
        }

        function openCreateWorld() {
            document.getElementById('new-world-name').value = `ワールド ${getSavedWorlds().length + 1}`;
            showScreen('create-world-screen');
        }

        function deleteWorld(id) {
            if (!confirm('このワールドを完全に削除しますか？')) return;
            const worlds = getSavedWorlds().filter(w => w.id !== id);
            localStorage.setItem('webcraft_worlds_index', JSON.stringify(worlds));
            localStorage.removeItem('webcraft_data_' + id);
            openWorldSelect();
        }

        // --- 5. Three.js シーン & ワールド生成 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 25, 85);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.65);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        const worldBlocks = new Map();
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const materialsCache = new Map();

        function getMaterial(item) {
            if (!materialsCache.has(item.id)) {
                const texObj = itemTextures.get(item.id);
                materialsCache.set(item.id, new THREE.MeshLambertMaterial({
                    map: texObj.tex,
                    transparent: !!item.transparent,
                    opacity: item.transparent ? 0.8 : 1.0
                }));
            }
            return materialsCache.get(item.id);
        }

        function clearWorld() {
            worldBlocks.forEach(mesh => scene.remove(mesh));
            worldBlocks.clear();
            mobs.forEach(m => scene.remove(m.mesh));
            mobs.length = 0;
        }

        function addBlock(x, y, z, item) {
            const key = `${x},${y},${z}`;
            if (worldBlocks.has(key)) return;
            const mesh = new THREE.Mesh(boxGeo, getMaterial(item));
            mesh.position.set(x, y, z);
            mesh.userData = { item: item, pos: { x, y, z } };
            scene.add(mesh);
            worldBlocks.set(key, mesh);
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            if (!worldBlocks.has(key)) return null;
            const mesh = worldBlocks.get(key);
            scene.remove(mesh);
            worldBlocks.delete(key);
            playSound('break');
            return mesh.userData.item;
        }

        // シード付き疑似乱数
        function seededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return () => (s = s * 16807 % 2147483647) / 2147483647;
        }

        function buildTerrain(type, seedNum) {
            clearWorld();
            const rand = seededRandom(seedNum);

            if (type === 'flat') {
                for (let x = -18; x <= 18; x++) {
                    for (let z = -18; z <= 18; z++) {
                        addBlock(x, 0, z, ITEMS[0]);
                        addBlock(x, -1, z, ITEMS[1]);
                        addBlock(x, -2, z, ITEMS[2]);
                    }
                }
            } else if (type === 'island') {
                for (let x = -12; x <= 12; x++) {
                    for (let z = -12; z <= 12; z++) {
                        const dist = Math.hypot(x, z);
                        if (dist < 10) {
                            const depth = Math.floor((10 - dist) * 0.6);
                            addBlock(x, 0, z, ITEMS[0]);
                            for (let d = 1; d <= depth; d++) {
                                addBlock(x, -d, z, d === 1 ? ITEMS[1] : ITEMS[2]);
                            }
                        }
                    }
                }
                spawnTree(3, 1, 3);
            } else {
                // 通常地形（起伏 + 木 + 鉱石）
                const offsetX = rand() * 100;
                const offsetZ = rand() * 100;
                for (let x = -18; x <= 18; x++) {
                    for (let z = -18; z <= 18; z++) {
                        const h = Math.floor(
                            Math.sin((x + offsetX) * 0.18) * Math.cos((z + offsetZ) * 0.18) * 3 +
                            Math.sin((x - offsetZ) * 0.35) * 1.5
                        );
                        addBlock(x, h, z, ITEMS[0]); // 草
                        addBlock(x, h - 1, z, ITEMS[1]); // 土
                        addBlock(x, h - 2, z, ITEMS[2]); // 石
                        addBlock(x, h - 3, z, rand() < 0.15 ? ITEMS[21] : ITEMS[2]); // ダイヤ鉱石混じり

                        // 確率で木を生成
                        if (Math.abs(x) > 3 && Math.abs(z) > 3 && rand() < 0.025) {
                            spawnTree(x, h + 1, z);
                        }
                    }
                }
            }
            spawnInitialMobs();
        }

        function spawnTree(x, y, z) {
            for (let ty = 0; ty < 4; ty++) addBlock(x, y + ty, z, ITEMS[10]); // 原木
            for (let lx = -2; lx <= 2; lx++) {
                for (let lz = -2; lz <= 2; lz++) {
                    for (let ly = 3; ly <= 4; ly++) {
                        if (Math.abs(lx) + Math.abs(lz) < 4) addBlock(x + lx, y + ly, z + lz, ITEMS[14]);
                    }
                }
            }
        }

        function createAndStartWorld() {
            const name = document.getElementById('new-world-name').value.trim() || 'マイワールド';
            const mode = document.querySelector('#mode-selector .selected').dataset.val;
            const type = document.querySelector('#type-selector .selected').dataset.val;
            const seedInput = document.getElementById('new-world-seed').value.trim();
            const seed = seedInput ? parseInt(seedInput) || seedInput.split('').reduce((a, c) => a + c.charCodeAt(0), 0) : Math.floor(Math.random() * 999999);

            const id = 'world_' + Date.now();
            const meta = { id, name, mode, type, seed, updatedAt: new Date().toLocaleDateString() };

            const worlds = getSavedWorlds();
            worlds.unshift(meta);
            localStorage.setItem('webcraft_worlds_index', JSON.stringify(worlds));

            currentWorldId = id;
            currentWorldMeta = meta;
            gameMode = mode;

            buildTerrain(type, seed);
            setupPlayerStart();
            saveWorldData();
            enterGameUI();
        }

        function loadWorld(id) {
            const worlds = getSavedWorlds();
            const meta = worlds.find(w => w.id === id);
            if (!meta) return;

            currentWorldId = id;
            currentWorldMeta = meta;
            gameMode = meta.mode;

            clearWorld();
            const raw = localStorage.getItem('webcraft_data_' + id);
            if (raw) {
                const data = JSON.parse(raw);
                data.blocks.forEach(b => addBlock(b.x, b.y, b.z, ITEMS.find(i => i.id === b.id) || ITEMS[0]));
                if (data.hotbar) {
                    hotbar = data.hotbar.map(s => ({ item: ITEMS.find(i => i.id === s.id) || ITEMS[0], count: s.count }));
                }
            } else {
                buildTerrain(meta.type, meta.seed);
            }
            spawnInitialMobs();
            setupPlayerStart();
            enterGameUI();
        }

        function saveWorldData() {
            if (!currentWorldId) return;
            const blocks = [];
            worldBlocks.forEach(mesh => {
                blocks.push({ x: mesh.userData.pos.x, y: mesh.userData.pos.y, z: mesh.userData.pos.z, id: mesh.userData.item.id });
            });
            const hbData = hotbar.map(s => ({ id: s.item.id, count: s.count }));
            localStorage.setItem('webcraft_data_' + currentWorldId, JSON.stringify({ blocks, hotbar: hbData }));

            const worlds = getSavedWorlds();
            const w = worlds.find(item => item.id === currentWorldId);
            if (w) {
                w.mode = gameMode;
                w.updatedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                localStorage.setItem('webcraft_worlds_index', JSON.stringify(worlds));
            }
        }

        function saveAndQuit() {
            saveWorldData();
            isPlaying = false;
            if (document.pointerLockElement) document.exitPointerLock();
            showScreen('home-screen');
        }

        function setupPlayerStart() {
            camera.position.set(0, 8, 0);
            velocity.set(0, 0, 0);
            yaw = 0; pitch = 0;
            health = 10;
            isFlying = false;
            if (gameMode === 'survival') {
                hotbar = [
                    { item: ITEMS[37], count: 1 }, // 木ツルハシ
                    { item: ITEMS[39], count: 3 }, // 焼きリンゴ
                    { item: ITEMS[11], count: 8 }, // 木材
                    { item: ITEMS[0], count: 0 }, { item: ITEMS[0], count: 0 }, { item: ITEMS[0], count: 0 },
                    { item: ITEMS[0], count: 0 }, { item: ITEMS[0], count: 0 }, { item: ITEMS[0], count: 0 }
                ];
            } else {
                hotbar = Array(9).fill(0).map((_, i) => ({ item: ITEMS[i], count: 64 }));
            }
        }

        function enterGameUI() {
            showScreen(null);
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('hud-world-name').textContent = currentWorldMeta.name;
            isPlaying = true;
            updateModeDisplay();
            updateUI();
            if (!('ontouchstart' in window)) document.body.requestPointerLock?.();
        }

        // --- 6. モブ（生物・戦闘システム） ---
        const mobs = [];
        class Mob {
            constructor(type, x, y, z) {
                this.type = type; // 'pig' or 'zombie'
                this.hp = type === 'pig' ? 6 : 12;
                const group = new THREE.Group();
                const mat = new THREE.MeshLambertMaterial({ color: type === 'pig' ? 0xF48FB1 : 0x388E3C });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), mat);
                body.position.y = 0.5;
                group.add(body);
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat);
                head.position.set(0, 0.9, type === 'pig' ? 0.7 : 0.5);
                group.add(head);

                group.position.set(x, y, z);
                group.traverse(obj => { obj.userData.mob = this; });
                scene.add(group);
                this.mesh = group;
                this.velocity = new THREE.Vector3();
                this.timer = 0;
                this.attackCooldown = 0;
            }
            update(delta, playerPos) {
                this.timer += delta;
                if (this.attackCooldown > 0) this.attackCooldown -= delta;

                if (this.type === 'pig') {
                    if (this.timer > 3) {
                        this.timer = 0;
                        this.velocity.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2).normalize().multiplyScalar(1.5);
                    }
                } else {
                    const dir = new THREE.Vector3().subVectors(playerPos, this.mesh.position);
                    dir.y = 0;
                    const dist = dir.length();
                    if (dist < 16 && dist > 1.3) {
                        this.velocity.copy(dir.normalize().multiplyScalar(2.4));
                    } else {
                        this.velocity.set(0, 0, 0);
                        // サバイバル時のゾンビ攻撃
                        if (dist <= 1.4 && gameMode === 'survival' && this.attackCooldown <= 0) {
                            this.attackCooldown = 1.2;
                            damagePlayer(1);
                        }
                    }
                }
                this.mesh.position.x += this.velocity.x * delta;
                this.mesh.position.z += this.velocity.z * delta;
                if (this.velocity.length() > 0.1) {
                    this.mesh.rotation.y = Math.atan2(this.velocity.x, this.velocity.z);
                }
            }
            takeDamage(amount) {
                this.hp -= amount;
                playSound('hit');
                this.mesh.position.y += 0.4; // ノックバック演出
                if (this.hp <= 0) {
                    scene.remove(this.mesh);
                    const idx = mobs.indexOf(this);
                    if (idx > -1) mobs.splice(idx, 1);
                    if (gameMode === 'survival') addItemToInventory(ITEMS[39]); // 焼きリンゴドロップ
                }
            }
        }

        function spawnInitialMobs() {
            for (let i = 0; i < 4; i++) {
                mobs.push(new Mob('pig', (Math.random() - 0.5) * 18, 4, (Math.random() - 0.5) * 18));
                mobs.push(new Mob('zombie', (Math.random() - 0.5) * 20, 4, (Math.random() - 0.5) * 20));
            }
        }

        function damagePlayer(amount) {
            health = Math.max(0, health - amount);
            playSound('hit');
            const flash = document.getElementById('damage-flash');
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 150);
            updateUI();

            if (health <= 0) {
                alert('やられてしまった！リスポーンします。');
                health = 10;
                camera.position.set(0, 10, 0);
                updateUI();
            }
        }

        // --- 7. PC & スマホ・タブレット両対応の操作系 ---
        let velocity = new THREE.Vector3();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joyX = 0, joyY = 0;
        let canJump = false, isFlying = false, lastJumpTap = 0;
        let pitch = 0, yaw = 0;
        let isBreaking = false, miningProgress = 0;
        let hotbar = Array(9).fill(0).map((_, i) => ({ item: ITEMS[i], count: 64 }));
        let selectedSlot = 0;

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && !isModalOpen && isPlaying) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                updateCameraRotation();
            }
        });

        let lookTouchId = null, lastLookX = 0, lastLookY = 0;
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (!isPlaying || isModalOpen) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (lookTouchId === null) { lookTouchId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY; }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!isPlaying || isModalOpen) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === lookTouchId) {
                    yaw -= (t.clientX - lastLookX) * 0.005;
                    pitch -= (t.clientY - lastLookY) * 0.005;
                    updateCameraRotation();
                    lastLookX = t.clientX; lastLookY = t.clientY;
                }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
            }
        });

        function updateCameraRotation() {
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        // ジョイスティック
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyTouchId = null;

        joyZone.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            const t = e.changedTouches[0];
            joyTouchId = t.identifier;
            updateJoystick(t.clientX, t.clientY);
        }, { passive: false });

        joyZone.addEventListener('touchmove', (e) => {
            e.preventDefault(); e.stopPropagation();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, { passive: false });

        joyZone.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null; joyX = 0; joyY = 0;
                    joyKnob.style.transform = `translate(0px, 0px)`;
                }
            }
        });

        function updateJoystick(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const maxRadius = rect.width / 2 - 20;
            let dx = clientX - (rect.left + rect.width / 2);
            let dy = clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxRadius; joyY = dy / maxRadius;
        }

        // アクションボタン
        const btnJump = document.getElementById('btn-jump');
        const btnFlyDown = document.getElementById('btn-fly-down');
        const btnBreak = document.getElementById('btn-break');
        const btnPlace = document.getElementById('btn-place');

        function triggerJump() {
            const now = performance.now();
            if (gameMode === 'creative' && now - lastJumpTap < 300) {
                isFlying = !isFlying; velocity.y = 0;
                btnFlyDown.style.display = isFlying ? 'flex' : 'none';
            } else if (isFlying) { velocity.y = 6; }
            else if (canJump) { velocity.y = 7.5; canJump = false; }
            lastJumpTap = now;
        }

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); });
        btnJump.addEventListener('touchend', () => { if (isFlying) velocity.y = 0; });
        btnFlyDown.addEventListener('touchstart', (e) => { e.preventDefault(); if (isFlying) velocity.y = -6; });
        btnFlyDown.addEventListener('touchend', () => { if (isFlying) velocity.y = 0; });

        btnBreak.addEventListener('touchstart', (e) => { e.preventDefault(); startAttackOrMine(); });
        btnBreak.addEventListener('touchend', () => { stopMine(); });
        btnPlace.addEventListener('touchstart', (e) => { e.preventDefault(); handlePlaceAction(); });

        // PCキーボード・マウス
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.code === 'KeyE') { toggleModal('inventory-modal'); return; }
            if (e.code === 'KeyC') { toggleModal('crafting-modal'); return; }
            if (isModalOpen) return;
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': triggerJump(); break;
                case 'ShiftLeft': if (isFlying) velocity.y = -6; break;
            }
            if (e.key >= '1' && e.key <= '9') { selectedSlot = parseInt(e.key) - 1; updateUI(); }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'Space': case 'ShiftLeft': if (isFlying) velocity.y = 0; break;
            }
        });

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (!isPlaying || isModalOpen) return;
            if (document.pointerLockElement !== document.body && !('ontouchstart' in window)) {
                document.body.requestPointerLock?.();
                return;
            }
            if (e.button === 0) startAttackOrMine();
            else if (e.button === 2) handlePlaceAction();
        });
        document.addEventListener('mouseup', (e) => { if (e.button === 0) stopMine(); });
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- 8. 攻撃・採掘・配置処理 ---
        const raycaster = new THREE.Raycaster();
        raycaster.far = 6;

        function startAttackOrMine() {
            // まずモブへの攻撃判定
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const mobMeshes = mobs.map(m => m.mesh);
            const mobHits = raycaster.intersectObjects(mobMeshes, true);
            if (mobHits.length > 0 && mobHits[0].object.userData.mob) {
                const dmg = hotbar[selectedSlot].item.damage || 2;
                mobHits[0].object.userData.mob.takeDamage(dmg);
                return;
            }
            isBreaking = true;
            miningProgress = 0;
        }

        function stopMine() {
            isBreaking = false;
            miningProgress = 0;
            document.getElementById('mining-bar-container').style.display = 'none';
        }

        function getTargetBlock() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Array.from(worldBlocks.values()));
            return intersects.length > 0 ? intersects[0] : null;
        }

        function handlePlaceAction() {
            const slot = hotbar[selectedSlot];
            if (!slot || (gameMode === 'survival' && slot.count <= 0)) return;

            if (slot.item.type === 'food') {
                if (gameMode === 'survival' && health < 10) {
                    health = Math.min(10, health + slot.item.heal);
                    slot.count--;
                    playSound('place');
                    updateUI();
                }
                return;
            }
            if (slot.item.type !== 'block') return;
            const hit = getTargetBlock();
            if (!hit) return;

            const pos = hit.object.position.clone().add(hit.face.normal);
            addBlock(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z), slot.item);
            playSound('place');

            if (slot.item.isTnt) {
                const tntPos = pos.clone();
                setTimeout(() => {
                    playSound('explosion');
                    for (let x = -2; x <= 2; x++) {
                        for (let y = -2; y <= 2; y++) {
                            for (let z = -2; z <= 2; z++) {
                                removeBlock(Math.round(tntPos.x + x), Math.round(tntPos.y + y), Math.round(tntPos.z + z));
                            }
                        }
                    }
                }, 2000);
            }
            if (gameMode === 'survival') { slot.count--; updateUI(); }
        }

        function addItemToInventory(item) {
            for (let s of hotbar) {
                if (s.item.id === item.id && s.count > 0 && s.count < 64) { s.count++; updateUI(); return; }
            }
            for (let i = 0; i < hotbar.length; i++) {
                if (hotbar[i].count <= 0) { hotbar[i] = { item: item, count: 1 }; updateUI(); return; }
            }
        }

        function toggleGameMode() {
            gameMode = gameMode === 'creative' ? 'survival' : 'creative';
            if (gameMode === 'survival') { isFlying = false; btnFlyDown.style.display = 'none'; }
            updateModeDisplay();
            updateUI();
        }

        function updateModeDisplay() {
            const modeEl = document.getElementById('mode-display');
            modeEl.textContent = gameMode === 'creative' ? 'クリエイティブ' : 'サバイバル';
            modeEl.style.color = gameMode === 'creative' ? '#4CAF50' : '#FF9800';
            document.getElementById('health-display').style.display = gameMode === 'survival' ? 'block' : 'none';
        }

        // --- 9. UI & モーダル構築 ---
        function toggleModal(id) {
            const modal = document.getElementById(id);
            const willOpen = modal.style.display !== 'block';
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            modal.style.display = willOpen ? 'block' : 'none';
            isModalOpen = willOpen;
            if (willOpen && document.pointerLockElement) document.exitPointerLock();
        }

        function updateUI() {
            const hotbarEl = document.getElementById('hotbar');
            hotbarEl.innerHTML = '';
            hotbar.forEach((slot, idx) => {
                const div = document.createElement('div');
                div.className = 'slot' + (idx === selectedSlot ? ' active' : '');
                const hasItem = gameMode === 'creative' || slot.count > 0;
                const texUrl = itemTextures.get(slot.item.id).dataUrl;
                div.innerHTML = `
                    <img class="slot-icon" src="${texUrl}" style="opacity:${hasItem ? 1 : 0.15}">
                    <div style="font-size:8px; overflow:hidden; white-space:nowrap; width:38px;">${hasItem ? slot.item.name : ''}</div>
                    <div class="slot-count">${gameMode === 'creative' ? '∞' : (slot.count > 0 ? slot.count : '')}</div>
                `;
                div.onclick = () => { selectedSlot = idx; updateUI(); };
                hotbarEl.appendChild(div);
            });
            const cur = hotbar[selectedSlot];
            document.getElementById('selected-item-name').textContent = (gameMode === 'creative' || cur.count > 0) ? cur.item.name : '素手';
            document.getElementById('health-display').textContent = '❤️'.repeat(health) + '🖤'.repeat(10 - health);
        }

        function initModals() {
            const invGrid = document.getElementById('inventory-grid');
            ITEMS.forEach(item => {
                const div = document.createElement('div');
                div.className = 'slot';
                div.style.width = '52px'; div.style.height = '52px'; div.style.background = '#555';
                div.innerHTML = `<img class="slot-icon" src="${itemTextures.get(item.id).dataUrl}"><div style="font-size:8px;">${item.name}</div>`;
                div.onclick = () => { hotbar[selectedSlot] = { item: item, count: 64 }; updateUI(); toggleModal('inventory-modal'); };
                invGrid.appendChild(div);
            });

            const craftList = document.getElementById('crafting-list');
            RECIPES.forEach(rec => {
                const btn = document.createElement('button');
                btn.className = 'mc-btn';
                btn.style.fontSize = '13px';
                btn.textContent = rec.name;
                btn.onclick = () => {
                    const slot = hotbar[selectedSlot];
                    if (gameMode === 'survival' && (slot.item.id !== rec.req.item.id || slot.count < rec.req.count)) {
                        alert('選択中のホットバーに素材が足りません！');
                        return;
                    }
                    if (gameMode === 'survival') slot.count -= rec.req.count;
                    hotbar[selectedSlot] = { item: rec.result, count: rec.count };
                    updateUI();
                    alert(`${rec.result.name}を作成しました！`);
                };
                craftList.appendChild(btn);
            });
        }

        // --- 10. メインループ（背景回転・昼夜サイクル・物理演算） ---
        // ホーム画面用の初期背景ワールド生成
        buildTerrain('normal', 777);
        camera.position.set(0, 7, 14);

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!isPlaying) {
                // タイトル画面では背景がゆっくり回転する演出
                const angle = time * 0.00015;
                camera.position.x = Math.sin(angle) * 16;
                camera.position.z = Math.cos(angle) * 16;
                camera.lookAt(0, 2, 0);
                renderer.render(scene, camera);
                return;
            }

            if (!isModalOpen) {
                // 昼夜サイクル演出
                worldTime = (worldTime + delta) % 120;
                const isNight = worldTime > 70;
                const skyColor = isNight ? new THREE.Color(0x0d1426) : new THREE.Color(0x87CEEB);
                scene.background.lerp(skyColor, 0.02);
                scene.fog.color.copy(scene.background);
                ambientLight.intensity = isNight ? 0.35 : 0.75;
                document.getElementById('time-display').textContent = isNight ? '夜 🌙' : '昼 ☀️';

                // プレイヤー移動
                const speed = isFlying ? 10.0 : 5.5;
                const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

                let inputForward = (moveForward ? 1 : 0) - (moveBackward ? 1 : 0) - joyY;
                let inputRight = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0) + joyX;

                velocity.x = (forward.x * inputForward + right.x * inputRight) * speed;
                velocity.z = (forward.z * inputForward + right.z * inputRight) * speed;

                if (!isFlying) velocity.y -= 20.0 * delta;

                camera.position.x += velocity.x * delta;
                if (checkCollision(camera.position)) camera.position.x -= velocity.x * delta;
                camera.position.z += velocity.z * delta;
                if (checkCollision(camera.position)) camera.position.z -= velocity.z * delta;
                camera.position.y += velocity.y * delta;
                if (checkCollision(camera.position)) {
                    if (velocity.y < 0) canJump = true;
                    camera.position.y -= velocity.y * delta;
                    velocity.y = 0;
                }

                if (camera.position.y < -15) { camera.position.set(0, 12, 0); velocity.set(0, 0, 0); }

                mobs.forEach(mob => mob.update(delta, camera.position));

                // 採掘進行
                if (isBreaking) {
                    const hit = getTargetBlock();
                    if (hit) {
                        const pos = hit.object.userData.pos;
                        const blockItem = hit.object.userData.item;
                        if (gameMode === 'creative') {
                            removeBlock(pos.x, pos.y, pos.z);
                            isBreaking = false;
                        } else {
                            const reqTime = (blockItem.hardness || 1.0) / (hotbar[selectedSlot].item.miningSpeed || 1.0);
                            miningProgress += delta;
                            const barCont = document.getElementById('mining-bar-container');
                            barCont.style.display = 'block';
                            document.getElementById('mining-bar').style.width = Math.min((miningProgress / reqTime) * 100, 100) + '%';

                            if (miningProgress >= reqTime) {
                                const dropped = removeBlock(pos.x, pos.y, pos.z);
                                if (dropped) addItemToInventory(dropped);
                                miningProgress = 0;
                                barCont.style.display = 'none';
                            }
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function checkCollision(pos) {
            const minX = Math.floor(pos.x - 0.3), maxX = Math.floor(pos.x + 0.3);
            const minY = Math.floor(pos.y - 1.5), maxY = Math.floor(pos.y + 0.2);
            const minZ = Math.floor(pos.z - 0.3), maxZ = Math.floor(pos.z + 0.3);
            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (worldBlocks.has(`${x},${y},${z}`)) return true;
                    }
                }
            }
            return false;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initModals();
        animate();
    </script>
</body>
</html>
