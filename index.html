<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL - OS v7.1 STABLE</title>
    <style>
        body {
            background-color: #020508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        #window-frame {
            width: 100%;
            max-width: 980px;
            height: 90vh;
            background-color: rgba(5, 8, 15, 0.92);
            border: 1px solid #00ffcc66;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .window-header {
            background-color: #0d1322;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #00ffcc33;
        }
        .window-buttons {
            display: flex;
            gap: 8px;
        }
        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .btn-red { background-color: #ff5f56; }
        .btn-yellow { background-color: #ffbd2e; }
        .btn-green { background-color: #27c93f; }
        .window-title {
            margin-left: 15px;
            font-size: 13px;
            color: #8899a6;
            letter-spacing: 1px;
        }
        #terminal {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            padding: 15px;
        }
        #command-form {
            display: flex;
            align-items: center;
            font-size: 15px;
            padding: 12px 15px;
            background-color: #060912;
            border-top: 1px solid #00ffcc33;
        }
        .prompt {
            color: #ff007f;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .warning { color: #ff3366; font-weight: bold; }
        .success { color: #00ffcc; }
        .system { color: #ffaa00; }
        .stream { color: #00aa66; }
        .matrix { color: #00ff00; }
        .dim { color: #335544; }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div id="window-frame">
        <div class="window-header">
            <div class="window-buttons">
                <div class="btn btn-red"></div>
                <div class="btn btn-yellow"></div>
                <div class="btn btn-green"></div>
            </div>
            <div class="window-title">root@cyber-shell:v7.1 (stable-edition)</div>
        </div>

        <div id="terminal">
            <span class="system">=======================================================</span>
            <span class="system">  CYBER TERMINAL v7.1 [STABLE & BUG-FREE FIX]</span>
            <span class="system">=======================================================</span>
            Type <span class="success">jp</span> for Japanese command list, or <span class="success">aut</span> for live stream.
        </div>

        <form id="command-form">
            <span class="prompt">root@cyber:~#</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </form>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        const form = document.getElementById('command-form');
        
        let autoStreamInterval = null;
        let isProcessing = false;

        // 安全なタイピング音（エラーが出ないようにtry-catchで保護）
        function playKeySound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                // 音が出なくてもプログラムが止まらないようにする
            }
        }

        input.addEventListener('keydown', () => { playKeySound(); });

        // 背景マトリックス
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const katakana = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
        const alphabet = katakana + latin;
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const rainDrops = [];

        for (let x = 0; x < columns; x++) rainDrops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 5, 8, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // 画面をクリックしたらフォーカスを維持
        document.addEventListener('click', () => { 
            if (!isProcessing) input.focus(); 
        });

        window.onload = () => { 
            input.focus(); 
        };

        // フォーム送信（Enterキー / 決定ボタン）
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isProcessing) return;

            const cmd = input.value.trim().toLowerCase();
            if (cmd === '') return;
            
            if (cmd !== 'aut' && cmd !== 'stp') stopAutoStream();

            appendOutput(`root@cyber:~# ${cmd}`);
            input.value = '';
            processCommand(cmd);
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function runSimulatedTask(title, successMsg, callback) {
            isProcessing = true;
            input.disabled = true;

            appendOutput(`[*] ${title}...`, "system");
            let progress = 0;
            
            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 25) + 15;
                if (progress >= 100) progress = 100;
                
                const bars = '█'.repeat(Math.floor(progress / 10)) + '░'.repeat(10 - Math.floor(progress / 10));
                terminal.lastChild.textContent = `[*] ${title}... [${bars}] ${progress}%`;

                if (progress === 100) {
                    clearInterval(timer);
                    appendOutput(`[OK] ${successMsg}`, "success");
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                    if (callback) callback();
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }, 90);
        }

        function startAutoStream() {
            if (autoStreamInterval) return;
            appendOutput("[*] LIVE SECURITY STREAM ACTIVATED (Type 'stp' to stop)", "system");

            const streamLogs = [
                "KERNEL: Segment fault avoided at 0x7ffd4a",
                "NET: Inbound packet from 185.220.101.5 [TOR EXIT NODE]",
                "AUTH: Failed login attempt for user 'admin' from 10.0.4.15",
                "SYS: Memory usage stable at 14.2% [OK]",
                "SEC: Firewall block rule applied to port 22 (SSH)",
                "ENCR: AES-256 handshake established with proxy node",
                "AI: Neural network weights verified successfully"
            ];

            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                appendOutput(log, "dim");
            }, 300);
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

        function processCommand(cmd) {
            if (cmd !== 'jp' && cmd.length !== 3) {
                appendOutput(`bash: ${cmd}: command not found. Type 'jp' for help.`, "warning");
                return;
            }

            switch(cmd) {
                case 'jp':
                    appendOutput("==================================================", "system");
                    appendOutput("  【日本語システムコマンド一覧 (全20種 v7.1)】", "system");
                    appendOutput("==================================================", "system");
                    appendOutput("  jp  : 日本語一覧  |  hlp : 英語一覧  |  aut : 監視ログ流し");
                    appendOutput("  stp : ログ停止    |  hak : ハック    |  scn : 脆弱性スキャン");
                    appendOutput("  gen : 鍵生成      |  mtr : マトリックス|  brk : システムクラッシュ");
                    appendOutput("  sat : 衛星接続    |  bck : バックドア  |  ai  : AIコアハック");
                    appendOutput("  inf : IP情報確認  |  pwd : 階層表示    |  ls  : ファイル一覧");
                    appendOutput("  dlc : データDL    |  who : ログイン者  |  cpu : CPU使用率確認");
                    appendOutput("  cls : 画面消去    |  rst : 再起動");
                    break;

                case 'hlp':
                    appendOutput("Commands: jp, hlp, aut, stp, hak, scn, gen, mtr, brk, sat, bck, ai, inf, pwd, ls, dlc, who, cpu, cls, rst", "system");
                    break;

                case 'aut': startAutoStream(); break;
                case 'stp':
                    stopAutoStream();
                    appendOutput("[*] ストリームを停止しました。", "warning");
                    break;

                case 'hak':
                    runSimulatedTask("Bypassing mainframe firewall", "Root privileges granted. Welcome back, Admin.", () => {
                        appendOutput("ACCESS TOKEN: 0x9F8B2C4E1A-ROOT", "success");
                    });
                    break;

                case 'scn':
                    runSimulatedTask("Scanning subnets & vulnerability ports", "Scan complete. 3 open ports detected.", () => {
                        appendOutput("PORT 21 (FTP): VULNERABLE\nPORT 80 (HTTP): SECURE\nPORT 443 (HTTPS): SECURE", "warning");
                    });
                    break;

                case 'gen':
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
                    let key = "";
                    for(let i=0; i<32; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
                    appendOutput(`[GEN] Generated Hash Key: ${key}`, "success");
                    break;

                case 'mtr':
                    appendOutput("[!] INITIALIZING MATRIX STREAM...", "matrix");
                    for(let i=0; i<6; i++) {
                        let line = "";
                        for(let j=0; j<45; j++) line += Math.floor(Math.random() * 2);
                        appendOutput(line, "matrix");
                    }
                    break;

                case 'brk':
                    appendOutput("[!] CRITICAL WARNING: KERNEL PANIC OVERRIDE", "warning");
                    appendOutput("[X] OVERRIDING SECURITY PROTOCOLS...", "warning");
                    document.body.style.backgroundColor = "#ff000022";
                    setTimeout(() => { document.body.style.backgroundColor = "#020508"; }, 1500);
                    break;

                case 'sat':
                    runSimulatedTask("Connecting to Orbital Military Satellite (US-SAT-7)", "Uplink
