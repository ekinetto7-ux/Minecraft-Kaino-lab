 <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laki 動画シアター</title>
    <style>
        /* 🎨 映画館のようなカッコいい黒とピンクのデザイン */
        body {
            background-color: #0d0f12; /* 暗い背景 */
            color: #ffffff; /* 白い文字 */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center; /* 画面の真ん中に集める */
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #ff007f; /* Lakiをイメージしたピンク色の文字 */
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); /* 文字を光らせる */
        }

        p {
            font-size: 14px;
            color: #8a99ad;
            margin-bottom: 25px;
        }

        /* 📺 動画プレイヤーの枠 */
        .video-container {
            width: 100%;
            max-width: 700px; /* パソコンで見るときの最大の横幅 */
            background: #181b22;
            padding: 12px;
            border-radius: 16px; /* カドを丸くする */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); /* 後ろに影をつける */
            border: 2px solid #ff007f; /* ピンクに光る枠線 */
            box-sizing: border-box;
        }

        video {
            width: 100%; /* 画面の幅に合わせて自動でぴったりサイズになる */
            border-radius: 8px;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Laki ミュージックシアター</h1>
    <p>お気に入りの動画を再生するよ！</p>

    <!-- 📺 動画を再生する部分 -->
    <div class="video-container">
        <!-- さっき名前を変えた「laki.mp4」をここで読み込んでいるよ！ -->
        <video src="laki.mp4" controls playsinline></video>
    </div>

</body>
</html>
