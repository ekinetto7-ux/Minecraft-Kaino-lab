<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT TERMINAL</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; padding: 20px; margin: 0; font-size: 16px; }
        #output { width: 100%; height: calc(100vh - 80px); overflow-y: auto; box-sizing: border-box; white-space: pre-wrap; }
        #input-line { display: flex; align-items: center; margin-top: 10px; }
        .prompt { color: #0f0; margin-right: 10px; white-space: nowrap; }
        #cmd-input { background: transparent; border: none; color: #fff; font-family: monospace; font-size: 16px; width: 100%; outline: none; }
        .info { color: #8af; }
        .warn { color: #f55; }
    </style>
</head>
<body>
    <div id="output">=== 🚨 ADMINISTRATIVE INTERFACE INITIALIZED 🚨 ===
[STATUS: ACTIVE] ENTER 'help' TO VIEW AVAILABLE COMMANDS.

</div>
    <div id="input-line">
        <span class="prompt">root@ipad:~#</span>
        <input type="text" id="cmd-input" autofocus autocomplete="off" autocapitalize="none">
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('cmd-input');

        // iPadの画面どこをタップしても常に入力状態（キーボードが出る状態）にする
        document.addEventListener('click', () => input.focus());

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                
                // 入力したコマンドを画面に表示
                output.innerHTML += `<div><span class="prompt">root@ipad:~#</span> <span style="color:#fff">${input.value}</span></div>`;
                
                // コマンドの判定処理
                if (command === 'help') {
                    output.innerHTML += `<div class="info">Available Commands:
  - help      : Show this manual
  - clear     : Clear the terminal screen
  - sysstat   : Check iPad CPU and Memory usage
  - netscan   : Execute network gateway port scan
  - logstream : Start infinite system log stream</div>`;
                } 
                else if (command === 'clear') {
                    output.innerHTML = '';
                } 
                else if (command === 'sysstat') {
                    output.innerHTML += `<div class="info">[MEM_MGR] Fetching core system stats...
[CPU_LOAD] Core 0-3: 14.2% | Core 4-7: 2.5% (STABLE)
[MEMORY]   Active: 2.84 GB / Total: 4.00 GB
[BATTERY]  Voltage: 3.82V | Charging: FALSE</div>`;
                } 
                else if (command === 'netscan') {
                    output.innerHTML += `<div>[NET_SCAN] Initializing port scan on 192.168.1.1...</div>`;
                    let p = 0;
                    let interval = setInterval(() => {
                        let ports =;
                        let currentPort = Math.floor(Math.random() * 1000) + 10;
                        if(Math.random() > 0.8) {
                            output.innerHTML += `<div class="warn">➜ Port ${currentPort}: OPEN (Unauthorized Access Blocked)</div>`;
                        } else {
                            output.innerHTML += `<div class="info">➜ Port ${currentPort}: CLOSED</div>`;
                        }
                        output.scrollTop = output.scrollHeight;
                        p++;
                        if(p > 15) {
                            clearInterval(interval);
                            output.innerHTML += `<div>[NET_SCAN] Scan complete. 0 critical vulnerabilities found.</div>`;
                        }
                    }, 150);
                } 
                else if (command === 'logstream') {
                    output.innerHTML += `<div class="warn">[STREAM] Starting system log loop. Press enter to interrupt.</div>`;
                    window.logLoop = setInterval(() => {
                        let timestamp = `[${new Date().toLocaleTimeString()}]`;
                        output.innerHTML += `<div class="info">${timestamp} [KERNEL] PID:${Math.floor(Math.random()*9000+1000)} -> Task priority executed successfully.</div>`;
                        output.scrollTop = output.scrollHeight;
                    }, 200);
                }
                else {
                    if(window.logLoop) {
                        // logstream起動中に何かエンターを押したら止める処理
                        clearInterval(window.logLoop);
                        window.logLoop = null;
                        output.innerHTML += `<div>[STREAM] Loop interrupted by administrator.</div>`;
                    } else if (command !== "") {
                        output.innerHTML += `<div class="warn">Command not found: '${command}'. Type 'help' for options.</div>`;
                    }
                }

                // 入力欄を空にして最下部へスクロール
                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        });
    </script>
</body>
</html>
