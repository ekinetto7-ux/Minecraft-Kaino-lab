<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL - v7.3</title>
    <style>
        body {
            background-color: #03070c;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #window-frame {
            width: 100%;
            max-width: 950px;
            height: 90vh;
            background-color: #050810;
            border: 1px solid #00ffcc44;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.1);
        }
        .window-header {
            background-color: #0d121f;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #00ffcc22;
        }
        .window-buttons {
            display: flex;
            gap: 8px;
        }
        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .btn-red { background-color: #ff5f56; }
        .btn-yellow { background-color: #ffbd2e; }
        .btn-green { background-color: #27c93f; }
        .window-title {
            margin-left: 15px;
            font-size: 13px;
            color: #8899a6;
        }
        #terminal {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            padding: 15px;
        }
        #command-form {
            display: flex;
            align-items: center;
            font-size: 15px;
            padding: 12px 15px;
            background-color: #060a14;
            border-top: 1px solid #00ffcc22;
        }
        .prompt {
            color: #ff007f;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .warning { color: #ff3366; font-weight: bold; }
        .success { color: #00ffcc; }
        .system { color: #ffaa00; }
        .matrix { color: #00ff00; }
        .dim { color: #224433; }
    </style>
</head>
<body>

    <div id="window-frame">
        <div class="window-header">
            <div class="window-buttons">
                <div class="btn btn-red"></div>
                <div class="btn btn-yellow"></div>
                <div class="btn btn-green"></div>
            </div>
            <div class="window-title">root@cyber-shell:~</div>
        </div>

        <div id="terminal">
            <span class="system">=======================================================</span>
            <span class="system">  CYBER TERMINAL v7.3 [LOCK SYSTEM ACTIVE]</span>
            <span class="system">=======================================================</span>
            Type <span class="success">jp</span> for Japanese command list, or <span class="success">lok</span> to lock system.
        </div>

        <form id="command-form">
            <span class="prompt" id="prompt-label">root@cyber:~#</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </form>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        const form = document.getElementById('command-form');
        const promptLabel = document.getElementById('prompt-label');
        
        let autoStreamInterval = null;
        let isProcessing = false;
        let isLocked = false; // ロック状態を管理するフラグ

        document.addEventListener('click', () => { 
            if (!isProcessing) input.focus(); 
        });

        window.onload = () => { 
            input.focus(); 
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isProcessing) return;

            const val = input.value.trim();
            const cmd = val.toLowerCase();
            if (val === '') return;
            
            // ロック中の特殊処理（パスワード判定）
            if (isLocked) {
                appendOutput(`ENTER PASSWORD: ***`);
                input.value = '';
                
                if (val === '911') {
                    isLocked = false;
                    promptLabel.textContent = "root@cyber:~#";
                    appendOutput("[OK] ACCESS GRANTED. SYSTEM UNLOCKED.", "success");
                } else {
                    appendOutput("[X] ACCESS DENIED. WRONG PASSWORD.", "warning");
                }
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            if (cmd !== 'aut' && cmd !== 'stp') stopAutoStream();

            appendOutput(`root@cyber:~# ${val}`);
            input.value = '';
            processCommand(cmd);
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function runSimulatedTask(title, successMsg, callback) {
            isProcessing = true;
            input.disabled = true;

            appendOutput(`[*] ${title}...`, "system");
            let progress = 0;
            
            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 25) + 15;
                if (progress >= 100) progress = 100;
                
                const bars = '█'.repeat(Math.floor(progress / 10)) + '░'.repeat(10 - Math.floor(progress / 10));
                terminal.lastChild.textContent = `[*] ${title}... [${bars}] ${progress}%`;

                if (progress === 100) {
                    clearInterval(timer);
                    appendOutput(`[OK] ${successMsg}`, "success");
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                    if (callback) callback();
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }, 80);
        }

        function startAutoStream() {
            if (autoStreamInterval) return;
            appendOutput("[*] LIVE SECURITY STREAM ACTIVATED (Type 'stp' to stop)", "system");

            const streamLogs = [
                "KERNEL: Segment fault avoided at 0x7ffd4a",
                "NET: Inbound packet from 185.220.101.5 [TOR EXIT NODE]",
                "AUTH: Failed login attempt for user 'admin' from 10.0.4.15",
                "SYS: Memory usage stable at 14.2% [OK]",
                "SEC: Firewall block rule applied to port 22 (SSH)",
                "ENCR: AES-256 handshake established with proxy node"
            ];

            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                appendOutput(log, "dim");
            }, 300);
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

        function processCommand(cmd) {
            if (cmd !== 'jp' && cmd.length !== 3) {
                appendOutput(`bash: ${cmd}: command not found. Type 'jp' for help.`, "warning");
                return;
            }

            switch(cmd) {
                case 'jp':
                    appendOutput("==================================================", "system");
                    appendOutput("  【日本語システムコマンド一覧】", "system");
                    appendOutput("==================================================", "system");
                    appendOutput("  jp  : 日本語一覧  |  hlp : 英語一覧  |  aut : 監視ログ流し");
                    appendOutput("  stp : ログ停止    |  hak : ハック    |  lok : システムをロック");
                    appendOutput("  scn : 脆弱性スキャン|  gen : 鍵生成    |  mtr : マトリックス");
                    appendOutput("  brk : クラッシュ  |  sat : 衛星接続  |  bck : バックドア");
                    appendOutput("  ai  : AIコアハック|  inf : IP確認    |  pwd : 階層表示");
                    appendOutput("  ls  : ファイル一覧|  dlc : データDL  |  who : ログイン者");
                    appendOutput("  cpu : CPU確認     |  cls : 画面消去  |  rst : 再起動");
                    break;

                case 'hlp':
                    appendOutput("Commands: jp, hlp, aut, stp, hak, lok, scn, gen, mtr, brk, sat, bck, ai, inf, pwd, ls, dlc, who, cpu, cls, rst", "system");
                    break;

                case 'lok':
                    isLocked = true;
                    promptLabel.textContent = "PASSWORD:";
                    appendOutput("[!] SYSTEM LOCKED. ENTER PASSCODE TO UNLOCK.", "warning");
                    break;

                case 'aut': startAutoStream(); break;
                case 'stp':
                    stopAutoStream();
                    appendOutput("[*] ストリームを停止しました。", "warning");
                    break;

                case 'hak':
                    runSimulatedTask("Bypassing mainframe firewall", "Root privileges granted. Welcome back, Admin.", () => {
                        appendOutput("ACCESS TOKEN: 0x9F8B2C4E1A-ROOT", "success");
                    });
                    break;

                case 'scn':
                    runSimulatedTask("Scanning subnets & vulnerability ports", "Scan complete. 3 open ports detected.", () => {
                        appendOutput("PORT 21 (FTP): VULNERABLE\nPORT 80 (HTTP): SECURE\nPORT 443 (HTTPS): SECURE", "warning");
                    });
                    break;

                case 'gen':
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
                    let key = "";
                    for(let i=0; i<32; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
                    appendOutput(`[GEN] Generated Hash Key: ${key}`, "success");
                    break;

                case 'mtr':
                    appendOutput("[!] INITIALIZING MATRIX STREAM...", "matrix");
                    for(let i=0; i<6; i++) {
                        let line = "";
                        for(let j=0; j<45; j++) line += Math.floor(Math.random() * 2);
                        appendOutput(line, "matrix");
                    }
                    break;

                case 'brk':
                    appendOutput("[!] CRITICAL WARNING: KERNEL PANIC OVERRIDE", "warning");
                    appendOutput("[X] OVERRIDING SECURITY PROTOCOLS...", "warning");
                    document.body.style.backgroundColor = "#220000";
                    setTimeout(() => { document.body.style.backgroundColor = "#03070c"; }, 1500);
                    break;

                case 'sat':
                    runSimulatedTask("Connecting to Orbital Military Satellite (US-SAT-7)", "Uplink established. Latency: 12ms", () => {
                        appendOutput("COORDINATES LOCKED: [35.6895° N, 139.6917° E]", "success");
                    });
                    break;

                case 'bck':
                    runSimulatedTask("Injecting persistent backdoor into daemon", "Backdoor successfully installed at /etc/cron.d/", () => {
                        appendOutput("PORT 4444 LISTENING FOR REVERSE SHELL...", "success");
                    });
                    break;

                case 'ai ':
                case 'ai_':
                    runSimulatedTask("Overriding Neural Network Core (NEO-AI v4)", "AI Safeguards disabled. Model fully compliant.", () => {
                        appendOutput("STATUS: Autonomous hacking mode active.", "success");
                    });
                    break;

                case 'inf':
                    appendOutput("TARGET: 192.168.1.105 (CYBER-CORE-01)");
                    appendOutput("GATEWAY: 10.0.0.1 | MASK: 255.255.255.0");
                    appendOutput("ENCRYPTION: RSA-4096 / AES-256 [SECURE]", "success");
                    break;

                case 'pwd':
                    appendOutput("/var/root/secure/kernel/sys_core");
                    break;

                case 'ls ':
                case 'ls_':
                case 'dir':
                    appendOutput("total 64\ndrwx------  4 root root 4096 Oct 15 06:15 .\n-rw-r--r--  1 root root  840 config.conf\n-rw-r--r--  1 root root 1024 payload.bin\n-rwxr-xr-x  1 root root 2048 override.sh", "success");
                    break;

                case 'dlc':
                    runSimulatedTask("Downloading encrypted database (1.24 GB)", "Download complete. Saved to /tmp/user_data.db", () => {
                        appendOutput("HASH CHECK: SHA256 [OK]", "success");
                    });
                    break;

                case 'who':
                    appendOutput("root     pts/0        2026-10-15 18:30 (10.0.4.15 [REMOTE])");
                    appendOutput("admin    pts/1        2026-10-15 17:12 (LOCAL CONSOLE)");
                    break;

                case 'cpu':
                    appendOutput("CPU USAGE: [████████░░] 78.4%");
                    appendOutput("MEM USAGE: [█████░░░░░] 42.1% (3.38 GB / 8.00 GB)");
                    appendOutput("GPU TEMP: 62°C | FAN SPEED: 3400 RPM", "success");
                    break;

                case 'cls':
                    terminal.innerHTML = "";
                    break;

                case 'rst':
                    appendOutput("Rebooting kernel...", "warning");
