<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL - OVERDRIVE SMOOTH EDITION</title>
    <style>
        :root {
            --bg-color: #010206;
            --frame-bg: rgba(2, 6, 18, 0.85);
            --header-bg: rgba(6, 12, 28, 0.9);
            --main-color: #00ffcc;
            --main-glow: rgba(0, 255, 204, 0.6);
            --accent-pink: #ff007f;
            --accent-blue: #00aaff;
            --accent-yellow: #ffcc00;
            --accent-red: #ff1144;
            --accent-purple: #b026ff;
            --border-color: rgba(0, 255, 204, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.5s ease;
            position: relative;
        }

        /* 背景のサイバーオーラ（光のモヤ） */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--main-glow) 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            transition: all 0.5s ease;
        }

        /* 画面走査線（CRT Scanline エフェクト） */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
        }

        /* ホログラム風の枠線と立体感（揺れ・振動なし） */
        #window-frame {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1050px;
            height: 92vh;
            background: var(--frame-bg);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px var(--main-glow), inset 0 0 30px rgba(0, 0, 0, 0.8);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* ヘッダーデザイン */
        .window-header {
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .window-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .window-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }
        .btn-red { background-color: #ff5f56; box-shadow: 0 0 8px #ff5f56; }
        .btn-yellow { background-color: #ffbd2e; box-shadow: 0 0 8px #ffbd2e; }
        .btn-green { background-color: #27c93f; box-shadow: 0 0 8px #27c93f; }

        .window-title {
            font-size: 12px;
            color: #a0b0cb;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .header-status {
            font-size: 10px;
            color: var(--main-color);
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px var(--main-glow);
            text-shadow: 0 0 5px var(--main-color);
            transition: all 0.3s ease;
        }

        /* ターミナル表示エリア */
        #terminal {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
            padding: 22px;
            scroll-behavior: smooth;
            text-shadow: 0 0 5px var(--main-glow);
        }

        /* カスタムスクロールバー */
        #terminal::-webkit-scrollbar {
            width: 6px;
        }
        #terminal::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }
        #terminal::-webkit-scrollbar-thumb {
            background: var(--main-color);
            border-radius: 3px;
            box-shadow: 0 0 10px var(--main-color);
        }

        /* 入力フォーム */
        #command-form {
            display: flex;
            align-items: center;
            font-size: 15px;
            padding: 14px 22px;
            background-color: rgba(0, 0, 0, 0.7);
            border-top: 1px solid var(--border-color);
        }

        .prompt {
            color: var(--accent-pink);
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
            text-shadow: 0 0 8px var(--accent-pink);
        }

        #command-input {
            background: transparent;
            border: none;
            color: var(--main-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            width: 100%;
            text-shadow: 0 0 6px var(--main-color);
        }

        .hidden-input {
            color: transparent !important;
            text-shadow: 0 0 12px var(--main-color);
        }

        /* テキストカラー＆発光クラス */
        .warning { color: #ff3366; font-weight: bold; text-shadow: 0 0 8px #ff3366; }
        .success { color: var(--main-color); text-shadow: 0 0 8px var(--main-color); }
        .system { color: #ffaa00; text-shadow: 0 0 8px #ffaa00; }
        .dev { color: var(--accent-blue); text-shadow: 0 0 8px var(--accent-blue); }
        .police { color: var(--accent-yellow); font-weight: bold; text-shadow: 0 0 10px var(--accent-yellow); }
        .vivant { color: var(--accent-red); font-weight: bold; text-shadow: 0 0 12px var(--accent-red); }
        .matrix { color: #00ff00; text-shadow: 0 0 8px #00ff00; }
        .secret { color: var(--accent-purple); font-weight: bold; text-shadow: 0 0 10px var(--accent-purple); }
        .dim { color: rgba(255, 255, 255, 0.25); }

        /* 画面を揺らさず、枠線が一瞬フワッと発光するスマートな演出 */
        .flash-effect {
            box-shadow: 0 0 80px var(--accent-purple), inset 0 0 40px var(--accent-purple) !important;
        }
    </style>
</head>
<body>

    <!-- 走査線レイヤー -->
    <div class="scanlines"></div>

    <div id="window-frame">
        <div class="window-header">
            <div class="window-left">
                <div class="window-buttons">
                    <div class="btn btn-red"></div>
                    <div class="btn btn-yellow"></div>
                    <div class="btn btn-green"></div>
                </div>
                <div class="window-title" id="shell-title">root@cyber-mainframe:~</div>
            </div>
            <div class="header-status" id="sec-badge">SYSTEM: OVERDRIVE</div>
        </div>

        <div id="terminal">
            <span class="system">==================================================================</span>
            <span class="system">  CYBER TERMINAL v13.1 [SMOOTH OVERDRIVE EDITION]</span>
            <span class="system">==================================================================</span>
            Type <span class="success">jp</span> for commands, <span class="secret">jpl</span> for secrets, or <span class="success">lok</span> to lock.
        </div>

        <form id="command-form">
            <span class="prompt" id="prompt-label">root@cyber:~#</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </form>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');
        const form = document.getElementById('command-form');
        const promptLabel = document.getElementById('prompt-label');
        const secBadge = document.getElementById('sec-badge');
        const shellTitle = document.getElementById('shell-title');
        const windowFrame = document.getElementById('window-frame');
        
        let autoStreamInterval = null;
        let isProcessing = false;
        let isLocked = false;
        let isDevMode = false;
        const devVariables = {};

        document.addEventListener('click', () => { 
            if (!isProcessing) input.focus(); 
        });

        window.onload = () => { 
            input.focus(); 
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isProcessing) return;

            const rawText = input.value;
            const text = rawText.trim();
            if (text === '') return;
            
            input.value = '';

            // ロック中のパスワード判定 (1007)
            if (isLocked) {
                appendOutput(`PASSCODE: *********`);
                if (text === '1007') {
                    isLocked = false;
                    promptLabel.textContent = isDevMode ? "DEV-MODE> " : "root@cyber:~#";
                    promptLabel.style.color = isDevMode ? "#00aaff" : "#ff007f";
                    input.classList.remove('hidden-input');
                    secBadge.textContent = isDevMode ? "MODE: MANUAL DEV" : "SYSTEM: OVERDRIVE";
                    appendOutput("[OK] ACCESS GRANTED. SYSTEM UNLOCKED.", "success");
                } else {
                    appendOutput("[X] ACCESS DENIED. WRONG PASSWORD.", "warning");
                }
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            // 手動コード実行モード（DEV MODE）の処理
            if (isDevMode) {
                appendOutput(`DEV-MODE> ${rawText}`);
                processDevCommand(text);
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            // 通常モード時の自動ログ停止
            if (text.toLowerCase() !== 'aut' && text.toLowerCase() !== 'stp') {
                stopAutoStream();
            }

            appendOutput(`root@cyber:~# ${rawText}`);
            processCommand(text.toLowerCase());
            terminal.scrollTop = terminal.scrollHeight;
        });

        function appendOutput(text, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // 揺れずに枠線が一瞬紫色に光るスマートなパルス演出
        function triggerPulse() {
            windowFrame.classList.add('flash-effect');
            setTimeout(() => {
                windowFrame.classList.remove('flash-effect');
            }, 400);
        }

        function setThemeColor(colorHex, colorGlow, themeName) {
            document.documentElement.style.setProperty('--main-color', colorHex);
            document.documentElement.style.setProperty('--main-glow', colorGlow);
            document.documentElement.style.setProperty('--border-color', colorGlow);
            appendOutput(`[THEME] OVERRIDDEN TO ${themeName} MATRIX.`, "success");
        }

        function runSimulatedTask(title, successMsg, callback) {
            isProcessing = true;
            input.disabled = true;

            appendOutput(`[*] ${title}...`, "system");
            let progress = 0;
            
            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 25) + 15;
                if (progress >= 100) progress = 100;
                
                const bars = '█'.repeat(Math.floor(progress / 10)) + '░'.repeat(10 - Math.floor(progress / 10));
                terminal.lastChild.textContent = `[*] ${title}... [${bars}] ${progress}%`;

                if (progress === 100) {
                    clearInterval(timer);
                    appendOutput(`[OK] ${successMsg}`, "success");
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                    if (callback) callback();
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }, 80);
        }

        // VIVANT極秘ファイル閲覧演出 (vvt)
        function startVivantSecretAnimation() {
            isProcessing = true;
            input.disabled = true;

            secBadge.textContent = "CLASSIFIED: TENTH NODE";
            secBadge.style.color = "#ff1144";

            const logs = [
                "[CLASSIFIED] ACCESSING BALKA DIVISION FINANCIAL ACCOUNTS...",
                "[ENCRYPTION] RSA-4096 / KEY INJECTION IN PROGRESS...",
                "[DATA] FOUND TARGET ACCOUNT: 'TENTH_MONEY_LAUNDRY_09'",
                "[LOG] OVERWRITING TRANSACTION LOGS (3,500,000 USD)...",
                "[SUCCESS] BALKA AGENCY RECORDS COMPROMISED."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], "vivant");
                    index++;
                } else {
                    clearInterval(timer);
                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 180);
        }

        // 手動モード起動アニメーション演出
        function startDevModeAnimation() {
            isProcessing = true;
            input.disabled = true;

            const logs = [
                "[*] INITIALIZING MANUAL DEV ENVIRONMENT...",
                "[*] LOADING VIRTUAL JAVASCRIPT ENGINE v2.4...",
                "[*] ALLOCATING ISOLATED MEMORY HEAP (256MB)...",
                "[*] ATTACHING INTERPRETATIVE REPL SHELL...",
                "[OK] DEV ENVIRONMENT READY."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], index === logs.length - 1 ? "success" : "dev");
                    index++;
                } else {
                    clearInterval(timer);
                    isDevMode = true;
                    promptLabel.textContent = "DEV-MODE> ";
                    promptLabel.style.color = "#00aaff";
                    shellTitle.textContent = "developer@manual_interpreter:~";
                    secBadge.textContent = "MODE: MANUAL DEV";
                    secBadge.style.color = "#00aaff";
                    
                    appendOutput("==================================================", "dev");
                    appendOutput("  【手動コード作成・実行モード（MANUAL DEV）】", "dev");
                    appendOutput("==================================================", "dev");
                    appendOutput("Type 'help' for dev commands, or 'exit' to quit.", "dev");

                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 150);
        }

        // 手動モード終了アニメーション演出
        function exitDevModeAnimation() {
            isProcessing = true;
            input.disabled = true;

            const logs = [
                "[*] CLOSING DEV INTERPRETER...",
                "[*] FLUSHING VIRTUAL HEAP MEMORY...",
                "[*] RESTORING DEFAULT CYBER SHELL..."
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index < logs.length) {
                    appendOutput(logs[index], "system");
                    index++;
                } else {
                    clearInterval(timer);
                    isDevMode = false;
                    promptLabel.textContent = "root@cyber:~#";
                    promptLabel.style.color = "#ff007f";
                    shellTitle.textContent = "root@cyber-mainframe:~";
                    secBadge.textContent = "SYSTEM: OVERDRIVE";
                    appendOutput("[OK] RETURNED TO STANDARD SHELL.", "success");

                    isProcessing = false;
                    input.disabled = false;
                    input.focus();
                }
            }, 120);
        }

        function startAutoStream() {
            if (autoStreamInterval) return;
            appendOutput("[*] LIVE SECURITY STREAM ACTIVATED (Type 'stp' to stop)", "system");

            const streamLogs = [
                "KERNEL: Segment fault avoided at 0x7ffd4a",
                "NET: Inbound packet from 185.220.101.5 [TOR EXIT NODE]",
                "AUTH: Failed login attempt for user 'admin' from 10.0.4.15",
                "SYS: Memory usage stable at 14.2% [OK]",
                "SEC: Firewall block rule applied to port 22 (SSH)",
                "ENCR: AES-256 handshake established with proxy node"
            ];

            autoStreamInterval = setInterval(() => {
                const log = streamLogs[Math.floor(Math.random() * streamLogs.length)];
                appendOutput(log, "dim");
            }, 300);
        }

        function stopAutoStream() {
            if (autoStreamInterval) {
                clearInterval(autoStreamInterval);
                autoStreamInterval = null;
            }
        }

        // 手動コード実行エンジン (DEV MODE)
        function processDevCommand(line) {
            const parts = line.split(' ');
            const subCmd = parts[0].toLowerCase();
            const args = parts.slice(1).join(' ');

            if (subCmd === 'exit') {
                exitDevModeAnimation();
                return;
            }

            if (subCmd === 'help' || subCmd === 'hlp') {
                appendOutput("--- DEV ENGINE COMMANDS ---", "dev");
                appendOutput("calc <式>       : 数学計算の実行 (例: calc (50+30)*2)");
                appendOutput("var <名前> <値>  : 変数の登録 (例: var target 192.168.1.1)");
                appendOutput("echo <名前/$名> : 文字列や変数の出力 (例: echo $target)");
                appendOutput("date            : 現在の正確なシステム時刻を表示");
                appendOutput("vars            : 保存されている全変数を一覧表示");
                appendOutput("exit            : アニメーション付きで手動モードを終了");
                return;
            }

            if (subCmd === 'calc') {
                try {
                    const cleanMath = args.replace(/[^0-9+\-*/().]/g, '');
                    if (!cleanMath) {
                        appendOutput("[DEV ERROR] Invalid calculation expression.", "warning");
                        return;
                    }
                    const res = Function(`'use strict'; return (${cleanMath})`)();
                    appendOutput(`OUTPUT: ${res}`, "dev");
                } catch(e) {
                    appendOutput("[DEV ERROR] Calculation syntax error.", "warning");
                }
                return;
            }

            if (subCmd === 'var') {
                const name = parts[1];
                const val = parts.slice(2).join(' ');
                if (!name || !val) {
                    appendOutput("Usage: var <name> <value>", "warning");
                    return;
                }
                devVariables[name] = val;
                appendOutput(`[DEV] Variable '$${name}' set to '${val}'`, "dev");
                return;
            }

            if (subCmd === 'echo') {
                if (args.startsWith('$')) {
                    const varName = args.substring(1);
                    if (devVariables[varName] !== undefined) {
                        appendOutput(devVariables[varName], "dev");
                    } else {
                        appendOutput(`[DEV WARNING] Variable '$${varName}' is undefined.`, "warning");
                    }
                } else {
                    appendOutput(args, "dev");
                }
                return;
            }

            if (subCmd === 'vars') {
                appendOutput("--- STORED DEV VARIABLES ---", "dev");
                const keys = Object.keys(devVariables);
                if (keys.length === 0) {
                    appendOutput("(No variables saved yet)", "dim");
                } else {
                    keys.forEach(k => appendOutput(`$${k} = ${devVariables[k]}`, "dev"));
                }
                return;
            }

            if (subCmd === 'date') {
                appendOutput(`SYSTEM DATE: ${new Date().toLocaleString()}`, "dev");
                return;
            }

            appendOutput(`DevEngine: command not found: '${subCmd}'. Type 'help'.`, "warning");
        }

        function processCommand(cmd) {
            // シークレット＆カラー切り替えコマンド
            if (cmd === 'matrix_on') {
                appendOutput("[SECRET] OVERRIDING MAINFRAME MATRIX VISUALS...", "matrix");
                document.body.style.backgroundColor = "#001100";
                setTimeout(() => { document.body.style.backgroundColor = "#010206"; }, 2000);
                return;
            }

            if (cmd === 'red') { setThemeColor('#ff1144', 'rgba(255, 17, 68, 0.6)', 'RED'); return; }
            if (cmd === 'blu') { setThemeColor('#00aaff', 'rgba(0, 170, 255, 0.6)', 'CYBER BLUE'); return; }
            if (cmd === 'grn') { setThemeColor('#00ff66', 'rgba(0, 255, 102, 0.6)', 'MATRIX GREEN'); return; }
            if (cmd === 'amb') { setThemeColor('#ffaa00', 'rgba(255, 170, 0, 0.6)', 'AMBER RETRO'); return; }
            if (cmd === 'vvt') { startVivantSecretAnimation(); return; }

            const validCommands = ['jp', 'jpl', 'hlp', 'aut', 'stp', 'man', 'pol', 'viv', 'lok', 'geo', 'dec', 'dos', 'err', 'scn', 'gen', 'mtr', 'brk', 'sat', 'bck', 'ai', 'inf', 'pwd', 'ls', 'dir', 'dlc', 'who', 'cpu', 'cls', 'rst'];

            if (!validCommands.includes(cmd)) {
                appendOutput(`bash: ${cmd}: command not found. Type 'jp'.`, "warning");
                return;
            }

            switch(cmd) {
                case 'jp':
                    appendOutput("==================================================", "system");
                    appendOutput("  【日本語システムコマンド一覧 (v13.1 OVERDRIVE)】", "system");
                    appendOutput("==================================================", "system");
                    appendOutput("  jp  : 日本語一覧  |  hlp : 英語一覧  |  aut : 監視ログ流し");
                    appendOutput("  stp : ログ停止    |  man : 手動開発  |  pol : 警察連携");
                    appendOutput("  viv : VIVANTモード|  lok : ロック    |  geo : 位置情報");
                    appendOutput("  dec : 暗号総当り  |  dos : DDoS攻撃  |  err : エラー");
                    appendOutput("  scn : スキャン    |  gen : 鍵生成    |  mtr : マトリクス");
                    appendOutput("  brk : クラッシュ  |  sat : 衛星接続  |  bck : バックドア");
                    appendOutput("  ai  : AIコアハック|  inf : IP確認    |  pwd : 階層表示");
                    appendOutput("  ls  : ファイル一覧|  dlc : Data DL   |  who : ログイン者");
                    appendOutput("  cpu : CPU確認     |  cls : 画面消去  |  rst : 再起動");
                    appendOutput("  (ヒント: 隠しコードを表示するには 'jpl' を入力)");
                    break;

                case 'jpl':
                    triggerPulse();
                    appendOutput("==================================================", "secret");
                    appendOutput("  【TOP SECRET: シークレットコマンドリスト】", "secret");
                    appendOutput("==================================================", "secret");
                    appendOutput("  vvt       : VIVANTバルカ極秘アカウント侵入ログ", "secret");
                    appendOutput("  red       : テーマカラーを「深紅（RED）」に変更", "secret");
                    appendOutput("  blu       : テーマカラーを「サイバーブルー」に変更", "secret");
                    appendOutput("  grn       : テーマカラーを「クラシックグリーン」に変更", "secret");
                    appendOutput("  amb       : テーマカラーを「レトロオレンジ」に変更", "secret");
                    appendOutput("  matrix_on : 画面全体のビジュアル緊急オーバーライド", "secret");
                    break;

                case 'hlp':
                    appendOutput("Commands: jp, jpl, hlp, aut, stp, man, pol, viv, lok, geo, dec, dos, err, scn, gen, mtr, brk, sat, bck, ai, inf, pwd, ls, dir, dlc, who, cpu, cls, rst", "system");
                    break;

                case 'viv':
                    runSimulatedTask("Launching VIVANT Operations Override", "Vivant mode activated.", () => {
                        appendOutput("ALERT: TARGET DATABASE BALKA DIVISION COMPROMISED.", "vivant");
                    });
                    break;

                case 'ai':
                    runSimulatedTask("Overriding Neural Network Core (NEO-AI v4)", "AI Safeguards disabled.", () => {
                        appendOutput("STATUS: Autonomous hacking mode active.", "success");
                    });
                    break;

                case 'pol':
                    runSimulatedTask("Establishing VPN tunnel to National Police Cyber Agency", "Link verified.", () => {
                        appendOutput("[POLICE INTERFACE] Connected to Cyber Incident Response Center.", "police");
                    });
                    break;

                case 'man':
                    startDevModeAnimation();
                    break;

                case 'lok':
                    isLocked = true;
                    promptLabel.textContent = "PASSCODE:";
                    promptLabel.style.color = "#ff3366";
                    input.classList.add('hidden-input');
                    secBadge.textContent = "SYSTEM: LOCKED";
                    secBadge.style.color = "#ff3366";
                    appendOutput("[!] SYSTEM LOCKED. ENTER PASSCODE (1007) TO UNLOCK.", "warning");
                    break;

                case 'geo':
                    runSimulatedTask("TrIangulating target geolocation coordinates", "Target node located.", () => {

                case 'aut': startAutoStream(); break;

                case 'gen':
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
                    let key = "";
                    for(let i=0; i<32; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
                    appendOutput(`[GEN] Generated Key: ${key}`, "success");
                    break;

                case 'mtr':
                    appendOutput("[!] INITIALIZING MATRIX STREAM...", "matrix");
                    for(let i=0; i<6; i++) {
                        let line = "";
                        for(let j=0; j<45; j++) line += Math.floor(Math.random() * 2);
                        appendOutput(line, "matrix");
                    }
                    break;

                case 'brk':
                    appendOutput("[!] CRITICAL OVERRIDE ACTIVATED", "warning");
                    break;

                case 'sat':
                    runSimulatedTask("Connecting to Military Satellite", "Uplink established.", () => {
                        appendOutput("COORDINATES LOCKED: US-SAT-7", "success");
                    });
                    break;

                case 'bck':
                    runSimulatedTask("Injecting backdoor", "Backdoor installed.", () => {
                        appendOutput("PORT 4444 LISTENING...", "success");
                    });
                    break;

                case 'inf':
                    appendOutput("TARGET: 192.168.1.105 (CYBER-CORE-01)");
                    break;

                case 'pwd':
                    appendOutput("/var/root/secure/kernel/sys_core");
                    break;

                case 'ls':
                case 'dir':
                    appendOutput("total 64\n-rw-r--r-- config.conf\n-rw-r--r-- payload.bin\n-rwxr-xr-x override.sh", "success");
                    break;

                case 'dlc':
                    runSimulatedTask("Downloading database", "Complete.", () => {
                        appendOutput("SHA256 [OK]", "success");
                    });
                    break;

                case 'who':
                    appendOutput("root pts/0 2026-11-03 (REMOTE)");
                    break;

                case 'cpu':
                    appendOutput("CPU USAGE: [████████░░] 78.4%");
                    break;

                case 'cls':
                    terminal.innerHTML = "";
                    break;

                case 'rst':
                    appendOutput("Rebooting kernel...", "warning");
                    isProcessing = true;
                    input.disabled = true;
                    setTimeout(() => {
                        terminal.innerHTML = '<span class="system">=== SYSTEM RESTARTED ===</span>\nType <span class="success">jp</span> for commands.';
                        secBadge.textContent = "SYSTEM: OVERDRIVE";
                        isProcessing = false;
                        input.disabled = false;
                        input.focus();
                    }, 1000);
                    break;
            }
        }
